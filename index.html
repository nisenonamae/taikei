  week:   ["週を締めた", (c, o, t) => { [523, 659, 784].forEach(f => { tone(c, o, f, t, 1.4, "sine", .22); tone(c, o, f * 2.01, t, .6, "sine", .05); }); tone(c, o, 1047, t + .18, 1.2, "sine", .14); }],
  buffer: ["予備を使った", (c, o, t) => { tone(c, o, 150, t, .25, "sine", .6, 110); noise(c, o, t, .08, .25, 400); }],
  warn:   ["予備が足りない", (c, o, t) => { tone(c, o, 587, t, .2, "triangle", .32); tone(c, o, 494, t + .22, .32, "triangle", .3); }],
  replan: ["立て直した", (c, o, t) => { noise(c, o, t, .18, .18, 2400); tone(c, o, 440, t + .08, .14, "sine", .3); tone(c, o, 587, t + .18, .14, "sine", .3); tone(c, o, 740, t + .28, .28, "sine", .32); }],
  gavel:  ["評議会で可決", (c, o, t) => { [0, .2].forEach(d => { noise(c, o, t + d, .07, .9, 1200); tone(c, o, 220, t + d, .12, "triangle", .45, 160); }); }],
  close:  ["計画を終えた", (c, o, t) => { [392, 494, 587].forEach(f => tone(c, o, f, t, .9, "sine", .2)); [523, 659, 784].forEach(f => tone(c, o, f, t + .45, 1.6, "sine", .2)); }],
};
function se(name){
  if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }   // 大事な出来事の音が鳴るときは、軽い音を重ねない
  if (!seCfg.on || !SE_LIST[name]) return; const c = ctxA(); if (!c) return;
  const out = c.createGain(); out.gain.value = seCfg.vol * 0.9; out.connect(c.destination); SE_LIST[name][1](c, out, c.currentTime + 0.02);
}
/* 操作の音:すべての操作で鳴る軽い音。毎回少し高さを変えて、飽きにくくする */
const jit = () => 1 + (Math.random() - .5) * .12;
const UI_LIST = {
  tap:    ["ボタン・札を押す", (c, o, t) => { const f = 1180 * jit(); tone(c, o, f, t, .07, "sine", .45); tone(c, o, f * 1.5, t, .04, "sine", .12); }],
  tab:    ["タブを切り替える", (c, o, t) => { noise(c, o, t, .09, .22, 3200); tone(c, o, 880 * jit(), t + .02, .08, "sine", .25, 1320); }],
  open:   ["画面が開く", (c, o, t) => { tone(c, o, 520 * jit(), t, .13, "sine", .4, 900); }],
  shut:   ["画面が閉じる", (c, o, t) => { tone(c, o, 860 * jit(), t, .12, "sine", .32, 480); }],
  dive:   ["中へ入る", (c, o, t) => { tone(c, o, 330 * jit(), t, .22, "triangle", .3, 990); tone(c, o, 1320, t + .14, .1, "sine", .14); }],
  up:     ["上へ戻る", (c, o, t) => { tone(c, o, 990 * jit(), t, .2, "triangle", .26, 440); }],
  on:     ["チェックを入れる", (c, o, t) => { noise(c, o, t, .03, .5, 2600); tone(c, o, 1480 * jit(), t, .06, "square", .08); }],
  off:    ["チェックを外す", (c, o, t) => { noise(c, o, t, .03, .45, 1500); tone(c, o, 740 * jit(), t, .06, "square", .07); }],
  pick:   ["選ぶ・数字を確定", (c, o, t) => { tone(c, o, 1600 * jit(), t, .035, "triangle", .3); }],
};
function uiSound(name){ if (!seCfg.ui || !UI_LIST[name]) return; const c = ctxA(); if (!c) return; const out = c.createGain(); out.gain.value = seCfg.uiVol * 0.8; out.connect(c.destination); UI_LIST[name][1](c, out, c.currentTime + 0.005); }
/* どの操作かを見分けて、軽い音を予約する。同じ押す操作の中で大事な出来事の音が鳴れば、取り消す */
const DIVE = "[data-reqin],[data-fin],[data-goplan],[data-testgo],[data-relgo],[data-pick],[data-v='week']";
const UP = "[data-requp],[data-fup],[data-reqto],[data-fto],[data-allplans],.pcrumb button,[data-testgo='']";
let sheetWas = false;
document.addEventListener("click", e => {
  const b = e.target.closest("button,[data-relgo],[data-sclose],label,input[type=checkbox],input[type=range]"); if (!b || b.disabled) return;
  if (b.matches("label") || b.matches("input")) return;          // チェックは change で鳴らす
  sheetWas = !!$("sheet-root").innerHTML;
  let kind = b.closest("nav.tabs") ? "tab" : b.matches(UP) ? "up" : b.matches("[data-msopen]") ? (b.getAttribute("aria-expanded") === "true" ? "up" : "dive") : b.matches(DIVE) ? "dive" : "tap";
  if (b.matches("[data-setry]")) return;                          // 試し聞きのときは、その音だけ
  if (tapTimer) clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapTimer = null; const now = !!$("sheet-root").innerHTML; uiSound(!sheetWas && now ? "open" : sheetWas && !now && kind === "tap" ? "shut" : kind); }, 0);
}, true);
document.addEventListener("change", e => { const t = e.target;
  if (t.matches("[data-seon],[data-uion],[data-sevol],[data-uivol]")) return;
  if (tapTimer) clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapTimer = null; uiSound(t.type === "checkbox" ? (t.checked ? "on" : "off") : "pick"); }, 0); }, true);

function viewSound(){
  const row = (k, lab, ui) => `<div class="wkrow"><div><b>${esc(lab)}</b></div><button class="btn ghost sm" data-setry="${ui ? "ui:" : ""}${k}">▶ 聞く</button></div>`;
  return backMore + `<div class="phead"><div class="goal">音</div><div class="note">ふつうの操作は軽い音、大事な出来事は特別な音。特別な音が鳴るときは、軽い音は重ねない。</div></div>
    <div class="card"><h4>操作の音<small>すべての操作で鳴る</small></h4><label class="chk" style="display:flex;margin:.1rem 0 .4rem"><input type="checkbox" data-uion${seCfg.ui ? " checked" : ""}> 鳴らす</label>
      <div class="f"><label>音量</label><input type="range" min="0" max="1" step="0.05" value="${seCfg.uiVol}" data-uivol style="width:100%"></div></div>
    <div class="card"><h4>大事な出来事の音<small>記録・自己ベスト・週の締めなど</small></h4><label class="chk" style="display:flex;margin:.1rem 0 .4rem"><input type="checkbox" data-seon${seCfg.on ? " checked" : ""}> 鳴らす</label>
      <div class="f"><label>音量</label><input type="range" min="0" max="1" step="0.05" value="${seCfg.vol}" data-sevol style="width:100%"></div></div>
    <section class="sec"><h3>操作の音<small>押すと試し聞き</small></h3>${Object.entries(UI_LIST).map(([k, [lab]]) => row(k, lab, true)).join("")}</section>
    <section class="sec"><h3>大事な出来事の音</h3>${Object.entries(SE_LIST).map(([k, [lab]]) => row(k, lab, false)).join("")}</section>`;
}
</script>
<script>
/* ───────── 予備の層:日 → 週 → 月 → 計画 → 立て直し ─────────
   日の予備:週のペースを「7日」でなく「n日分」で組む(残りの日が日の予備)
   週の予備:週のペースに届かなくても、この割合までなら週の中で吸収したことにする
   月の予備:毎月補充される予備日。計画の予備:期日の手前の大きな予備 */
const wdays = p => Math.max(1, Math.min(7, +p.workDays || 6));
const wbufPct = p => p.wbuf != null && p.wbuf !== "" ? +p.wbuf : 15;
const mPer = p => p.mbuf && p.mbuf.perMonth != null ? +p.mbuf.perMonth : 2;
const mUsedNow = p => ((p.mbuf && p.mbuf.uses) || []).filter(u => u.date.slice(0, 7) === TODAY.slice(0, 7)).reduce((a, u) => a + u.days, 0);
const mLeft = p => Math.max(0, mPer(p) - mUsedNow(p));
/* 週の実績の判定:届いた/週の予備で吸収/足りない */
function weekJudge(p, done, target){ if (done == null) return null; if (done >= target) return "届いた"; return done >= target * (1 - wbufPct(p) / 100) ? "吸収" : "足りない"; }

/* ───────── 毎日の確認・週の見直し ─────────
   計画そのものを見に行き、そのページの下で「問題なし/不安がある/直した」を記録する。
   不安と直した内容は書いて残し、週の見直しでまとめて読む */
const RES = ["問題なし", "不安がある", "直した"];
const OLD = { 順調: "問題なし", 少し遅れ: "不安がある", 大きくずれ: "直した" };
function chkRec(d, pid){ const v = dailyChecks[d + "|" + pid]; if (!v) return null; return typeof v === "string" ? { r: OLD[v] || v, note: "" } : v; }
const chk = (d, pid) => { const r = chkRec(d, pid); return r ? r.r : null; };
function wrevRec(w, pid){ return weeklyReviews[w + "|" + pid] || null; }
function lastCheck(p){ let best = null; Object.keys(dailyChecks).forEach(k => { const [d, pid] = k.split("|"); if (pid === p.id && (!best || d > best)) best = d; });
  const kz = p.changes.filter(c => c.kind === "改造").map(c => c.date).sort().pop(); if (kz && (!best || kz > best)) best = kz; return best; }
const activeOrdered = () => orderedPlans().filter(p => !drafting(p));
const pendingToday = () => activeOrdered().filter(p => !chkRec(TODAY, p.id));
const thisWeek = () => weekStart(TODAY);
const pendingWeek = () => activeOrdered().filter(p => !wrevRec(thisWeek(), p.id) && p.start <= addD(thisWeek(), 6));
const fromDay = p => [p.start, p.created, p.startedAt, since].filter(Boolean).sort().pop();   // この日より前は「抜け」に数えない
const weekLeftDays = () => days(TODAY, addD(thisWeek(), 6));   // 日曜まであと何日
/* 前の週の見直しを、やらずに過ぎた計画 */
const missedLastWeek = () => activeOrdered().filter(p => fromDay(p) <= addD(thisWeek(), -7) && !wrevRec(addD(thisWeek(), -7), p.id));
let peekOverview = false;

/* どの画面でも、見出しの下に出る「やること」の帯 */
function dueBar(){
  const pt = pendingToday(), pw = pendingWeek(), wl = weekLeftDays(), cur = current() === "plan" && P(planId);
  const items = [];
  if (pt.length) { const here = cur && pt.includes(cur);
    items.push(`<button class="due d1" data-due="today"><b>今日の確認</b><span>${here ? "この計画を見たら、いちばん下で確認する" : "のこり " + pt.length + "本 › " + esc(pt[0].name) + " へ"}</span></button>`); }
  if (pw.length && (wl <= 2 || missedLastWeek().length)) items.push(`<button class="due d2${wl === 0 ? " hot" : ""}" data-v="week"><b>今週の見直し</b><span>のこり ${pw.length}本・${wl === 0 ? "今日まで" : "日曜まであと" + wl + "日"}</span></button>`);
  const lateP = plans.filter(p => !p.status).flatMap(p => probesOf(p).filter(pLate).map(x => ({ p, x })));
  if (lateP.length) items.push(`<button class="due d4" data-goplan="${lateP[0].p.id}" data-ptab="探り"><b>探りの期限が過ぎている</b><span>${lateP.length}件 › ${esc(lateP[0].x.title)}(${esc(lateP[0].p.name)})。結果を書くか、期限を直す</span></button>`);
  if (missedLastWeek().length) items.push(`<button class="due d3" data-v="week"><b>先週の見直しが抜けている</b><span>${missedLastWeek().length}本。今週の見直しで取り戻す</span></button>`);
  return items.join("");
}
/* 全体図のいちばん上:確認が済むまで、ここだけが出る */
function todayGate(){
  const ps = activeOrdered(); if (!ps.length) return { html: "", gate: false };
  const pt = pendingToday(), all = !pt.length;
  const dots = Array.from({ length: 28 }, (_, i) => addD(TODAY, i - 27)).map(d => { const n = ps.filter(p => chkRec(d, p.id)).length;
    return `<i class="dcd${n ? (n >= ps.length ? " full" : " some") : ""}${d === TODAY ? " now" : ""}" title="${md(d)} ${n}本"></i>`; }).join("");
  const rows = ps.map(p => { const c = chkRec(TODAY, p.id);
    return `<div class="dcrow2"><div class="dcn"><b>${esc(p.name)}</b><small>${c ? `<span class="rs r-${c.r}">${c.r}</span>${c.note ? " " + esc(c.note) : ""}` : "まだ"}</small></div>
      <button class="btn ${c ? "ghost " : ""}sm" data-goplan="${p.id}" data-ptab="図">${c ? "見る" : "見に行く"}</button></div>`; }).join("");
  const html = `<section class="sec"><div class="today${all ? " done" : ""}"><div class="th2"><span><b>${all ? "今日の確認は済んだ" : "今日の確認"}</b><small>${ps.length - pt.length}/${ps.length}本・計画を開いて見てから、そのページの下で確認する</small></span><span class="dots">${dots}</span></div>
    ${all && !peekOverview ? "" : `<div class="dcbody">${rows}</div>`}</div></section>`;
  return { html, gate: !all };
}
/* 計画のページのいちばん下:今日の確認(と、今週の見直しの状況) */
let dcDraft = {};
function startPanel(p){
  const c = completeness(p), miss = c.items.filter(x => !x.ok);
  return `<div class="cpanel start"><h4>作成中の計画</h4><p class="note" style="margin:0 0 .4rem">いまは自由に組み立てる段階。直しても歩みには残らず、確認や危険度の対象にもならない。形ができたら始める。始めたあとの直しは、すべて普通の修正として残る(作成中には戻れない)。</p>
    <div class="note" style="margin:0 0 .4rem">完成度 <b style="color:var(--ink)">${c.score}%</b>${miss.length ? "・まだ:" + miss.map(x => esc(x.k)).join("、") : "・点検はすべて済み"}</div>
    ${probesOf(p).filter(pOpen).length ? `<div class="note" style="margin:0 0 .4rem;color:var(--mid)">まだ結果の出ていない探りが ${probesOf(p).filter(pOpen).length}件ある。材料がそろってから始めるほうがいい(始めることはできる)。</div>` : ""}
    <button class="btn" data-planstart="${p.id}">この計画を始める</button></div>`;
}
function checkPanel(p){
  if (p.status) return ""; if (drafting(p)) return startPanel(p);
  const c = chkRec(TODAY, p.id), d = dcDraft[p.id], todays = p.changes.filter(x => x.date === TODAY && !["確認", "作成"].includes(x.kind));
  const chosen = d ? d.r : null, wr = wrevRec(thisWeek(), p.id);
  const form = chosen && chosen !== "問題なし" ? `<div class="f"><label>${chosen === "直した" ? "何を直したか(必ず書く)" : "何が不安か(必ず書く)"}</label><textarea id="dc-note" placeholder="${chosen === "直した" ? "例:過去問のペースを1.5年分/週にした。冬の模試と重なるので" : "例:学校の課題が増えそうで、来週のペースが心配"}">${esc(d.note || "")}</textarea></div>
      ${chosen === "直した" && todays.length ? `<div class="note">今日この計画で変えたこと:${todays.map(x => esc(x.what + (x.after ? "(" + x.after + ")" : ""))).join("、")}</div>` : ""}
      <button class="btn sm" data-dcsave="${p.id}">確認を残す</button>` : "";
  return `<div class="cpanel${c ? " done" : ""}" id="cpanel"><h4>今日の確認${c ? ` <span class="rs r-${c.r}">${c.r}</span>` : ""}</h4>
    ${c && !d ? `${c.note ? `<p style="margin:.1rem 0 .3rem">${esc(c.note)}</p>` : ""}<button class="linkx" data-dcedit="${p.id}">書き直す</button>`
      : `<p class="note" style="margin:0 0 .4rem">この計画を見て、今日の時点で問題がないかを確かめる。問題があったら、その場で直してから「直した」を選ぶ。</p>
      <div class="seg dcseg" role="group" aria-label="今日の確認">${RES.map(x => `<button data-dcpick="${p.id}|${x}" aria-pressed="${chosen === x}">${x}</button>`).join("")}</div>${form}`}
    <p class="note" style="margin:.5rem 0 0">今週の見直し:${wr ? `<span class="rs r-${wr.r}">${wr.r}</span>` : `まだ(日曜まで)<button class="linkx" data-v="week" style="margin-left:.3rem">週の見直しへ</button>`}</p></div>`;
}

/* ───────── 週の記録(数字を入れるだけ) ───────── */
function viewWeekRec(){
  const w = thisWeek(), we = addD(w, 6);
  const rows = live().flatMap(p => lanesOf(p).flatMap(l => { if (l.closed) return [];
    return laneMs(p, l).filter(m => !isDone(m) && m.pace && m.total).map((m, i) => ({ p, l, m, ahead: i > 0, from: prevDate(p, m), cur: (m.weeks || []).find(x => x.w === w) })); }));
  const dueT = tests.filter(t => !P(t.plan) || !P(t.plan).status).filter(t => nextDue(t) <= we);
  return `<div class="phead"><div class="k">週の記録</div><div class="goal">${wk(w)}(${md(w)}〜${md(we)})</div><div class="note">やった量とテストを入れるだけ。見直しは「週の見直し」で、別にやる。</div></div>
    <section class="sec"><h3>今週やった量</h3>${rows.map(({ p, l, m, cur, ahead, from }) => `<div class="wkrow"><div><b>${esc(p.name)}</b><small>${multiLane(p) ? laneCode(p, l) + " " + esc(l.name) + "・" : ""}節目「${m.plan ? esc(msName(m)) : tx(m.name, p)}」・ペース ${fmtN(m.pace.amount)}${esc(m.pace.unit)}${ahead && from > we ? `・<span style="color:var(--wave)">先取り(期間は${md(from)}から)</span>` : ""}</small>${defChip(m)}</div><input type="number" step="0.5" inputmode="decimal" data-wkv="${p.id}:${m.id}" value="${cur ? cur.done : ""}"><span class="note">${esc(m.unit || "")}</span></div>`).join("") || '<p class="note">ペースのある節目はない。</p>'}
      ${rows.length ? '<button class="btn sm" data-wkall>まとめて記録する</button>' : ""}</section>
    <section class="sec"><h3>今週の実力テスト<small>${dueT.length}つ</small></h3>${dueT.map(t => `<div class="wkrow"><div><b>${esc(t.name)}</b><small>${P(t.plan) ? esc(P(t.plan).name) : ""}・${days(TODAY, nextDue(t)) < 0 ? -days(TODAY, nextDue(t)) + "日遅れ" : md(nextDue(t)) + "まで"}</small></div><button class="btn ghost sm" data-testrec="${t.id}">実施して記録</button></div>`).join("") || '<p class="note">今週のテストはない。</p>'}</section>`;
}

/* ───────── 週の見直し(計画ごとに必ず) ───────── */
let wrOpen = {}, wrDraft = {};
function weekSummary(p, w){
  const we = addD(w, 6), out = [];
  lanesOf(p).forEach(l => { const m = nextLaneMs(p, l); if (!(m && m.pace && m.total)) return; const x = (m.weeks || []).find(y => y.w === w), j = x ? weekJudge(p, x.done, m.pace.amount) : null;
    out.push((multiLane(p) ? laneCode(p, l) + "(" + l.rank + ")" + l.name + ":" : "量:") + (x ? fmtN(x.done) + "/" + fmtN(m.pace.amount) + (m.unit || "") + "(" + (j === "吸収" ? "週の予備で吸収" : j) + ")" : "まだ記録していない(週の記録で入れる)")); });
  const bu = (p.buffer ? p.buffer.uses : []).concat((p.mbuf && p.mbuf.uses) || []).filter(u => u.date >= w && u.date <= we); if (bu.length) out.push("予備:" + bu.reduce((a, u) => a + u.days, 0) + "日使った");
  const pd = probesOf(p).filter(x => x.status === "済" && x.result && x.result.date >= w && x.result.date <= we).length, pl = probesOf(p).filter(pLate).length;
  if (pd || pl) out.push("探り:" + (pd ? "今週 " + pd + "件の結果が出た" : "") + (pd && pl ? "・" : "") + (pl ? "期限切れ " + pl + "件" : ""));
  const r = risk(p); out.push("危険度:" + r.score + "(" + r.level + ")・いちばん効いている:" + r.parts[0].k);
  const notes = Array.from({ length: 7 }, (_, i) => addD(w, i)).map(d => [d, chkRec(d, p.id)]).filter(([, c]) => c && c.r !== "問題なし");
  const missed = Array.from({ length: 7 }, (_, i) => addD(w, i)).filter(d => d < TODAY && d >= fromDay(p) && !chkRec(d, p.id)).length;
  return { lines: out, notes, missed };
}
function viewWeek(){
  const w = thisWeek(), we = addD(w, 6), ps = activeOrdered(), pw = pendingWeek(), wl = weekLeftDays();
  const card = p => { const rv = wrevRec(w, p.id), s = weekSummary(p, w), open = wrOpen[p.id] != null ? wrOpen[p.id] : !rv, d = wrDraft[p.id];
    const chosen = d ? d.r : null;
    return `<div class="wrv${rv ? " done" : ""}"><button class="wrh" data-wropen="${p.id}"><span><b>${esc(p.name)}</b><small>${rv ? `<span class="rs r-${rv.r}">${rv.r}</span>${rv.note ? " " + esc(rv.note) : ""}` : "まだ"}</small></span><span class="note">${open ? "▴" : "▾"}</span></button>
      ${open ? `<div class="wrb"><ul class="wsum">${s.lines.map(x => `<li>${esc(x)}</li>`).join("")}${s.missed ? `<li style="color:var(--bad)">今週、毎日の確認が ${s.missed}日 抜けている</li>` : ""}</ul>
        <div class="bl">今週の毎日の確認で書いたこと</div>${s.notes.map(([dd, c]) => `<div class="wkn"><span class="note">${md(dd)}</span> <span class="rs r-${c.r}">${c.r}</span> ${esc(c.note)}</div>`).join("") || '<p class="note" style="margin:.1rem 0">なし(毎日「問題なし」)</p>'}
        <div class="fbar" style="margin:.5rem 0 .2rem"><button class="btn ghost sm" data-goplan="${p.id}" data-ptab="図">計画を開いて見る</button></div>
        <div class="seg dcseg" role="group" aria-label="週の見直し">${["問題なし", "不安がある", "直した", "改造に回す"].map(x => `<button data-wrpick="${p.id}|${x}" aria-pressed="${chosen === x || (!d && rv && rv.r === x)}">${x}</button>`).join("")}</div>
        ${chosen && chosen !== "問題なし" ? `<div class="f"><label>${chosen === "直した" ? "何を直したか(必ず書く)" : chosen === "改造に回す" ? "何を組み直すか(必ず書く)" : "何が不安か(必ず書く)"}</label><textarea id="wr-note-${p.id}">${esc(d.note || "")}</textarea></div>` : ""}
        ${chosen ? `<button class="btn sm" data-wrsave="${p.id}">見直しを残す</button>` : ""}</div>` : ""}</div>`; };
  return `<div class="phead"><div class="k">週の見直し</div><div class="goal">${wk(w)}(${md(w)}〜${md(we)})</div><div class="note">計画ごとに、この1週間を振り返って決める。数字を入れるのは「週の記録」で、別にやる。${pw.length ? "のこり " + pw.length + "本・" + (wl === 0 ? "今日まで" : "日曜まであと" + wl + "日") : "今週の見直しは全部済んだ"}</div>
      <div class="fbar" style="margin:.4rem 0 0"><button class="btn ghost sm" data-v="weekrec">週の記録へ</button></div></div>
    ${missedLastWeek().length ? `<div class="gap"><b>先週の見直しが抜けている計画:</b>${missedLastWeek().map(p => esc(p.name)).join("、")}。今週の見直しで、2週分まとめて振り返る。</div>` : ""}
    <section class="sec">${ps.map(card).join("") || '<p class="note">計画がない。</p>'}</section>
    <section class="sec"><h3>来週の見通し<small>${wk(addD(w, 7))}</small></h3>${(() => { const nw = addD(w, 7), ld = live().reduce((a, p) => a + weekHours(p, nw), 0), cp = capOf(nw);
      return `<div class="wkrow"><div><b>使う時間の見込み ${fmtN(ld)}時間 / 使える時間 ${cp}時間</b><small>${ld > cp ? "使える時間を超えている" : "おさまっている"}</small></div><button class="btn ghost sm" data-v="load">負荷を見る</button></div>`; })()}</section>`;
}

/* ───────── 操作(確認・見直し) ───────── */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.due === "today") { const pt = pendingToday(); if (!pt.length) return; const cur = current() === "plan" && P(planId);
    if (cur && pt.includes(cur)) { const el = $("cpanel"); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    goPlan(pt[0].id, "図"); return; }
  if (b.hasAttribute("data-peek")) { peekOverview = true; render(); return; }
  if (d.dcpick) { const [pid, r] = d.dcpick.split("|"); dcDraft[pid] = { r, note: (dcDraft[pid] || {}).note || "" };
    if (r === "問題なし") { saveCheck(pid, r, ""); return; } render(); setTimeout(() => { const t = $("dc-note"); if (t) t.focus(); }, 30); return; }
  if (d.dcsave) { const pid = d.dcsave, note = ($("dc-note") || {}).value || ""; if (!note.trim()) { toast("内容を書いてください(あとで振り返るため)"); return; } saveCheck(pid, dcDraft[pid].r, note.trim()); return; }
  if (d.dcedit) { const c = chkRec(TODAY, d.dcedit); dcDraft[d.dcedit] = { r: c.r, note: c.note }; render(); return; }
  if (d.wropen) { const rv = wrevRec(thisWeek(), d.wropen); wrOpen[d.wropen] = !(wrOpen[d.wropen] != null ? wrOpen[d.wropen] : !rv); render(); return; }
  if (d.wrpick) { const [pid, r] = d.wrpick.split("|"); const el = $("wr-note-" + pid); wrDraft[pid] = { r, note: el ? el.value : (wrDraft[pid] || {}).note || "" }; render(); return; }
  if (d.wrsave) { const pid = d.wrsave, dr = wrDraft[pid], el = $("wr-note-" + pid), note = el ? el.value.trim() : "";
    if (dr.r !== "問題なし" && !note) { toast("内容を書いてください(あとで振り返るため)"); return; }
    const w = thisWeek(); weeklyReviews[w + "|" + pid] = { r: dr.r, note, at: TODAY }; const p = P(pid);
    if (dr.r === "改造に回す" && !p.draft) p.needsKaizo = TODAY;
    delete wrDraft[pid]; wrOpen[pid] = false; const all = !pendingWeek().length; render(); se(all ? "week" : "rec"); if (all) toast("今週の見直しは全部済んだ。お疲れさま"); return; }
});
function saveCheck(pid, r, note){
  dailyChecks[TODAY + "|" + pid] = { r, note, at: new Date().toTimeString().slice(0, 5) }; delete dcDraft[pid];
  const all = !pendingToday().length; render(); se(all ? "best" : "rec");
  if (all) { toast("今日の確認は全部済んだ"); } else { const nx = pendingToday()[0]; toast("確認を残した。次は「" + nx.name + "」"); }
}

/* ───────── 改造:下書きで組み直し、前と比べてから反映する ───────── */
const DRAFT_KEYS = ["name", "ministry", "grade", "why", "goal", "start", "end", "lanes", "milestones", "buffer", "hpw", "manualProgress", "oneShot", "workDays", "wbuf", "mbuf"];
function startDraft(p){ const data = {}; DRAFT_KEYS.forEach(k => { if (p[k] !== undefined) data[k] = clone(p[k]); }); p.draft = { started: TODAY, data, log: [] }; }
function draftObj(p){ return Object.assign(clone(p.draft.data), { id: p.id, fixed: p.fixed, rels: p.rels, changes: p.draft.log, ifs: p.ifs, basis: p.basis, works: p.works, versions: [], fields: p.fields, req: p.req }); }
function saveDraftObj(p, o){ const data = {}; DRAFT_KEYS.forEach(k => { if (o[k] !== undefined) data[k] = o[k]; }); p.draft.data = data; p.draft.log = o.changes; }
function applyDraft(p, why){
  const snap = { date: TODAY, label: md(TODAY) + "の改造の前", ms: {}, end: p.end }; p.milestones.forEach(m => snap.ms[m.id] = m.date); p.versions.push(snap);
  const n = p.draft.log.length, detail = p.draft.log.map(c => c.what + ":" + c.before + " → " + c.after);
  DRAFT_KEYS.forEach(k => { if (p.draft.data[k] !== undefined) p[k] = p.draft.data[k]; else delete p[k]; });
  p.changes.push({ date: TODAY, kind: "改造", what: "計画を改造した", before: md(p.draft.started) + "からの下書き", after: n + "か所を変えた", reason: why || "(理由なし)", size: "大", detail });
  delete p.draft; delete p.needsKaizo; cmpVer = p.versions.length - 1;
}
function draftBanner(p){
  if (!p.draft) return p.needsKaizo ? `<div class="kz"><b>改造の印</b><span class="note">${md(p.needsKaizo)}の確認で「大きくずれ」。時間をとれるときに組み直す。</span><div class="fbar" style="margin:.3rem 0 0"><button class="btn sm" data-kzstart>改造の下書きを始める</button><button class="linkx" data-kzunmark>印を外す</button></div></div>` : "";
  return `<div class="kz on"><b>改造の下書き</b><span class="note">${md(p.draft.started)}から・${p.draft.log.length}か所を変えた。何日かに分けて進めてよい。反映するまで今の計画はそのまま。</span>
    <div class="fbar" style="margin:.3rem 0 0"><button class="btn sm" data-kzedit>下書きを直す</button><button class="btn ghost sm" data-kzcmp>前と比べる</button><button class="btn ghost sm" data-kzapply>反映する</button><button class="linkx" data-kzdrop>下書きをやめる</button></div></div>`;
}
function openDraftCompare(p){
  const o = draftObj(p);
  sheet(`<h3>改造:前と比べる</h3><div class="pkh">今の計画</div>${band(p)}<div class="pkh">下書き</div>${band(o)}
    <div class="pkh">変えたところ(${p.draft.log.length})</div>${p.draft.log.map(c => `<div class="wkrow"><div><b>${esc(c.what)}</b><small><del>${esc(c.before)}</del> → ${esc(c.after)}</small></div></div>`).join("") || '<p class="note">まだ変えていない。</p>'}`);
}

/* ───────── 操作(改造) ───────── */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  const p = P(planId); if (!p) return;
  if (b.hasAttribute("data-kzstart")) { startDraft(p); closeSheet(); ptab = "図"; render(); toast("改造の下書きを始めた。反映するまで今の計画はそのまま"); return; }
  if (b.hasAttribute("data-kzunmark")) { delete p.needsKaizo; render(); return; }
  if (b.hasAttribute("data-kzedit")) { openEdit(draftObj(p), "", "draft"); return; }
  if (b.hasAttribute("data-kzcmp")) { openDraftCompare(p); return; }
  if (b.hasAttribute("data-kzdrop")) { if (!confirm("改造の下書きをやめる?(今の計画はそのまま)")) return; delete p.draft; render(); return; }
  if (b.hasAttribute("data-kzapply")) { sheet(`<h3>改造を反映する</h3><p class="note">${p.draft.log.length}か所の変更を、今の計画に反映する。前の形は版として残り、図で比べられる。</p><div class="f"><label>改造の理由(歩みに残る)</label><textarea id="kz-why" placeholder="例:冬の模試の日程が出たので、節目を組み直した"></textarea></div><button class="btn" data-kzgo>反映する</button>`); return; }
  if (b.hasAttribute("data-kzgo")) { takeUndo(); applyDraft(p, $("kz-why").value.trim()); closeSheet(); ptab = "図"; render(); se("replan"); toast("改造を反映した。図で前の版と比べられる"); return; }
});
</script>
<script>
/* ───────── 探り:計画を作るための材料を取りに行く(調査・実験・演習) ─────────
   知りたいこと・決めること・期限を決めて行い、分かったことを残す。
   「もし結果がこうなら」は参考の文章として何本でも書いておける(結果のときに選んだりはしない) */
const PKINDS = { 調査: { mark: "調", word: "調べて知る" }, 実験: { mark: "実", word: "やってみて効くか確かめる" }, 演習: { mark: "演", word: "試しにやって量・時間・難しさを測る" } };
const probesOf = p => (p.probes || []);
const pbadge = k => `<span class="pb k-${k}" title="${k}:${PKINDS[k].word}">${PKINDS[k].mark}</span>`;
const pOpen = x => x.status !== "済";
const pLate = x => pOpen(x) && x.limit && x.limit < TODAY;
const waitingFor = (p, m) => probesOf(p).filter(x => pOpen(x) && (x.ms || []).includes(m.id));
let probeOpen = {};
/* 見出し(左・薄い)と、自分で書いた中身(右・濃い)を分けて並べる */
const kv = (k, v) => v ? `<div class="pkv"><span class="k">${k}</span><span class="v">${v}</span></div>` : "";
/* 計画の中の「探り」タブ */
function tabProbe(p){
  const xs = probesOf(p), grp = [["実施中", xs.filter(x => x.status === "実施中")], ["これから", xs.filter(x => x.status === "予定" || !x.status)], ["済んだ", xs.filter(x => x.status === "済").sort((a, b) => (b.result || {}).date < (a.result || {}).date ? -1 : 1)]];
  const card = x => { const l = lanesOf(p).find(z => z.id === x.lane), ms = (x.ms || []).map(id => p.milestones.find(m => m.id === id)).filter(Boolean), open = probeOpen[x.id] != null ? probeOpen[x.id] : x.status !== "済", r = x.result;
    return `<div class="pcard k-${x.kind}${pLate(x) ? " late" : ""}" id="probe-${x.id}"><button class="pch" data-probeopen="${x.id}">${pbadge(x.kind)}<span class="pct"><b>${esc(x.title)}</b><small>${x.status === "済" ? "済・" + md(r.date) : x.limit ? (pLate(x) ? '<span style="color:var(--bad)">期限を' + -days(TODAY, x.limit) + "日過ぎ</span>" : "期限 " + md(x.limit) + "・" + ago(days(TODAY, x.limit))) : "期限なし"}${x.hours ? "・上限 " + x.hours + "時間" : ""}${multiLane(p) && l ? "・" + laneCode(p, l) + " " + esc(l.name) : ""}</small></span><span class="note">${open ? "▴" : "▾"}</span></button>
      ${open ? `<div class="pcb">
        <div class="pkvs">
        ${kv("知りたいこと", esc(x.question))}
        ${kv("決めること", esc(x.decides))}
        ${kv("予想", x.predict ? esc(x.predict) + (x.unit ? `<span class="u">${esc(x.unit)}</span>` : "") : "")}
        ${kv("待っている節目", ms.map(m => esc(msName(m)) + `<span class="u">${md(m.date)}</span>`).join("、"))}
        ${kv("もし結果がこうなら", (x.notes || []).length ? `<ul class="pnotes">${x.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : "")}
        </div>
        ${r ? `<div class="pres"><div class="prh">結果<span>${md(r.date)}</span></div>
          ${kv("分かったこと", esc(r.found))}
          ${kv("実際の値", r.actual ? `<b>${esc(r.actual)}</b><span class="u">${esc(x.unit || "")}</span>${x.predict ? `<span class="u">予想 ${esc(x.predict)}</span>` : ""}` : "")}
          ${kv("予想との違い", esc(r.diff))}
          ${kv("かかった時間", r.spent ? esc(r.spent) + "時間" + (x.hours ? `<span class="u">上限 ${x.hours}時間</span>` : "") : "")}</div>` : ""}
        <div class="fbar" style="margin:.4rem 0 0">${x.status === "予定" || !x.status ? `<button class="btn ghost sm" data-probestart="${x.id}">始める</button>` : ""}${x.status !== "済" ? `<button class="btn sm" data-proberes="${x.id}">結果を書く</button>` : `<button class="btn ghost sm" data-proberes="${x.id}">結果を直す</button>`}<button class="btn ghost sm" data-probeedit="${x.id}">探りを直す</button><button class="linkx" data-probedel="${x.id}" style="color:var(--bad)">消す</button></div></div>` : ""}</div>`; };
  return `<p class="note" style="margin-top:0">計画を作るのに足りない材料を取りに行く。何を知りたいか・それで何を決めるか・いつまでにやるかを決めてから始め、分かったことを残す。</p>
    <div class="fbar"><span class="note">探りを足す:</span>${Object.keys(PKINDS).map(k => `<button class="btn ghost sm pkadd" data-probenew="${k}">${pbadge(k)} ${k}</button>`).join("")}</div>
    <div class="pklegend">${Object.entries(PKINDS).map(([k, v]) => `<span>${pbadge(k)} ${k}:${v.word}</span>`).join("")}</div>
    ${grp.map(([t, ys]) => ys.length ? `<section class="sec"><h3>${t}<small>${ys.length}件</small></h3>${ys.map(card).join("")}</section>` : "").join("") || '<p class="note">まだ探りはない。仮の節目や、見積もりがつかないところがあれば、探りで確かめてから決める。</p>'}`;
}
/* 道のり・図に出す小さな印 */
function roadProbes(p, l){ const xs = probesOf(p).filter(x => pOpen(x) && (!l || !x.lane || x.lane === l.id || !lanesOf(p).some(z => z.id === x.lane)));
  return xs.length ? `<div class="rprobes">${xs.map(x => `<button class="rpr${pLate(x) ? " late" : ""}" data-probego="${x.id}">${pbadge(x.kind)}<span>${esc(x.title)}</span><small>${x.limit ? (pLate(x) ? "期限切れ" : md(x.limit)) : ""}${x.status === "実施中" ? "・実施中" : ""}</small></button>`).join("")}</div>` : ""; }
/* 探りを作る・直す */
function openProbe(p, x, kind){
  const v = x || { kind: kind || "調査", notes: [] }, L = lanesOf(p);
  const noteRow = n => `<div class="er pnote" style="display:block"><button type="button" class="rowrm" data-rowrm aria-label="この行を消す(保存しなくてよい)">×</button><textarea data-pn rows="2" placeholder="例:1題に10分以上かかるなら、IIBの演習量を減らし、その分を解き直しに回す">${esc(n || "")}</textarea></div>`;
  sheet(`<h3>${x ? "探りを直す" : "探りを足す"}</h3>
    <div class="seg dcseg" role="group" aria-label="種類" style="margin-bottom:.4rem">${Object.keys(PKINDS).map(k => `<button data-pkind="${k}" aria-pressed="${v.kind === k}">${pbadge(k)} ${k}</button>`).join("")}</div>
    <p class="note" id="pk-word" style="margin:0 0 .3rem">${PKINDS[v.kind].word}</p>
    <input type="hidden" id="pk-k" value="${v.kind}">
    <div class="f"><label>名前</label><input id="pk-t" value="${esc(v.title || "")}" placeholder="例:青チャートIAを10題解いて時間を測る"></div>
    <div class="f"><label>知りたいこと(問い)</label><textarea id="pk-q" rows="2" placeholder="例:1題に何分かかるか。どの単元で詰まるか">${esc(v.question || "")}</textarea></div>
    <div class="f"><label>これで決めること</label><input id="pk-d" value="${esc(v.decides || "")}" placeholder="例:IAを一周する節目の日付と、週のペース"></div>
    <div class="row2"><div class="f"><label>期限</label><input id="pk-l" type="date" value="${v.limit || addD(TODAY, 7)}"></div><div class="f"><label>かける時間の上限(時間)</label><input id="pk-h" type="number" step="0.5" min="0" value="${v.hours ?? ""}" placeholder="例:2"></div></div>
    <div class="row2"><div class="f"><label>予想(やる前の見込み)</label><input id="pk-p" value="${esc(v.predict || "")}" placeholder="例:1題6分くらい"></div><div class="f"><label>測る単位(あれば)</label><input id="pk-u" value="${esc(v.unit || "")}" placeholder="例:分/題"></div></div>
    ${L.length > 1 ? `<div class="f"><label>道筋</label><select id="pk-ln"><option value="">計画全体</option>${L.map(l => `<option value="${l.id}"${v.lane === l.id ? " selected" : ""}>${laneCode(p, l)} ${esc(l.name)}(${l.rank})</option>`).join("")}</select></div>` : ""}
    ${mainMs(p).length ? `<div class="f"><label>結果を待っている節目(この探りで日付や量が決まるもの)</label><div class="pmlist">${mainMs(p).map(m => `<label class="chk"><input type="checkbox" data-pm="${m.id}"${(v.ms || []).includes(m.id) ? " checked" : ""}> ${esc(msName(m))}(${md(m.date)}・${m.type})</label>`).join("")}</div></div>` : ""}
    <h4 class="eh">もし結果がこうなら(参考)<small class="note" style="font-weight:400;letter-spacing:0"> 文章で、何本でも</small></h4>
    <div id="pk-notes">${(v.notes && v.notes.length ? v.notes : [""]).map(noteRow).join("")}</div><button class="linkx addrow" data-pnrow>+ もう1つ書く</button>
    <div style="margin-top:.6rem"><button class="btn" data-probesave="${x ? x.id : ""}">${x ? "直す" : "足す"}</button></div>`);
  window.__pnoteRow = noteRow;
}
/* 結果を書く */
function openProbeResult(p, x){
  const r = x.result || {}, ms = (x.ms || []).map(id => p.milestones.find(m => m.id === id)).filter(m => m && m.pace);
  sheet(`<h3>${pbadge(x.kind)} 結果を書く</h3><p style="margin:.1rem 0 .3rem"><b>${esc(x.title)}</b></p>
    <div class="pkvs pref">${kv("知りたいこと", esc(x.question))}${kv("決めること", esc(x.decides))}${kv("予想", x.predict ? esc(x.predict) + (x.unit ? `<span class="u">${esc(x.unit)}</span>` : "") : "")}
    ${kv("もし結果がこうなら", (x.notes || []).filter(Boolean).length ? `<ul class="pnotes">${x.notes.filter(Boolean).map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : "")}</div>
    <div class="f"><label>分かったこと(必ず書く)</label><textarea id="pr-f" rows="4" placeholder="例:IAの例題は平均8分。整数と確率で詰まる">${esc(r.found || "")}</textarea></div>

<script>
/* ───────── 計算できるメモ ─────────
   「3000÷365」「3000÷365=」のような行に答えを出す。「単語 = 3000」で名前を付けると、あとの行で使える。
   期間の日数・期間の週数・残りの日数・残りの週数 は最初から使える */
const MEMO_WORDS = p => ({ 期間の日数: days(p.start, p.end) + 1, 期間の週数: Math.round((days(p.start, p.end) + 1) / 7 * 10) / 10, 残りの日数: Math.max(0, days(TODAY, p.end)), 残りの週数: Math.round(Math.max(0, days(TODAY, p.end)) / 7 * 10) / 10 });
const zen2han = s => s.replace(/[０-９．，]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[（]/g, "(").replace(/[）]/g, ")").replace(/[＋]/g, "+").replace(/[ー−－]/g, "-").replace(/[＊]/g, "*").replace(/[／]/g, "/").replace(/[＝]/g, "=").replace(/[％]/g, "%");
/* 式を読む(eval は使わない):足し算・引き算・掛け算・割り算・かっこ・べき・名前 */
function calcExpr(src, vars){
  const s = zen2han(src).replace(/×/g, "*").replace(/÷/g, "/").replace(/,/g, "");
  const toks = []; let i = 0;
  while (i < s.length) { const c = s[i];
    if (/\s/.test(c)) { i++; continue; }
    if (/[0-9.]/.test(c)) { let j = i; while (j < s.length && /[0-9.]/.test(s[j])) j++; const v = parseFloat(s.slice(i, j)); if (isNaN(v)) throw 0; toks.push(["n", v]); i = j; continue; }
    if ("+-*/^()%".includes(c)) { toks.push(["o", c]); i++; continue; }
    let j = i; while (j < s.length && !/[\s0-9.+\-*/^()%=]/.test(s[j])) j++;
    if (j === i) throw 0; const name = s.slice(i, j); if (!(name in vars)) throw "name:" + name; toks.push(["n", vars[name], name]); i = j; }
  let k = 0, used = 0;
  const peek = () => toks[k], take = () => toks[k++];
  const prim = () => { const t = take(); if (!t) throw 0;
    if (t[0] === "n") { if (t[2]) used++; let v = t[1]; if (peek() && peek()[1] === "%") { take(); v = v / 100; } return v; }
    if (t[1] === "(") { const v = add(); const c = take(); if (!c || c[1] !== ")") throw 0; return v; }
    if (t[1] === "-") return -prim(); if (t[1] === "+") return prim(); throw 0; };
  const pow = () => { let v = prim(); while (peek() && peek()[1] === "^") { take(); v = Math.pow(v, prim()); } return v; };
  const mul = () => { let v = pow(); while (peek() && (peek()[1] === "*" || peek()[1] === "/")) { const o = take()[1], r = pow(); v = o === "*" ? v * r : v / r; } return v; };
  const add = () => { let v = mul(); while (peek() && (peek()[1] === "+" || peek()[1] === "-")) { const o = take()[1], r = mul(); v = o === "+" ? v + r : v - r; } return v; };
  const v = add(); if (k !== toks.length) throw 0;
  const ops = toks.filter(t => t[0] === "o" && "+-*/^%".includes(t[1])).length;
  return { v, ops, used };
}
const fmtCalc = v => { if (!isFinite(v)) return "計算できない(0で割っている)"; const r = Math.round(v * 100) / 100; const t = r.toLocaleString("ja-JP", { maximumFractionDigits: 2 }); return Number.isInteger(r) ? t : t + "(切り上げ " + Math.ceil(v).toLocaleString("ja-JP") + "・切り捨て " + Math.floor(v).toLocaleString("ja-JP") + ")"; };
/* メモの各行を計算する */
function calcMemo(text, p){
  const vars = Object.assign({}, MEMO_WORDS(p)), out = [];
  String(text || "").split("\n").forEach((raw, i) => { const line = raw.trim(); if (!line) return;
    let body = line.includes("：") || line.includes(":") ? line.split(/[:：]/).pop().trim() : line;
    const def = /^([^\s0-9０-９=＝+\-*/×÷()（）^%]+)\s*[=＝]\s*(.+)$/.exec(body);
    try {
      if (def && !/[=＝]\s*$/.test(body)) { const r = calcExpr(def[2], vars); vars[def[1]] = r.v; out.push({ i, line, name: def[1], v: r.v }); return; }
      body = body.replace(/[=＝]\s*[?？]?\s*$/, "").trim(); if (!body) return;
      const r = calcExpr(body, vars); if (r.ops || r.used) out.push({ i, line, v: r.v });
    } catch (e) { if (typeof e === "string" && e.startsWith("name:") && /[×÷*/+^＋＊／]|\s-\s/.test(body)) out.push({ i, line, err: "「" + e.slice(5) + "」が分からない(先に「" + e.slice(5) + " = 数」と書く)" }); }
  });
  return out;
}
function memoResults(p, text){
  const rs = calcMemo(text, p);
  return rs.length ? rs.map(r => `<div class="mres${r.err ? " err" : ""}"><span class="ml">${esc(r.line.length > 28 ? r.line.slice(0, 28) + "…" : r.line)}</span><span class="mv">${r.err ? esc(r.err) : (r.name ? esc(r.name) + " = " : "= ") + esc(fmtCalc(r.v))}</span></div>`).join("") : '<p class="note" style="margin:.2rem 0">計算できる行があると、ここに答えが出る。</p>';
}
function memoBox(p, id){
  const w = MEMO_WORDS(p);
  return `<textarea id="${id}" class="memo-t" data-live rows="8" placeholder="例:&#10;単語 = 3000&#10;単語 ÷ 365&#10;単語 ÷ 残りの週数&#10;1日あたり:3000÷365=">${esc(p.memo || "")}</textarea>
    <div class="memo-res" id="${id}-res">${memoResults(p, p.memo || "")}</div>
    <p class="note" style="margin:.3rem 0 0">使える言葉:${Object.entries(w).map(([k, v]) => `<b>${k}</b>(${v})`).join("・")}。「名前 = 式」で名前を付けると、あとの行で使える。書いたそばから保存される。</p>`;
}
function tabMemo(p){ return `<div class="card"><h4>メモ<small>計算もできる</small></h4>${memoBox(p, "memo-t")}</div>`; }
/* 書いたそばから保存し、答えも書き直す */
let memoTimer = null;
document.addEventListener("input", e => { const t = e.target; if (!t.matches || !t.matches("textarea.memo-t")) return; const p = P(planId); if (!p) return;
  p.memo = t.value; const box = document.getElementById(t.id + "-res"); if (box) box.innerHTML = memoResults(p, t.value);
  clearTimeout(memoTimer); memoTimer = setTimeout(persist, 600); });
</script>
<script>

    takeUndo(); if (x.id) { const i = koubouTypes.findIndex(y => y.id === x.id); koubouTypes[i] = x; } else { x.id = "kt" + uid(); koubouTypes.push(x); } closeSheet(); render(); toast("型を残した", true); return; }

  /* 工房へ */
  if (d.kbopen) { openKoubou(d.kbopen); return; }

    sheet(`<h3>機構を作る</h3><div class="f"><label>機構の名前</label><input id="kbn-n" placeholder="例:英単語のAnkiカードを一気に作る機構"></div><div class="f"><label>系統</label><select id="kbn-l">${techLanes.map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join("")}</select></div><button class="btn" data-kbnewgo>工房で作り始める</button>`); return; }
  if (b.hasAttribute("data-kbnewgo")) { const n = $("kbn-n").value.trim(); if (!n) { toast("名前を入れてください"); return; } takeUndo(); const lid = $("kbn-l").value, fr = tkFront(lid);
    const t = { id: "tk" + uid(), lane: lid, parent: fr ? fr.id : "", pre: [], name: n, st: "ひらめき", notes: [], created: TODAY }; techs.push(t); openKoubou(t.id, "tech"); return; }
  const t = kbT(), m = t && t.mech;
  if (b.hasAttribute("data-kbback")) { const f = kbFrom; kbId = ""; if (f !== "tech" && P(f)) goPlan(f, "技術"); else location.hash = "tech"; return; }
  if (!t) return;
  if (d.kbtype) { kbPick = d.kbtype; render(); return; }
  if (b.hasAttribute("data-kbstart")) { if (!kbPick) return; takeUndo(); kbStart(t, kbPick); render(); se("week"); return; }
  if (!m) return;
  const go = k => { kbIns = null; m.i = Math.max(0, Math.min(m.steps.length, k)); render(); const c = document.querySelector(".kbstep"); if (c) c.scrollIntoView({ behavior: "smooth", block: "center" }); const ta = $("kb-ans"); if (ta) setTimeout(() => ta.focus({ preventScroll: true }), 80); };

  if (b.hasAttribute("data-kbedit")) { kbEdit = !kbEdit; kbIns = null; render(); return; }
  if (b.hasAttribute("data-kbprev")) { go(m.i - 1); return; }

    if (!was) { if (s.kind === "頼む") m.log.push({ d: TODAY, v: m.ver, k: "頼んだ", t: m.ver > 1 ? "直しを頼んだ:" + m.lastFix : "Claudeに作ってもらった" }); if (s.kind === "試す") m.log.push({ d: TODAY, v: m.ver, k: "試した", t: s.answer.trim() || "試して、問題なし" }); if (s.kind === "する") m.log.push({ d: TODAY, v: m.ver, k: "やった", t: s.title }); }

    takeUndo(); m.log.push({ d: TODAY, v: m.ver, k: "試した", t: v }); m.lastFix = v; m.ver++; const ai = m.steps.findIndex(x => x.kind === "頼む");
    m.steps.forEach((x, k) => { if (ai >= 0 && k >= ai) { x.done = false; if (x.kind === "試す") x.answer = ""; } }); m.i = ai >= 0 ? ai : m.i; render(); se("replan"); toast("版" + m.ver + "の依頼文ができた", true); return; }
  if (b.hasAttribute("data-kblive")) { takeUndo(); m.log.push({ d: TODAY, v: m.ver, k: "使い始めた", t: "版" + m.ver + "を使い始めた" }); t.st = "定着"; t.at = TODAY; render(); se("best"); tkUnlockFx(t.name); return; }
  if (b.hasAttribute("data-kbundo1")) { takeUndo(); m.steps[m.i].done = false; render(); toast("済を取り消した", true); return; }
  if (b.hasAttribute("data-kbredo")) { if (!confirm(m.i + 1 + "手目から後ろを、全部「まだ」に戻す?(書いた答えは残る)")) return; takeUndo(); m.steps.forEach((x, k) => { if (k >= m.i) x.done = false; }); render(); toast("ここからやり直す", true); return; }

  if (d.kbsk) { $("kbs-k").value = d.kbsk; document.querySelectorAll("[data-kbsk]").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.kbsk === d.kbsk))); return; }
  if (d.kbssave != null && b.hasAttribute("data-kbssave")) { const s = m.steps[+d.kbssave]; if (!s) return; const ti = $("kbs-t").value.trim(); if (!ti) { toast("問い・一手の名前を入れてください"); return; } takeUndo(); s.kind = $("kbs-k").value; s.title = ti; s.hint = $("kbs-h").value.trim(); s.ex = $("kbs-e").value; closeSheet(); render(); toast("一手を直した", true); return; }
  if (d.kbup != null && b.hasAttribute("data-kbup")) { const k = +d.kbup; if (k <= 0) return; takeUndo(); [m.steps[k - 1], m.steps[k]] = [m.steps[k], m.steps[k - 1]]; if (m.i === k) m.i--; else if (m.i === k - 1) m.i++; render(); return; }
  if (d.kbdn != null && b.hasAttribute("data-kbdn")) { const k = +d.kbdn; if (k >= m.steps.length - 1) return; takeUndo(); [m.steps[k + 1], m.steps[k]] = [m.steps[k], m.steps[k + 1]]; if (m.i === k) m.i++; else if (m.i === k + 1) m.i--; render(); return; }

  if (b.hasAttribute("data-kbaddmany")) { const ls = $("kb-ad-many").value.split("\n").map(x => x.replace(/^[\s・\-*\d.、)）]+/, "").trim()).filter(Boolean); if (!ls.length) return; takeUndo();
    const at = Math.min(kbIns != null ? kbIns + 1 : m.i + 1, m.steps.length); kbIns = at + ls.length - 1; m.steps.splice(at, 0, ...ls.map(ti => kbStep({ kind: /頼む|依頼/.test(ti) ? "頼む" : /試す|確かめ/.test(ti) ? "試す" : /[?？]$/.test(ti) ? "書く" : "する", title: ti }))); render(); se("week"); toast(ls.length + "手を足した", true); return; }
  if (b.hasAttribute("data-kbrailreq")) { kbCopy(kbRailReq(t, m)); return; }
  if (b.hasAttribute("data-kbsavetype")) { const nm = prompt("自分の型の名前", kbLabel(m.type) + "(" + t.name.slice(0, 10) + ")"); if (!nm) return; takeUndo();
    koubouTypes.push({ id: "kt" + uid(), name: nm.trim(), steps: m.steps.map(x => ({ kind: x.kind, title: x.title, hint: x.hint, ex: x.ex })) }); render(); toast("型を残した(次の機構で選べる)", true); return; }
});

<script>
/* ───────── 関係 ───────── */
let relMode = "focus", relId = "", relKinds = new Set(["前提", "支え", "一部"]);
function viewRel(){
  const toggle = `<div class="fbar"><span class="seg" role="group" aria-label="見せ方"><button data-relmode="focus" aria-pressed="${relMode === "focus"}">中心の計画</button><button data-relmode="all" aria-pressed="${relMode === "all"}">全体の地図</button></span></div>`;
  return toggle + (relMode === "all" ? relMap() : relFocus());
}
function relFocus(){
  if (!orderedPlans().length) return emptyPlans();
  if (!P(relId)) relId = orderedPlans()[0].id;
  const p = P(relId), r = risk(p);
  const ins = k => plans.filter(q => q.rels.some(x => x.to === p.id && x.kind === k)), outs = k => p.rels.filter(x => x.kind === k).map(x => P(x.to));
  const relKey = (q, k) => p.rels.some(r => r.to === q.id && r.kind === k) ? p.id + "|" + q.id + "|" + k : q.id + "|" + p.id + "|" + k;
  const card = (q, k) => { const rr = risk(q); return `<div class="relrow"><button class="relc" data-relgo="${q.id}">${seal(q.grade)}<span><b>${esc(q.name)}</b><small>${esc(q.ministry)}・進捗 ${prog(q)}%・危険度 <b class="lv-${rr.level}" style="background:none">${rr.score}</b></small></span></button><button class="reldel" data-rldel="${relKey(q, k)}" aria-label="この関係を外す">外す</button></div>`; };
  const block = (k, xs, dir) => xs.length ? `<div class="rb"><div class="rbh"><span class="kind k-${k}">${k}</span>${KIND_WORDS[k][dir]}</div>${xs.map(q => card(q, k)).join("")}</div>` : "";
  const sym = k => [...new Set(ins(k).concat(outs(k)))];
  const up = block("前提", ins("前提"), 0) + block("支え", ins("支え"), 0) + block("一部", ins("一部"), 0);
  const side = block("並走", sym("並走"), 0) + block("取り合い", sym("取り合い"), 0) + block("代わり", sym("代わり"), 0);
  const down = block("前提", outs("前提"), 1) + block("支え", outs("支え"), 1) + block("一部", outs("一部"), 1);
  return pickBtn(p, "rel") + up + `<div class="rcenter">${seal(p.grade)}<div><b>${esc(p.name)}</b><small>${esc(p.ministry)}・進捗 ${prog(p)}%・危険度 ${r.score}(${r.level})</small></div><button class="btn ghost sm" data-goplan="${p.id}">開く</button></div>` + side + down +
    (up + side + down ? "" : '<p class="note">まだ関係がない。下の「つなぐ」から足せる。</p>') +
    `<div class="card"><h4>この計画をつなぐ</h4><div class="row2"><div class="f"><label>相手</label><select id="rl-to">${plans.filter(x => x.id !== p.id).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div>
      <div class="f"><label>関係</label><select id="rl-k">${KINDS.map(k => `<option>${k}</option>`).join("")}</select></div></div>
      <p class="note" style="margin:0 0 .4rem">前提=先にあるとよい / 支え=あると楽になる / 並走=一緒に進める / 一部=大きな計画の一部 / 取り合い=時間や力を取り合う / 代わり=どちらかでよい</p><button class="btn sm" data-rladd>つなぐ</button></div>`;
}
function relMap(){
  const W0 = Math.min(980, ($("main") || {}).clientWidth || 600), lane = 46, bw = 92, bh = 26, gapX = 8, rowGap = 14;
  // 格ごとの段に、詰めて並べる(はみ出したら次の行へ)
  const pos = {}; let y = 10, rowsSvg = "";
  const perRow = Math.max(2, Math.floor((Math.max(W0, 340) - lane - 6) / (bw + gapX)));
  GRADES.forEach(g => { const ps = plans.filter(p => p.grade === g); if (!ps.length) return; const lines = Math.ceil(ps.length / perRow);
    rowsSvg += `<line x1="0" x2="2000" y1="${y - 5}" y2="${y - 5}" stroke="var(--rule)"/><text class="lane" x="4" y="${y + 16}">${g}</text>`;
    ps.forEach((p, i) => { pos[p.id] = { x: lane + (i % perRow) * (bw + gapX) + bw / 2, y: y + Math.floor(i / perRow) * (bh + rowGap) + bh / 2 }; });
    y += lines * (bh + rowGap) + 12; });
  const W = lane + perRow * (bw + gapX) + 6, H = y;
  const hl = relId && relKinds.size < KINDS.length ? null : null;
  const edges = plans.flatMap(p => p.rels.filter(r => relKinds.has(r.kind)).map(r => { const a = pos[p.id], b = pos[r.to]; if (!a || !b) return "";
    const dy = b.y - a.y, dx = b.x - a.x, bend = Math.abs(dy) < 4 ? -22 : 0, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 + bend;
    return `<path class="e k-${r.kind}" d="M${a.x},${a.y + (dy > 4 ? bh / 2 : dy < -4 ? -bh / 2 : -bh / 2)} Q${mx},${my} ${b.x},${b.y + (dy > 4 ? -bh / 2 : dy < -4 ? bh / 2 : -bh / 2)}"${r.kind === "前提" || r.kind === "一部" ? ' marker-end="url(#ar)"' : ""}><title>${esc(p.name + " → " + P(r.to).name + "(" + r.kind + ")")}</title></path>`; })).join("");
  const nodes = plans.map(p => { const c = pos[p.id], rr = risk(p);
    return `<g class="n n-${p.grade}" data-relgo="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)}"><rect class="nb" x="${c.x - bw / 2}" y="${c.y - bh / 2}" width="${bw}" height="${bh}" rx="3"/><text class="nt" x="${c.x - bw / 2 + 5}" y="${c.y + 3.5}">${esc(p.name.length > 8 ? p.name.slice(0, 8) + "…" : p.name)}</text>
      <circle cx="${c.x + bw / 2 - 6}" cy="${c.y - bh / 2 + 6}" r="3.2" class="${rr.level === "安定" ? "" : ""}" fill="${rr.level === "安定" ? "var(--ok)" : rr.level === "注意" ? "var(--mid)" : "var(--bad)"}"/></g>`; }).join("");
  return `<div class="fbar">${KINDS.map(k => `<label class="chk"><input type="checkbox" data-rlk="${k}"${relKinds.has(k) ? " checked" : ""}><span class="kind k-${k}">${k}</span></label>`).join("")}</div>
    <div class="map"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="計画どうしの関係"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--ink)"/></marker></defs>${rowsSvg}${edges}${nodes}</svg></div>
    <p class="note">右上の点は危険度(緑=安定・黄=注意・朱=危険)。計画を押すと「中心の計画」で開く。最初は前提・支え・一部だけ線を出している。ほかの種類は上で選ぶと出る。</p>`;
}

/* ───────── 分野(全体像):入れ子のマンダラ ───────── */
let fieldId = "", fieldPath = [];
const NEXT_ST = { 未: "学習中", 学習中: "定着", 定着: "未" };
const nodeAt = (root, path) => path.reduce((n, i) => (n ? (n.kids || [])[i] : undefined), root);
/* マスの名札:並べ替えたり移したりしても、計画とのつながりがずれないように */
function ensureIds(n){ if (!n.id) n.id = "fn" + uid(); (n.kids || []).forEach(ensureIds); }
function pathOf(root, id, path){ path = path || []; if (root.id === id) return path; const ks = root.kids || []; for (let i = 0; i < ks.length; i++) { const r = pathOf(ks[i], id, path.concat(i)); if (r) return r; } return null; }
function linkPath(f, l){ return l.node ? pathOf(f.root, l.node) : (l.path || []); }
function walkNodes(n, depth, path, out){ out.push({ n, depth, path }); (n.kids || []).forEach((k, i) => walkNodes(k, depth + 1, path.concat(i), out)); return out; }
function leaves(n){ return (n.kids && n.kids.length) ? n.kids.flatMap(leaves) : [n]; }
function fStatus(n){ if (n.kids && n.kids.length) { const l = leaves(n), d = l.filter(x => x.st === "定着").length; return d === l.length ? "定着" : l.some(x => x.st !== "未" && x.st) ? "学習中" : "未"; } return n.st || "未"; }
function covHtml(n){ const l = leaves(n), c = s => l.filter(x => (x.st || "未") === s).length;
  return `<div class="cov" title="定着 ${c("定着")}・学習中 ${c("学習中")}・未 ${c("未")}"><i style="width:${c("定着") / l.length * 100}%;background:var(--ink)"></i><i style="width:${c("学習中") / l.length * 100}%;background:var(--wave)"></i></div>
    <div class="note">定着 ${c("定着")}・学習中 ${c("学習中")}・未 ${c("未")}(全 ${l.length})</div>`; }
function fieldCell(n, i, prefix, path){
  if (!n) return prefix === "f" && i === (nodeAt((fields.find(x => x.id === fieldId) || fields[0]).root, path).kids || []).length ? `<button class="mc empty" data-fadd>+ 足す</button>` : `<span class="mc empty" style="opacity:.35"></span>`;
  const st = fStatus(n), k = (n.kids || []).length, l = leaves(n), dn = l.filter(x => x.st === "定着").length;
  const bkf = prefix === "f" ? fields.find(x => x.id === fieldId) : null, bp = bkf && n.id ? bkForNode(bkf, n.id) : null;
  return `<button class="mc fs-${st}" data-fin="${prefix}|${path.concat(i).join(",")}">${bp != null ? bkRing(bp) : ""}<span class="mt">${esc(n.text)}</span>${n.memo ? '<span class="fmemo">メモ</span>' : ""}<span class="ms"><span>${st}</span>${k ? `<span class="kids">${dn}/${l.length}</span>` : ""}</span></button>`;
}
function fieldMiniGrid(f, path){ const n = nodeAt(f.root, path), kids = n.kids || [];
  return `<div class="ftiles">${kids.map((k, i) => { const st = fStatus(k), l = leaves(k), dn = l.filter(x => x.st === "定着").length; return `<button class="ftile fs-${st}" data-fin="p:${f.id}|${path.concat(i).join(",")}"><b>${esc(k.text)}</b><small>${st}${(k.kids || []).length ? "・" + dn + "/" + l.length : ""}</small></button>`; }).join("")}</div>${covHtml(n)}`; }
/* ── マンダラ:8つを超えたら、4×4・5×5・6×6 に広げる(中心はまん中のまとまり) ── */
function mandalaHtml(kids, centerHtml, cellFn){ const need = kids.length + 1, k = need <= 8 ? 3 : need <= 12 ? 4 : need <= 16 ? 5 : 6, c = k - 2, out = []; let j = 0;
  for (let r = 0; r < k; r++) for (let q = 0; q < k; q++) { const inC = r >= 1 && r < 1 + c && q >= 1 && q < 1 + c;
    if (inC) { if (r === 1 && q === 1) out.push(centerHtml.replace('class="mc center"', `class="mc center" style="grid-row:2/span ${c};grid-column:2/span ${c}"`)); continue; }
    out.push(cellFn(kids[j], j)); j++; }
  return { html: `<div class="mandala mk${k}" style="grid-template-columns:repeat(${k},1fr)">${out.join("")}</div>`, shown: Math.min(j, kids.length) }; }

/* ── 教材:カードづくりの進み具合 ──
   book = { id, name, node(マスの名札・なし), kinds:[{ id, name, chs:[{ name, a, b }] }], st:{ 種類id:{ 番号: 1(途中)|2(作成済み) } }, hist:{ 日付: その日の終わりの点 } } */
let bookOpen = "", bookKind = "";
const bkItems = b => (b.kinds || []).reduce((a, k) => a + (k.chs || []).reduce((x, c) => x + Math.max(0, c.b - c.a + 1), 0), 0);
function bkKindStat(b, k){ let n = 0, p = 0, done = 0; const st = (b.st || {})[k.id] || {}; (k.chs || []).forEach(c => { for (let i = c.a; i <= c.b; i++) { n++; const v = st[i] || 0; p += v === 2 ? 1 : v === 1 ? 0.5 : 0; if (v === 2) done++; } }); return { n, p, done }; }

let renderPending = false;
function editingNow(){ const a = document.activeElement; return !!(a && a.closest && a.closest("#main") && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && !["checkbox", "radio", "button", "submit"].includes(a.type)) || a.isContentEditable)); }
