<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大計</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#26221E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F3EC; --sheet:#FBF9F4; --white:#FFFFFF; --ink:#26221E; --sub:#6E665C; --rule:#DCD5C7; --shu:#B5432F; --shu-soft:#F6E3DE;
  --wave:#2F4F8A; --wave-soft:#E3E8F1; --ok:#3D7A55; --ok-soft:#E1EEE5; --mid:#A2731B; --mid-soft:#F4EAD3; --bad:#B5432F;
  --p1:#E6DCC8; --p2:#D9E2D2; --p3:#D6DEEA; --p4:#EADAD3; --p5:#E2DAE8;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#16130F; --sheet:#1E1A15; --white:#221E18; --ink:#ECE6DB; --sub:#A79E91; --rule:#3A332A; --shu:#E0735F; --shu-soft:#3A221C;
  --wave:#8FA9DA; --wave-soft:#232B3A; --ok:#7DBB95; --ok-soft:#1F3127; --mid:#D9A54B; --mid-soft:#352B17; --bad:#E0735F;
  --p1:#3A3224; --p2:#28352A; --p3:#26303F; --p4:#3D2A25; --p5:#332B3B; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#16130F; --sheet:#1E1A15; --white:#221E18; --ink:#ECE6DB; --sub:#A79E91; --rule:#3A332A; --shu:#E0735F; --shu-soft:#3A221C;
  --wave:#8FA9DA; --wave-soft:#232B3A; --ok:#7DBB95; --ok-soft:#1F3127; --mid:#D9A54B; --mid-soft:#352B17; --bad:#E0735F;
  --p1:#3A3224; --p2:#28352A; --p3:#26303F; --p4:#3D2A25; --p5:#332B3B; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wave);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:1.1rem 1rem 2rem}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding-bottom:.6rem;border-bottom:2px solid var(--ink);margin-bottom:1rem}
.head h1{margin:0;font-size:1.35rem;letter-spacing:.12em}
.head .date{color:var(--sub);font-size:.82rem;text-align:right}
.head .date b{color:var(--ink);font-size:1rem;font-variant-numeric:tabular-nums}
.notice{background:var(--sheet);border-left:3px solid var(--shu);padding:.5rem .75rem;font-size:.84rem;margin:0 0 1rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--sheet);border-top:1px solid var(--rule);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;border:none;background:none;padding:.8rem 0;color:var(--sub);font-size:.84rem;border-top:2px solid transparent;margin-top:-1px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700;border-top-color:var(--ink)}
.note{font-size:.8rem;color:var(--sub)}
.sec{margin-top:1.4rem}
.sec:first-child{margin-top:0}
.sec>h3{font-size:.95rem;margin:0 0 .45rem;letter-spacing:.12em;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.sec>h3 small{font-weight:400;letter-spacing:0;color:var(--sub);font-size:.76rem}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:.25rem .7rem;font-size:.82rem;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.fbar{display:flex;flex-wrap:wrap;gap:.5rem .7rem;align-items:center;margin:0 0 .8rem}
.fbar select{padding:.25rem .4rem;border:1px solid var(--rule);border-radius:3px;background:var(--sheet);font-size:.84rem}
.chk{font-size:.84rem;color:var(--sub);display:inline-flex;gap:.3rem;align-items:center}
.linkx{border:0;background:none;color:var(--wave);font-size:.8rem;text-decoration:underline;padding:0}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:3px;padding:.4rem .9rem}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.shu{background:transparent;color:var(--shu);border-color:var(--shu)}
.btn.sm{padding:.2rem .6rem;font-size:.8rem}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.5rem 1rem;font-size:.86rem;z-index:40;max-width:90vw;border-radius:3px}
[hidden]{display:none!important}
button:disabled{opacity:.4;cursor:default}
.btn{white-space:nowrap}

/* 格・不変・状態 */
.gm{display:inline-block;width:.9rem;height:.9rem;border-radius:50%;flex:none;vertical-align:-.1em}
.gm.g-最重要{background:var(--ink);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
.gm.g-重要{background:var(--ink)}
.gm.g-通常{border:2px solid var(--ink)}
.gm.g-軽易{border:2px dotted var(--sub)}
.fix{display:inline-block;font-size:.68rem;font-weight:700;color:var(--shu);border:1.5px solid var(--shu);padding:0 .3rem;border-radius:2px;line-height:1.5;white-space:nowrap;letter-spacing:.06em}
.st{font-weight:700}.st.ok{color:var(--ok)}.st.mid{color:var(--mid)}.st.bad{color:var(--bad)}
.tag{display:inline-block;font-size:.68rem;font-weight:700;border:1px solid currentColor;border-radius:2px;padding:0 .3rem;line-height:1.5;white-space:nowrap}
.t-確定{color:var(--ink)} .t-予定{color:var(--wave)} .t-仮{color:var(--sub);border-style:dashed}

/* 進捗と危険度のメーター */
.meters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin:.6rem 0 0}
.meter{background:var(--white);border:1px solid var(--rule);border-radius:4px;padding:.4rem .55rem;text-align:left;width:100%}
.meter .ml{font-size:.68rem;color:var(--sub);letter-spacing:.06em}
.meter .mv{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.meter .mv small{font-size:.7rem;font-weight:700;margin-left:.2rem}
.mbar{height:5px;background:var(--rule);border-radius:3px;position:relative;margin-top:.25rem;overflow:hidden}
.mbar i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.mbar s{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);text-decoration:none}
.lv-安定{color:var(--ok)} .lv-注意{color:var(--mid)} .lv-危険{color:var(--bad)} .lv-崩壊寸前{color:var(--paper);background:var(--bad);padding:0 .25rem;border-radius:2px}
.bg-安定{background:var(--ok)} .bg-注意{background:var(--mid)} .bg-危険,.bg-崩壊寸前{background:var(--bad)}

/* 全体図 */
.plan{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;width:100%;text-align:left;border:none;border-left:6px solid var(--ink);background:var(--sheet);border-radius:0 3px 3px 0;padding:.6rem .75rem;margin:.3rem 0}
.plan.t-通常{border-left-color:var(--rule)} .plan.t-軽易{border-left:6px dotted var(--rule)}
.plan.t-最重要{box-shadow:inset 3px 0 0 var(--paper),inset 5px 0 0 var(--ink)}
.plan .nm{font-weight:700;display:flex;gap:.4rem;align-items:center}
.plan .mi{color:var(--sub);font-size:.76rem}
.plan .side{text-align:right;font-size:.74rem;color:var(--sub);white-space:nowrap}
.plan .side b{font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.minibar{grid-column:1/-1;margin:.35rem 0 .1rem}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.25rem .8rem;font-size:.74rem;color:var(--sub);align-items:center}
.msl{display:flex;flex-direction:column;gap:.25rem}
.msi{display:flex;gap:.7rem;align-items:center;width:100%;text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:3px;padding:.4rem .6rem}
.msi.soon{border-left:4px solid var(--shu)}
.msd{flex:none;width:3.4rem;display:flex;flex-direction:column;line-height:1.25}
.msd b{font-size:1rem;font-variant-numeric:tabular-nums}
.msd small{font-size:.7rem;color:var(--sub)}
.msi.soon .msd small{color:var(--shu);font-weight:700}
.msn{font-weight:700;display:flex;flex-direction:column;line-height:1.35}
.msn small{font-weight:400;font-size:.74rem;color:var(--sub);display:flex;gap:.3rem;align-items:center}
.fold{display:block;width:100%;border:1px dashed var(--rule);background:transparent;color:var(--sub);border-radius:3px;padding:.35rem;font-size:.82rem;margin:.3rem 0}
.fx{background:var(--sheet);border-left:6px solid var(--shu);border-radius:0 3px 3px 0;padding:.5rem .75rem;margin:.3rem 0;font-size:.86rem}

/* 帯の図(期間・節目) */
.band{position:relative;margin:.2rem 10px}
.band .lrow{position:relative;height:30px;display:flex}
.band .lrow.thin{height:15px}
.band .ltrack{position:relative;flex:1}
.band .lcode{flex:none;width:1.1rem;font-size:.6rem;font-weight:700;line-height:15px;color:var(--sub)}
.band .lcode.r-主{color:var(--ink)}
.band .bover{position:absolute;inset:0;pointer-events:none}.band .bover.m{left:1.1rem}
.band .thin .seg2{top:3px;height:9px;font-size:0;padding:0}
.band .thin .dm{top:2.5px;width:9px;height:9px;transform:translateX(-4.5px) rotate(45deg);border-width:1.5px}
.band .thin .sub{top:5px;width:5px;height:5px;transform:translateX(-2.5px)}
.band .bover.m .bu{top:auto;bottom:-6px}
.band .lmore{font-size:.6rem;color:var(--sub);padding-left:1.1rem}
.band .seg2{position:absolute;top:6px;height:18px;border-radius:2px;font-size:.62rem;line-height:18px;padding:0 .25rem;overflow:hidden;white-space:nowrap;color:var(--ink)}
.band .now{position:absolute;top:0;bottom:0;border-left:2px solid var(--shu);z-index:2}
.band .dm{position:absolute;top:8px;width:13px;height:13px;transform:translateX(-6.5px) rotate(45deg);background:var(--white);border:2px solid var(--ink);z-index:1}
.band .dm.t-予定{border-color:var(--wave)} .band .dm.t-仮{border-style:dashed;border-color:var(--sub)}
.band .dm.done{background:var(--ink)} .band .dm.fixed{border-color:var(--shu);background:var(--shu-soft)}
.band .sub{position:absolute;top:12px;width:6px;height:6px;transform:translateX(-3px);border-radius:50%;background:var(--sub);z-index:1}

.band .bu{position:absolute;top:24px;width:7px;height:5px;transform:translateX(-3.5px);background:var(--mid);border-radius:1px;z-index:1}
.band .chm{position:absolute;top:0;width:2px;height:6px;transform:translateX(-1px);background:var(--sub);z-index:1}
.band .chm.re{background:var(--shu);height:8px;width:3px}
/* どこからでも見える目標 */
.goals{display:flex;gap:.35rem;overflow-x:auto;scrollbar-width:none;margin:-.4rem 0 .9rem;padding-bottom:.1rem}
.goal-c{flex:none;display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--rule);border-left:3px solid var(--ink);background:var(--sheet);border-radius:0 3px 3px 0;padding:.2rem .55rem;line-height:1.25;text-align:left}
.goal-c{min-width:7.5rem;max-width:11rem}
.goal-c .gn{font-size:.76rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.goal-c small{font-size:.62rem;color:var(--sub);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.goal-c b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.goal-c b small{font-size:.7rem;color:var(--ink)}
.goal-c.near{border-left-color:var(--shu)} .goal-c.near b{color:var(--shu)}
.goal-set{flex:none;border:1px dashed var(--rule);background:transparent;color:var(--sub);border-radius:3px;padding:.2rem .6rem;font-size:.74rem}
/* 総合 */
.sum{background:var(--white);border:1px solid var(--rule);border-radius:6px;padding:.6rem .75rem}
.sum .sg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-top:.5rem}
.sum .sv{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.sum .sl{font-size:.68rem;color:var(--sub)}
.dist{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--rule);margin:.5rem 0 .2rem}
.dist i{display:block;height:100%}
/* 予備 */
.bufbar{display:flex;gap:2px;margin:.3rem 0}
.bufbar i{flex:1;height:14px;border-radius:2px;background:var(--rule)}
.bufbar i.u{background:var(--mid)}
.cause{display:flex;flex-wrap:wrap;gap:.3rem .8rem;font-size:.78rem;color:var(--sub)}
.cause b{color:var(--ink)}
/* 歩み */
.walk{position:relative;padding-left:1.1rem}
.walk::before{content:"";position:absolute;left:.35rem;top:.3rem;bottom:.3rem;border-left:2px solid var(--rule)}
.wk{position:relative;padding:.35rem 0 .45rem}
.wk::before{content:"";position:absolute;left:-.98rem;top:.62rem;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--sub)}
.wk.k-予備::before{border-color:var(--mid);background:var(--mid-soft)} .wk.k-立て直し::before{border-color:var(--shu);background:var(--shu-soft)} .wk.k-変更::before{border-color:var(--ink)} .wk.k-記録::before{border-color:var(--ok);background:var(--ok-soft)} .wk.k-作成::before{border-color:var(--wave);background:var(--wave-soft)}
.wk .wd{font-size:.7rem;color:var(--sub);display:flex;gap:.4rem;align-items:center}
.wk .wt{font-weight:700;font-size:.88rem}
.wk .wx{font-size:.8rem;color:var(--sub)}
.wk .wa{font-size:.84rem;display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.wk .wa del{color:var(--sub)}
.kk{display:inline-block;font-size:.66rem;font-weight:700;border-radius:2px;padding:0 .3rem;line-height:1.5}
.kk.k-予備{background:var(--mid-soft);color:var(--mid)} .kk.k-立て直し{background:var(--shu-soft);color:var(--shu)} .kk.k-変更{background:var(--sheet);color:var(--ink);border:1px solid var(--rule)} .kk.k-記録{background:var(--ok-soft);color:var(--ok)} .kk.k-作成{background:var(--wave-soft);color:var(--wave)}
/* 前の版との比べ */
.big .ghost{position:absolute;top:44px;width:13px;height:13px;transform:translateX(-6.5px) rotate(45deg);border:2px dashed var(--sub);background:transparent;z-index:1;opacity:.8}
.big .mv{position:absolute;top:51px;height:0;border-top:1.5px dashed var(--sub);z-index:0}
.big .bu{position:absolute;top:84px;width:9px;height:6px;transform:translateX(-4.5px);background:var(--mid);border-radius:1px}
.big .chm{position:absolute;top:80px;width:3px;height:12px;transform:translateX(-1.5px);background:var(--sub)} .big .chm.re{background:var(--shu)}
.tl-bu{position:absolute;top:30px;width:7px;height:5px;transform:translateX(-3.5px);background:var(--mid);border-radius:1px;z-index:2}
.tl-ch{position:absolute;top:6px;width:3px;height:8px;transform:translateX(-1.5px);background:var(--sub);z-index:2} .tl-ch.re{background:var(--shu)}
.big button.sub,.big button.bu,.big button.chm,.tl-sub{border:0;padding:0;cursor:pointer}
.big button.sub::after,.big button.bu::after,.big button.chm::after,.tl-sub::after{content:"";position:absolute;inset:-8px}
.mslist li.subli{padding-left:1.2rem;font-size:.78rem;color:var(--sub)}
.mslist li.subli b.n{width:2rem;font-weight:400}
.today{border:2px solid var(--ink);background:var(--white);border-radius:6px;overflow:hidden}
.today.done{border-color:var(--rule);background:var(--sheet)}
.today .th2{display:flex;justify-content:space-between;align-items:center;gap:.6rem;width:100%;border:0;background:none;padding:.55rem .75rem;text-align:left}
.today .th2>span:first-child{display:flex;flex-direction:column;line-height:1.3}.today .th2 small{font-size:.72rem;color:var(--sub)}
.dots{display:grid;grid-template-columns:repeat(14,7px);gap:2px;flex:none}
.dcd{display:block;width:7px;height:7px;border-radius:50%;background:var(--rule)}.dcd.some{background:var(--wave-soft);box-shadow:inset 0 0 0 1.5px var(--wave)}.dcd.full{background:var(--wave)}.dcd.now{outline:1.5px solid var(--shu);outline-offset:1px}
.dcbody{padding:0 .75rem .6rem}
.dcrow{border-top:1px solid var(--rule);padding:.45rem 0}
.dcn{display:flex;flex-direction:column;line-height:1.3;margin-bottom:.25rem}.dcn small{font-size:.7rem;color:var(--sub)}
.dcseg{display:flex}.dcseg button{flex:1;padding:.3rem .2rem}
.dcseg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.dcfix{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin-top:.3rem}
.tline{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap;margin:.45rem 0 0}
.tchip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.1rem .6rem;font-size:.76rem;color:var(--sub)}.tchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kz{border:1.5px dashed var(--mid);background:var(--mid-soft);border-radius:4px;padding:.5rem .7rem;margin:.5rem 0 0;display:flex;flex-direction:column;gap:.1rem;font-size:.86rem}
.kz.on{border-style:solid;border-color:var(--wave);background:var(--wave-soft)}
.blevels{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;margin:.1rem 0 .4rem}
.blv{border:1px solid var(--rule);border-radius:4px;padding:.3rem .35rem;display:flex;flex-direction:column;line-height:1.25;background:var(--sheet)}
.blv .bk{font-size:.66rem;color:var(--sub);letter-spacing:.1em}.blv b{font-size:.92rem;font-variant-numeric:tabular-nums}.blv small{font-size:.6rem;color:var(--sub)}
.wr .wb2 i.abs{background:var(--ok);opacity:.55}
.wr .wv small{display:block;font-size:.6rem}.absl{color:var(--ok)}.shl{color:var(--mid)}
.wr{grid-template-columns:5.6rem 1fr 5.4rem}
.kk.k-確認{background:var(--wave-soft);color:var(--wave)} .kk.k-改造{background:var(--ink);color:var(--paper)}
.wk.k-確認::before{border-color:var(--wave)} .wk.k-改造::before{border-color:var(--ink);background:var(--ink)}
details.wx summary{cursor:pointer;color:var(--wave)}
@media (max-width:420px){ .blevels{grid-template-columns:repeat(2,1fr)} }
.duebar{display:flex;flex-direction:column;gap:.3rem;margin:-.4rem 0 .7rem}
.duebar:empty{display:none}
.due{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:2px solid var(--shu);background:var(--shu-soft);border-radius:5px;padding:.35rem .65rem;line-height:1.3}
.due b{font-size:.86rem;color:var(--shu)} .due span{font-size:.76rem;color:var(--ink)}
.due.d2{border-color:var(--wave);background:var(--wave-soft)} .due.d2 b{color:var(--wave)} .due.d2.hot{border-color:var(--shu)}
.due.d3{border-color:var(--ink);background:var(--sheet)} .due.d3 b{color:var(--ink)}
.rs{display:inline-block;font-size:.66rem;font-weight:700;border-radius:2px;padding:0 .3rem;line-height:1.5}
.rs.r-問題なし{background:var(--ok-soft);color:var(--ok)} .rs.r-不安がある{background:var(--mid-soft);color:var(--mid)} .rs.r-直した{background:var(--wave-soft);color:var(--wave)} .rs.r-改造に回す{background:var(--ink);color:var(--paper)}
.dcrow2{display:flex;justify-content:space-between;align-items:center;gap:.5rem;border-top:1px solid var(--rule);padding:.45rem 0}
.cpanel{border:2px solid var(--shu);background:var(--white);border-radius:6px;padding:.65rem .8rem;margin:1.2rem 0 .5rem}
.cpanel.done{border-color:var(--ok)}
.cpanel h4{margin:0 0 .3rem;font-size:.92rem;display:flex;gap:.4rem;align-items:center}
.wrv{border:1px solid var(--rule);border-left:4px solid var(--wave);background:var(--sheet);border-radius:0 4px 4px 0;margin:.35rem 0}
.wrv.done{border-left-color:var(--ok)}
.wrh{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:.5rem .65rem;text-align:left}
.wrh>span:first-child{display:flex;flex-direction:column;line-height:1.35}.wrh small{font-size:.74rem;color:var(--sub)}
.wrb{padding:0 .65rem .6rem}

/* 図:大きな帯と番号つき節目、記録のグラフ */

.big .now{position:absolute;top:12px;bottom:4px;border-left:2px solid var(--shu);z-index:2}
.big .now span{position:absolute;top:-12px;left:3px;font-size:.6rem;color:var(--shu);font-weight:700;white-space:nowrap}

.big .dm.done{background:var(--ink)} .big .dm.fixed{border-color:var(--shu);background:var(--shu-soft)}
.big .no{position:absolute;top:64px;transform:translateX(-50%);font-size:.66rem;font-weight:700}

.chart{display:block;width:100%;height:auto}
.chart .ax{stroke:var(--rule);stroke-width:1}
.chart .tg{stroke:var(--sub);stroke-width:1.5;stroke-dasharray:4 3;fill:none}
.chart .rc{stroke:var(--wave);stroke-width:2.5;fill:none}
.chart .pt{fill:var(--wave)}
.chart .goal{stroke:var(--shu);stroke-width:1.2;stroke-dasharray:2 3}

.why-r{display:flex;flex-direction:column;gap:.3rem}

/* 分解(マンダラ) */
.crumb{display:flex;flex-wrap:wrap;gap:.2rem;align-items:center;font-size:.76rem;color:var(--sub);margin-bottom:.5rem}

.mc{border:1px solid var(--rule);background:var(--sheet);border-radius:3px;padding:.3rem;font-size:.74rem;line-height:1.3;display:flex;flex-direction:column;justify-content:space-between;text-align:left;overflow:hidden;position:relative}

.mc .mt{font-weight:700}
.mc .ms{font-size:.64rem;color:var(--sub);display:flex;justify-content:space-between;gap:.2rem;align-items:center}
.mc .kids{font-size:.6rem;color:var(--sub)}
.mc.s-済{background:var(--ok-soft);border-color:var(--ok)} .mc.s-途中{background:var(--mid-soft);border-color:var(--mid)}

/* 道のり */
.period{border-left:6px solid var(--p1);background:var(--sheet);border-radius:0 4px 4px 0;padding:.5rem .7rem .3rem;margin:.6rem 0}

.ms{border-top:1px solid var(--rule);padding:.45rem 0 .35rem}

.rec{display:flex;gap:.5rem;font-size:.8rem;padding:.1rem 0}

.ifb{border:1px dashed var(--shu);border-radius:3px;padding:.3rem .5rem;margin:.3rem 0;font-size:.8rem}

.pace{display:inline-block;font-size:.7rem;font-weight:700;color:var(--ink);background:var(--mid-soft);border-radius:2px;padding:0 .35rem;line-height:1.5;white-space:nowrap}

.wrows{display:flex;flex-direction:column;gap:3px;margin:.2rem 0}
.wr{display:grid;grid-template-columns:5.6rem 1fr 4.6rem;gap:.4rem;align-items:center;font-size:.76rem}
.wr .ww{color:var(--sub)} .wr.cur .ww{color:var(--shu);font-weight:700}

.wr .wb2 i{position:absolute;inset:0 auto 0 0;background:var(--ok);border-radius:4px} .wr .wb2 i.short{background:var(--mid)}
.wr .wv{text-align:right;font-variant-numeric:tabular-nums}
.hist{display:flex;align-items:flex-end;gap:3px;height:42px;margin:.2rem 0;max-width:22rem}
.hist span{flex:1;height:100%;background:var(--wave-soft);border-radius:2px;position:relative;display:flex;align-items:flex-end}
.hist span i{display:block;width:100%;background:var(--wave);border-radius:2px}
.eh{font-size:.88rem;letter-spacing:.1em;margin:1.1rem 0 .3rem;padding-top:.5rem;border-top:1px solid var(--rule)}
.er{display:grid;grid-template-columns:1fr 1fr;gap:.3rem;margin:.3rem 0;padding:.4rem;border:1px solid var(--rule);border-radius:4px;background:var(--sheet)}
.er input,.er select{width:100%;min-width:0;padding:.3rem .4rem;border:1px solid var(--rule);border-radius:3px;background:var(--white);font-size:.84rem}
.er.ms-e{display:block}.er.subm{margin-left:1.2rem;border-style:dashed}
.er2{display:grid;grid-template-columns:2fr 1.4fr 1fr;gap:.3rem;margin:.15rem 0}
.er2:nth-child(2){grid-template-columns:1fr 1fr 1fr 1fr}
.er input:disabled{opacity:.55}
/* 実力テスト */
.tcard{display:block;width:100%;text-align:left;border:1px solid var(--rule);border-left:4px solid var(--wave);background:var(--sheet);border-radius:0 4px 4px 0;padding:.55rem .7rem;margin:.35rem 0}
.tcard .th{display:flex;justify-content:space-between;gap:.5rem;align-items:center}
.ti{display:grid;grid-template-columns:5.2rem auto auto 1fr auto;gap:.4rem;align-items:center;font-size:.8rem;margin-top:.25rem}
.ti .tn{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti b{font-variant-numeric:tabular-nums}
.ti .tb{height:6px;background:var(--rule);border-radius:3px;position:relative;overflow:hidden;min-width:2rem}
.ti .tb i{position:absolute;inset:0 auto 0 0;background:var(--wave);border-radius:3px} .ti .tb i.ok{background:var(--ok)}
.up{color:var(--ok);font-weight:700} .dn{color:var(--mid);font-weight:700}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin:.1rem 0 .4rem}
.big3>div{display:flex;flex-direction:column;line-height:1.25}
.big3 b{font-size:1.15rem;font-variant-numeric:tabular-nums}
.big3 small{font-size:.7rem}
.chart .pj{stroke:var(--wave);stroke-width:1.2;stroke-dasharray:2 3;fill:none}
.ttable{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--white)}
.ttable table{border-collapse:collapse;font-size:.8rem;min-width:100%}
.ttable th,.ttable td{padding:.3rem .45rem;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
.ttable th{background:var(--sheet);font-weight:700;font-size:.72rem;color:var(--sub);text-align:right}
.ttable th:first-child,.ttable td:first-child{text-align:left;position:sticky;left:0;background:var(--white)}
.ttable th:first-child{background:var(--sheet)}
.ttable td:last-child,.ttable th:last-child{text-align:left}
.ttable td.up{background:var(--ok-soft)} .ttable td.dn{background:var(--mid-soft)} .ttable td.hit{font-weight:700}
.res{display:flex;flex-wrap:wrap;gap:.2rem .7rem;align-items:baseline;padding:.45rem 0;border-bottom:1px solid var(--rule);font-size:.86rem}
.res .tn{width:100%;font-size:.74rem;color:var(--sub)} .res b{font-size:1.15rem}
.sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--rule);margin-right:.3rem;vertical-align:.05em}
.sdot.s-同期済み{background:var(--ok)} .sdot.s-送信中,.sdot.s-待機{background:var(--mid)} .sdot.s-失敗{background:var(--bad)}
.empty{border:1px dashed var(--rule);border-radius:6px;padding:1rem;text-align:center;color:var(--sub);font-size:.9rem;background:var(--sheet)}
.empty .fbar{justify-content:center;margin:.6rem 0 0}
.wk2{display:grid;grid-template-columns:1.4fr 1fr;gap:.4rem}.wk2 .wkcard{padding:.5rem .65rem}
.morebtn{border:1px solid var(--rule);background:var(--sheet);border-radius:3px;padding:.1rem .55rem;font-size:.78rem;color:var(--ink);margin-left:.3rem}
.wkcard{display:flex;justify-content:space-between;gap:.6rem;align-items:center;width:100%;text-align:left;border:2px solid var(--ink);background:var(--white);border-radius:6px;padding:.6rem .75rem}
.wkcard.done{border-color:var(--rule);background:var(--sheet)}
.wkcard b{font-size:1rem}.wkcard small{display:block;color:var(--sub);font-size:.74rem}
.wkrow{display:flex;gap:.5rem;align-items:center;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid var(--rule)}
.wkrow>div{display:flex;flex-direction:column;line-height:1.35;min-width:0;flex:1}

.wkrow input{width:5rem;padding:.3rem .4rem;border:1px solid var(--rule);border-radius:3px;background:var(--white);text-align:right}
.wkta{width:100%;min-height:4rem;padding:.4rem .5rem;border:1px solid var(--rule);border-radius:3px;background:var(--white)}
.gap{border:1px solid var(--rule);border-left:4px solid var(--shu);background:var(--sheet);border-radius:0 3px 3px 0;padding:.4rem .6rem;margin:.3rem 0;font-size:.82rem}
.lchart{display:flex;gap:4px;align-items:flex-end;height:180px;padding-top:.3rem}
.lw{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;font-size:.6rem;color:var(--sub)}
.lw .lb{flex:1;width:100%;position:relative;display:flex;flex-direction:column-reverse;background:var(--sheet);border-radius:2px;overflow:visible}

.lw.over .lb{box-shadow:0 0 0 1.5px var(--shu)}
.wiout{margin-top:.6rem}
.wiout li{font-size:.84rem;margin:.25rem 0}
.closedbar{background:var(--sheet);border-left:4px solid var(--sub);padding:.4rem .6rem;font-size:.84rem;margin:.5rem 0}
.ftiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(5.4rem,1fr));gap:4px;margin:.2rem 0}
.ftile{border:1px solid var(--rule);background:var(--white);border-radius:3px;padding:.25rem .35rem;font-size:.72rem;line-height:1.25;text-align:left;display:flex;flex-direction:column;gap:.1rem}
.ftile.fs-学習中{background:var(--wave-soft);border-color:var(--wave)} .ftile.fs-定着{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.ftile small{font-size:.6rem;opacity:.8}
.acts{display:flex;justify-content:flex-end;margin-top:.35rem}
.upk{display:inline-block;font-size:.64rem;font-weight:700;border-radius:2px;padding:0 .3rem;line-height:1.5}
.upk.k-節目{background:var(--wave-soft);color:var(--wave)} .upk.k-テスト{background:var(--ok-soft);color:var(--ok)}
.pcrumb{display:flex;flex-wrap:wrap;gap:.15rem .3rem;align-items:center;font-size:.76rem;color:var(--sub);margin:0 0 .4rem}
.pcrumb button{border:0;background:none;padding:0;color:var(--wave);text-decoration:underline;font-size:.76rem}
.ms.ms-plan{border-left:3px solid var(--wave);padding-left:.4rem;margin-left:-.45rem}
.nest{margin:.35rem 0 .2rem 3.2rem;border:1.5px solid var(--ink);border-radius:5px;background:var(--white);padding:.5rem .6rem}

.nrow{display:grid;grid-template-columns:2.6rem 1fr auto;gap:.1rem .45rem;align-items:baseline;font-size:.8rem;padding:.25rem 0;border-top:1px dotted var(--rule)}

.nest .nbtn{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.35rem}

.shobar{display:flex;flex-direction:column;border:2px solid var(--wave);background:var(--wave-soft);border-radius:6px;padding:.55rem .75rem;margin-bottom:.4rem;font-size:.88rem}

.k-前提{color:var(--ink)} .k-支え{color:var(--ok)} .k-並走{color:var(--wave)} .k-一部{color:var(--mid)} .k-取り合い{color:var(--shu)} .k-代わり{color:var(--sub)}

  取り合い: ["時間や力を取り合う計画", "時間や力を取り合う計画"],

/* 今日(端末の日付)。日をまたいだら、開き直したときに更新する */

let TODAY = localDay();

/* みんなで同期するデータ */
let plans = [], tests = [], fields = [], lessons = [], reviews = [], proposals = [];
let capacity = { base: 40, ex: [] }, headGoals = [], weekClosed = {}, dailyChecks = {}, weeklyReviews = {}, since = "", techLanes = [], techs = [], ideas = [], glossary = [], koubouTypes = [];   // koubouTypes:機構の自分の型   // glossary:定義集   // 技術ツリー:系統・技術・ひらめき   // since:大計を使い始めた日(それより前の確認・見直しは「抜け」に数えない)   // weeklyReviews:「週の月曜|計画」→ { r, note }   // dailyChecks:「日付|計画」→ 順調/少し遅れ/大きくずれ

/* ───────── 計画(1本を深く扱う作業場) ───────── */
let roadMode = "side", roadLane = {}, laneColOpen = {}, planId = "", ptab = "図", reqPath = [], reqView = "mandala", openMs = {}, showRisk = false, showComp = false, cmpVer = -1;
const PTABS = ["図", "メモ", "分解", "道のり", "探り", "技術", "テスト", "もしも", "歩み", "分野"];
function emptyPlans(){ return `<div class="empty">まだ計画がない。<div class="fbar"><button class="btn sm" data-addplan>+ 計画を足す</button><button class="btn ghost sm" data-v="importv">行軍表から移す・まとめて入れる</button></div></div>`; }
function viewPlan(){
  if (!live().length && !plans.length) return emptyPlans();
  if (!P(planId)) planId = (live()[0] || plans[0]).id;
  const p = P(planId);
  const head = `<div class="phead"><div style="display:flex;gap:.4rem;align-items:center;font-size:.76rem;color:var(--sub);flex-wrap:wrap">${seal(p.grade)}${p.grade}・${esc(p.ministry)}・${md(p.start)}〜${md(p.end)}${p.oneShot ? "・本番一度きり" : ""}${p.ministry !== "全体" && p.ministry !== "未分類" ? `<button class="linkx shogo" data-shogo="${esc(p.ministry)}">${esc(p.ministry)}を開く ↗</button>` : ""}</div>
    <div class="k" style="margin-top:.3rem">なぜ</div><div class="why">${esc(p.why)}</div><div class="k" style="margin-top:.25rem">到達点</div><div class="goal">${tx(p.goal, p)} ${isFixed(p, "goal") ? fixTag(isFixed(p, "goal")) : ""}</div>
    <div class="acts"><button class="btn ghost sm" data-planops>操作 ▾</button></div></div>${p.status ? `<div class="closedbar">この計画は ${md(p.closedAt)} に${esc(p.status)}として終えた。${esc(p.summary || "")}</div>` : ""}`;
  const tabs = `<div class="ptabs" role="group" aria-label="計画の中">${PTABS.map(t => `<button data-ptab="${t}" aria-pressed="${ptab === t}">${t}${t === "もしも" && p.ifs.length ? " " + p.ifs.length : ""}${t === "分野" && (p.fields || []).length ? " " + p.fields.length : ""}${t === "テスト" && testsOf(p).length ? " " + testsOf(p).length : ""}${t === "探り" && probesOf(p).filter(pOpen).length ? " " + probesOf(p).filter(pOpen).length : ""}</button>`).join("")}</div>`;
  const body = { 図: tabFigure, 分解: tabReq, 道のり: tabRoad, 探り: tabProbe, メモ: tabMemo, 技術: tabPlanTech, テスト: tabTests, もしも: tabIf, 歩み: tabWalk, 分野: tabPlanField }[ptab](p);
  const anc = ancestors(p), crumb = anc.length ? `<div class="pcrumb">${anc.map(a => `<button data-goplan="${a.q.id}" data-ptab="道のり">${esc(a.q.name)}</button> ›`).join(" ")} <b style="color:var(--ink)">${esc(p.name)}</b><span>(${esc(anc[anc.length - 1].q.name)}の節目)</span></div>` : "";
  const tcr = p.status ? null : chkRec(TODAY, p.id), tline = drafting(p) ? `<div class="tline"><span class="phase">作成中</span><button class="tchip" data-gostart>形ができたら、いちばん下で始める ↓</button></div>` : p.status ? "" : `<div class="tline"><span class="note">今日の確認:</span>${tcr ? `<span class="rs r-${tcr.r}">${tcr.r}</span>` : `<button class="tchip" data-due="today">まだ。見たらいちばん下で確認 ↓</button>`}</div>`;
  return crumb + pickBtn(p, "plan") + head + tline + draftBanner(p) + meters(p) + (showComp ? compCard(p) : "") + tabs + body + checkPanel(p);
}
function compCard(p){ const c = completeness(p);
  return `<div class="card"><h4>計画の完成度 ${c.score}%<button class="linkx" data-comp="${p.id}">閉じる</button></h4><div class="why-r">${c.items.map(x => `<div><span>${x.ok ? '<b class="st ok">済</b>' : '<b class="st bad">未</b>'} ${x.k}${x.ok ? "" : `<br><small class="note">${esc(x.hint)}</small>`}</span></div>`).join("")}</div></div>`; }

/* 図:計画全体を1枚で */
function tabFigure(p){
  const span = Math.max(1, days(p.start, p.end)), pos = d => Math.max(0, Math.min(100, days(p.start, d) / span * 100));
  const L = lanesOf(p), many = L.length > 1, main = mainMs(p);
  const numOf = m => { const l = laneOf(p, m), xs = laneMs(p, l); return (many ? laneCode(p, l) : "") + (xs.indexOf(m) + 1); };
  const vers = p.versions || [], cv = vers[cmpVer];
  const marks = (p.buffer ? p.buffer.uses : []).concat((p.mbuf && p.mbuf.uses) || []).map(u => `<button class="bu" style="left:${pos(u.date)}%" data-ms="${esc(md(u.date) + " 予備を" + u.days + "日使った(" + u.cause + (u.note ? "・" + u.note : "") + ")")}" aria-label="予備"></button>`).join("") +
    p.changes.filter(c => c.date >= p.start && !["作成", "記録", "確認"].includes(c.kind)).map(c => `<button class="chm${c.kind === "立て直し" ? " re" : ""}" style="left:${pos(c.date)}%" data-ms="${esc(md(c.date) + " " + (c.kind || "変更") + ":" + c.what + (c.before || c.after ? "(" + c.before + " → " + c.after + ")" : ""))}" aria-label="変更"></button>`).join("");
  /* 道筋1本分の大きな帯 */
  const laneBig = (l, k, withMarks, first) => {
    const xs = laneMs(p, l);
    const per = periodsOf(p, l).map((x, i) => { const a = pos(x.start), w = Math.max(1, pos(x.end) - pos(x.start)) - .4, c = PCOL[(i + k * 2) % 5];
      return `<div class="seg2" style="left:${a}%;width:${w}%;background:${c}" title="${esc(x.name + ":" + x.purpose)}"></div>${x.name ? `<div class="plab" style="left:${a}%;width:${w}%;border-left-color:${c}"><b>${esc(x.name)}</b>${md(x.start)}〜</div>` : ""}`; }).join("");
    const dms = xs.map(m => `<span class="dm t-${m.type}${isDone(m) ? " done" : ""}${isFixed(p, "ms:" + m.id) ? " fixed" : ""}" style="left:${pos(m.date)}%"></span><span class="no" style="left:${pos(m.date)}%">${numOf(m)}</span>`).join("") +
      xs.flatMap(pm => subsOf(p, pm.id).map((m, j) => `<button class="sub" style="left:${pos(m.date)}%" data-ms="${esc("細かい節目 " + numOf(pm) + "-" + (j + 1) + ":" + m.name + "(" + md(m.date) + ")" + (isDone(m) ? "・済" : ""))}" aria-label="${esc(unbr(m.name))}"></button>`)).join("");
    const ghosts = cv ? Object.entries(cv.ms || {}).map(([id, d]) => { const m = xs.find(x => x.id === id); if (!m || m.date === d) return ""; const a = pos(d), b = pos(m.date);
      return `<span class="mv" style="left:${Math.min(a, b)}%;width:${Math.abs(b - a)}%"></span><span class="ghost" style="left:${a}%" title="${esc("前:" + m.name + " " + md(d))}"></span>`; }).join("") : "";
    const pz = probesOf(p).filter(x => x.limit && (x.lane === l.id || ((!x.lane || !L.some(z => z.id === x.lane)) && k === 0))).map(x => `<button class="pq k-${x.kind}${pOpen(x) ? "" : " done"}" style="left:${pos(x.limit)}%" data-ms="${esc(x.kind + "「" + x.title + "」" + (pOpen(x) ? " 期限 " + md(x.limit) : " 済"))}" aria-label="探り">?</button>`).join("");
    return `<div class="big${withMarks ? "" : " nm"}${multiLane(p) && laneEnded(p, l) ? " endl" : ""}">${pz}${first ? `<span class="ed" style="left:0">${md(p.start)}</span><span class="ed" style="right:0">${md(p.end)}</span>` : ""}${per}${ghosts}${dms}${withMarks ? marks : ""}<span class="now" style="left:${pos(TODAY)}%">${first ? "<span>今日</span>" : ""}</span></div>`; };
  const lhead = l => { const lp = laneProg(p, l); return `<div class="lhead${laneEnded(p, l) ? " ended" : ""}"><span class="lc r-${l.rank}">${laneCode(p, l)}</span><span class="rk r-${l.rank}">${l.rank}</span><b>${esc(l.name)}</b>${laneTag(p, l)}<small>${l.closed ? (l.closed.count === "外す" ? "進捗の計算から外した" : "100%として数える") : lp == null ? "節目なし" : "進捗 " + lp + "%"}</small></div>`; };
  const bands = many ? L.map((l, k) => lhead(l) + laneBig(l, k, false, k === 0)).join("") + `<div class="big marks"><span class="now" style="left:${pos(TODAY)}%"></span>${marks}</div>` : laneBig(L[0], 0, true, true);
  const msRow = m => { const f = isFixed(p, "ms:" + m.id), pr = msProg(m);
    return `<li><b class="n">${numOf(m)}</b><span class="d">${md(m.date)}</span><span style="flex:1">${m.plan && P(m.plan) ? '<span class="tag" style="color:var(--wave)">計画</span> ' : ""}${m.plan ? esc(msName(m)) : tx(m.name, p)} ${m.plan ? "" : msTag(m.type)}${f ? " " + fixTag(f) : ""}${p.ifs.some(x => x.at === m.id) ? ' <span class="tag" style="color:var(--shu)">もしも</span>' : ""}${pr ? ` <b class="st ${pr.pct >= 100 ? "ok" : ""}" style="font-size:.76rem">${pr.pct}%</b>` : ""}</span><small class="note">${isDone(m) ? "済" : ago(days(TODAY, m.date))}</small></li>` +
      subsOf(p, m.id).map((sm, jj) => `<li class="subli"><b class="n">${numOf(m)}-${jj + 1}</b><span class="d">${md(sm.date)}</span><span style="flex:1">${esc(unbr(sm.name))} ${msTag(sm.type)}</span><small class="note">${isDone(sm) ? "済" : ago(days(TODAY, sm.date))}</small></li>`).join(""); };
  const list = many ? L.map(l => `<li class="lli${laneEnded(p, l) ? " ended" : ""}"><span class="lc r-${l.rank}">${laneCode(p, l)}</span><span class="rk r-${l.rank}">${l.rank}</span>${esc(l.name)}${laneTag(p, l)}</li>` + laneMs(p, l).map(m => l.closed ? msRow(m).replace(/<small class="note">[^<]*<\/small><\/li>/, `<small class="note">—</small></li>`) : msRow(m)).join("")).join("") : main.map(msRow).join("");
  const cmpBar = vers.length ? `<div class="fbar" style="margin:.2rem 0 .3rem"><label class="chk">前の版と比べる <select data-cmpver><option value="-1">比べない</option>${vers.map((v, i) => `<option value="${i}"${i === cmpVer ? " selected" : ""}>${esc(v.label)}</option>`).join("")}</select></label>${cv ? `<button class="linkx" data-verdel="${cmpVer}" style="color:var(--bad)">この版を消す</button>` : ""}</div>` : "";
  const fig = `<div class="card"><h4>${many ? "道筋と節目" : "期間と節目"}<small>押すと中身が出る</small></h4>
    <div class="legend" style="margin:0 0 .3rem"><span><i class="lg-d"></i>節目(番号は下の一覧)</span><span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sub)"></i>細かい節目</span><span><i style="display:inline-block;width:9px;height:6px;background:var(--mid);border-radius:1px"></i>予備を使った日</span><span><i style="display:inline-block;width:3px;height:10px;background:var(--sub)"></i>変えた日</span><span><i style="display:inline-block;width:3px;height:10px;background:var(--shu)"></i>立て直した日</span></div>${cmpBar}
    ${bands}
    ${cv ? `<p class="note" style="margin:.1rem 0 .2rem">点線のひし形が「${esc(cv.label)}」の位置。点線の矢印の分だけ動いた。</p>` : ""}
    <ol class="mslist">${list}</ol></div>`;
  const mt = mainTest(p), chart = mt ? `<div class="card"><h4>主な物差し:${esc(mt.name)}<small>青=記録 / 点線=予定の線 / 朱=目標 / 細い点線=このペースの見込み</small></h4>${itemChart(mt, mt.items[0])}${itemLine(mt, mt.items[0])}<div class="fbar" style="margin:.4rem 0 0"><button class="btn sm" data-testrec="${mt.id}">実施して記録する</button><button class="btn ghost sm" data-testgo="${mt.id}">テストを見る</button></div></div>` : "";
  const r = risk(p);
  const riskCard = `<div class="card"><h4><span>計画危険度 ${r.score}<span class="lv-${r.level}" style="margin-left:.4rem">${r.level}</span></span><small>何が効いているか</small></h4><div class="why-r">${r.parts.map(x => `<div><span>${esc(x.k)}<br><small class="note">${esc(x.d)}</small></span><span class="wb"><i style="width:${Math.min(100, x.v / 35 * 100)}%"></i></span></div>`).join("")}</div>
    <p class="note" style="margin:.4rem 0 0">危険度が50を超えたら、「もしも」の計画を見直すか、計画を変える合図。</p></div>`;
  const gp = gapAlerts().filter(g => g.p === p).map(g => `<div class="gap"><span class="kk k-${g.kind === "量だけ進む" ? "立て直し" : "記録"}">${g.kind}</span> ${esc(g.text)}</div>`).join("");
  return gp + fig + bufferCard(p) + chart + (drafting(p) ? "" : riskCard);
}
function bufferCard(p){
  const used = p.buffer ? bufUsed(p) : 0, left = p.buffer ? bufLeft(p) : 0, cells = [];
  if (p.buffer) { p.buffer.uses.forEach(u => { for (let i = 0; i < u.days; i++) cells.push(`<i class="u" title="${esc(md(u.date) + " " + u.cause)}"></i>`); }); while (cells.length < p.buffer.total) cells.push("<i></i>"); }
  const byCause = {}; (p.buffer ? p.buffer.uses : []).concat((p.mbuf && p.mbuf.uses) || []).forEach(u => byCause[u.cause] = (byCause[u.cause] || 0) + u.days);
  const lv = (k, v, s) => `<div class="blv"><span class="bk">${k}</span><b>${v}</b><small>${s}</small></div>`;
  return `<div class="card"><h4>予備<small>日 → 週 → 月 → 計画 の順に使う</small></h4>
    <div class="blevels">${lv("日", (7 - wdays(p)) + "日/週", "週のペースを" + wdays(p) + "日分で組む")}${lv("週", wbufPct(p) + "%", "ここまでの不足は週の中で吸収")}${lv("月", mLeft(p) + "/" + mPer(p) + "日", "今月のこり(毎月補充)")}${lv("計画", p.buffer ? left + "/" + p.buffer.total + "日" : "なし", "期日の手前の予備")}</div>
    ${p.buffer ? `<div class="bufbar">${cells.slice(0, p.buffer.total).join("")}</div>` : ""}
    ${p.buffer && left <= 0 && mLeft(p) <= 0 ? '<p class="note" style="color:var(--bad);margin:.2rem 0">月の予備も計画の予備もない。これ以上遅れたら、立て直すか改造する。</p>' : ""}
    <div class="cause">${Object.entries(byCause).sort((a, b) => b[1] - a[1]).map(([c, d]) => `<span>${esc(c)} <b>${d}日</b></span>`).join("") || "まだ使っていない"}</div>
    ${(p.buffer ? p.buffer.uses.length : 0) + ((p.mbuf && p.mbuf.uses) || []).length ? `<details class="buses"><summary>使った記録を見る</summary>${(p.buffer ? p.buffer.uses : []).map((u, i) => ["buf|" + i, "計画", u]).concat(((p.mbuf && p.mbuf.uses) || []).map((u, i) => ["mbuf|" + i, "月", u])).sort((a, b) => a[2].date < b[2].date ? 1 : -1)
      .map(([ref, lv, u]) => `<div class="rec"><span class="note">${md(u.date)}</span><b>${lv}の予備 ${u.days}日</b><span class="note">${esc(u.cause)}${u.note ? "・" + esc(u.note) : ""}</span><button class="linkx" data-walkdel="${ref}" style="margin-left:auto">消す</button></div>`).join("")}</details>` : ""}
    ${drafting(p) ? '<p class="note" style="margin:.4rem 0 0">予備の層は「この計画を直す」で決める。使うのは始めてから。</p>' : `<div class="fbar" style="margin:.5rem 0 0"><button class="btn sm" data-bufuse>予備を使う</button><button class="btn ghost sm" data-replan>計画を立て直す</button>${p.buffer ? "" : '<button class="btn ghost sm" data-bufset>計画の予備を置く</button>'}</div>`}</div>`;
}

function metricChart(p){
  const m = p.metric, W = 340, H = 150, L = 30, R = 8, T = 10, B = 22, d0 = p.start, d1 = p.end, span = days(d0, d1);
  const vals = m.plan.map(x => x[1]).concat(m.records.map(x => x.value)), lo = Math.floor(Math.min(...vals) / 5) * 5 - 5, hi = Math.max(m.target, ...vals) + 5;
  const X = d => L + days(d0, d) / span * (W - L - R), Y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const planPath = m.plan.map((x, i) => (i ? "L" : "M") + X(x[0]).toFixed(1) + "," + Y(x[1]).toFixed(1)).join(" ");
  const recPath = m.records.map((x, i) => (i ? "L" : "M") + X(x.date).toFixed(1) + "," + Y(x.value).toFixed(1)).join(" ");
  const grid = [lo, Math.round((lo + hi) / 2), hi].map(v => `<line class="ax" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="2" y="${Y(v) + 3}">${v}</text>`).join("");
  const last = m.records[m.records.length - 1];
  return `<div class="card"><h4>${esc(unbr(m.name))}<small>点線=予定の線 / 青=記録 / 朱=到達点</small></h4>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unbr(m.name))}の記録">${grid}
      <line class="goal" x1="${L}" x2="${W - R}" y1="${Y(m.target)}" y2="${Y(m.target)}"/><line class="ax" x1="${X(TODAY)}" x2="${X(TODAY)}" y1="${T}" y2="${H - B}" style="stroke:var(--shu)"/>
      <path class="tg" d="${planPath}"/><path class="rc" d="${recPath}"/>${m.records.map(x => `<circle class="pt" cx="${X(x.date)}" cy="${Y(x.value)}" r="3.5"><title>${esc(md(x.date) + " " + x.value + m.unit + " " + x.note)}</title></circle>`).join("")}
      <text x="${L}" y="${H - 6}">${md(d0)}</text><text x="${W - R - 26}" y="${H - 6}">${md(d1)}</text></svg>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.82rem;margin-top:.2rem"><span>最新 <b>${last ? last.value + m.unit : "—"}</b>(${last ? esc(last.note) : ""})・この時点の予定 ${Math.round(metricPlanAt(p, TODAY))}${m.unit}</span><button class="btn sm" data-rec="metric">記録する</button></div></div>`;
}

/* 分解:マンダラ(深さは自由) */
function reqNode(p){ let n = p.req; for (const i of reqPath) n = (n.kids || [])[i]; return n; }
function reqStatus(n){ if (n.plan && P(n.plan)) { const q = P(n.plan); return prog(q) >= 100 ? "済" : prog(q) > 0 ? "途中" : "未"; }
  if (n.kids && n.kids.length) { const s = n.kids.map(reqStatus); return s.every(x => x === "済") ? "済" : s.some(x => x !== "未") ? "途中" : "未"; } return n.st || "未"; }
function tabReq(p){
  if (!p.req) p.req = { text: p.goal, kids: [] };
  const n = reqNode(p), kids = n.kids || [];
  const crumbs = [p.req]; { let c = p.req; for (const i of reqPath) { c = c.kids[i]; crumbs.push(c); } }
  const crumb = `<div class="crumb">${crumbs.map((c, i) => i === crumbs.length - 1 ? `<b>${esc(c.text)}</b>` : `<button data-reqto="${i}">${esc(c.text)}</button> ›`).join(" ")}<span style="margin-left:auto">深さ ${reqPath.length + 1}</span></div>`;
  const toggle = `<div class="fbar"><span class="seg" role="group" aria-label="見せ方"><button data-reqv="mandala" aria-pressed="${reqView === "mandala"}">マンダラ</button><button data-reqv="outline" aria-pressed="${reqView === "outline"}">一覧</button></span><span class="note">「これを達成するには、これが必要」を分解する</span></div>`;
  if (reqView === "outline") { const li = (c, path) => { const st = reqStatus(c); return `<li><span class="sx s-${st}">${st}</span><button class="linkx" style="color:var(--ink);text-decoration:none" data-reqgo="${path.join(",")}">${esc(c.text)}</button>${c.plan ? ` <span class="note">→ ${esc(P(c.plan).name)} ${prog(P(c.plan))}%</span>` : ""}${(c.kids || []).length ? "<ul>" + c.kids.map((k, i) => li(k, path.concat(i))).join("") + "</ul>" : ""}</li>`; };
    return toggle + `<div class="card"><ul class="outline">${li(p.req, [])}</ul></div><p class="note">項目を押すと、マンダラでそこを真ん中にして開く。</p>`; }
  const cell = (k, i) => { if (!k) return i === kids.length ? `<button class="mc empty" data-reqadd>+ 足す</button>` : `<span class="mc empty" style="opacity:.35"></span>`;
    const st = reqStatus(k), q = k.plan && P(k.plan);
    return `<button class="mc s-${st}" data-reqin="${i}"><span class="mt">${esc(k.text)}</span>${q ? `<span class="lk">→ ${esc(q.name)} ${prog(q)}%</span>` : ""}<span class="ms"><span>${st}</span>${(k.kids || []).length ? `<span class="kids">中に ${k.kids.length}</span>` : ""}</span></button>`; };
  const MG = mandalaHtml(kids, `<div class="mc center">${esc(n.text)}<small style="font-weight:400;font-size:.66rem;opacity:.8;margin-top:.2rem">${reqStatus(n)}・中に ${kids.length}</small></div>`, cell), more = kids.slice(MG.shown);
  const q = n.plan && P(n.plan);
  const ctrl = `<div class="card"><h4>真ん中の要素<small>${reqPath.length ? "" : "いちばん上(到達点)"}</small></h4>

/* 歩み:作った・予備を使った・立て直した・変えた・記録した、を1本の流れで */
function walkEntries(p){

  Object.keys(dailyChecks).forEach(k => { const [d, pid] = k.split("|"); if (pid !== p.id) return; const c = chkRec(d, pid); xs.push({ date: d, k: "確認", t: "今日の確認:" + c.r, x: c.note, ref: "dc|" + k }); });
  Object.keys(weeklyReviews).forEach(k => { const [w, pid] = k.split("|"); if (pid !== p.id) return; const c = weeklyReviews[k]; xs.push({ date: addD(w, 6) < TODAY ? addD(w, 6) : (c.at || w), k: "週の見直し", t: wk(w) + "の見直し:" + c.r, x: c.note, ref: "wr|" + k }); });
  testsOf(p).forEach(t => t.sessions.forEach((s, i) => xs.push({ date: s.date, k: "記録", t: "テスト「" + t.name + "」:" + t.items.filter(it => s.v[it.id] != null).map(it => it.name + " " + fmtV(it, s.v[it.id])).join("・"), x: [s.cond, s.note].filter(Boolean).join("・"), ref: "ts|" + t.id + "|" + i })));
  p.milestones.forEach(m => (m.records || []).forEach((r, i) => xs.push({ date: r.date, k: "記録", t: "節目「" + m.name + "」:" + r.value, x: r.note, ref: "rec|" + m.id + "|" + i })));
  return xs.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
}
let walkKind = "すべて";
function tabWalk(p){
  const all = walkEntries(p), kinds = ["すべて", "確認", "週の見直し", "探り", "予備", "立て直し", "改造", "変更", "記録"], xs = walkKind === "すべて" ? all : all.filter(e => e.k === walkKind);
  const tl = t => t === "goal" ? "到達点" : t === "end" ? "期日" : t.startsWith("ms:") ? "節目「" + ((p.milestones.find(m => "ms:" + m.id === t) || {}).name || "") + "」" : t;

    <div class="card"><h4>根拠を足す</h4><div class="row2"><div class="f"><label>何の根拠か</label><select id="bs-t"><option value="goal">到達点</option><option value="end">期日</option>${mainMs(p).map(m => `<option value="ms:${m.id}">節目「${esc(unbr(m.name))}」</option>`).join("")}</select></div><div class="f"><label>出どころ</label><input id="bs-s" placeholder="例:大学の公表・先輩の話"></div></div>
      <div class="f"><label>根拠</label><textarea id="bs-x" placeholder="例:合格者の平均が78%だった"></textarea></div><button class="btn sm" data-bsadd>足す</button></div></section>`;
}
/* 計画から見る分野の全体像 */
function tabPlanField(p){

}
</script>
<script>
/* ───────── 実力テスト:自分で作ったテストで、実際の実力を継続的に測る ───────── */
const CAD = { 週: 7, "2週": 14, 月: 30 };
const T = id => tests.find(t => t.id === id);
const testsOf = p => tests.filter(t => t.plan === p.id);
const mainTest = p => tests.find(t => t.plan === p.id && t.main);
const sess = t => t.sessions.slice().sort((a, b) => a.date < b.date ? -1 : 1);
const vals = (t, it) => sess(t).filter(s => s.v[it.id] != null).map(s => ({ date: s.date, v: s.v[it.id] }));
const isBetter = (it, a, b) => it.better === "高い" ? a > b : a < b;
const meets = (it, v) => it.better === "高い" ? v >= it.target : v <= it.target;
const fmtV = (it, v) => (Math.round(v * 10) / 10) + it.unit;
const signed = n => (n > 0 ? "+" : "") + (Math.round(n * 10) / 10);
function lineAt(it, d){ const pl = it.line; if (!pl) return null; if (d <= pl[0][0]) return pl[0][1]; for (let i = 1; i < pl.length; i++) if (d <= pl[i][0]) { const [d0, v0] = pl[i - 1], [d1, v1] = pl[i]; return v0 + (v1 - v0) * days(d0, d) / days(d0, d1); } return pl[pl.length - 1][1]; }
function itemStats(t, it){
  const xs = vals(t, it); if (!xs.length) return { n: 0 };
  const last = xs[xs.length - 1], prev = xs[xs.length - 2], first = xs[0];
  const best = xs.reduce((b, x) => isBetter(it, x.v, b.v) ? x : b, xs[0]);
  // 伸び方(1日あたり):最小二乗の傾き
  let slope = 0; if (xs.length >= 2) { const X = xs.map(x => days(first.date, x.date)), Y = xs.map(x => x.v), mx = X.reduce((a, b) => a + b) / X.length, my = Y.reduce((a, b) => a + b) / Y.length;
    const sxx = X.reduce((a, x) => a + (x - mx) ** 2, 0); slope = sxx ? X.reduce((a, x, i) => a + (x - mx) * (Y[i] - my), 0) / sxx : 0; }
  const good = it.better === "高い" ? slope > 0 : slope < 0;
  let eta = null; if (!meets(it, last.v) && good && Math.abs(slope) > 1e-9) eta = addD(last.date, Math.ceil((it.target - last.v) / slope));
  const span = it.target - first.v, att = meets(it, last.v) ? 100 : span ? Math.max(0, Math.min(99, Math.round((last.v - first.v) / span * 100))) : 0;
  return { n: xs.length, xs, last, prev, first, best, slope, good, eta, att, isBest: best === last && xs.length > 1, perWeek: slope * 7 };
}
/* このテストで判定する節目(節目の側に m.cond として持つ) */
function condMs(t){ return plans.flatMap(p => p.milestones.filter(m => m.cond && m.cond.test === t.id).map(m => ({ p, m }))); }
function deadline(t){ const p = P(t.plan), c = condMs(t).filter(x => !isDone(x.m)).sort((a, b) => a.m.date < b.m.date ? -1 : 1)[0]; if (c) return c.m.date; return p ? p.end : null; }
function nextDue(t){ const s = sess(t), last = s[s.length - 1]; return last ? addD(last.date, CAD[t.cadence] || 14) : TODAY; }
function testRisk(p){ let v = 0, d = []; testsOf(p).forEach(t => { const dl = deadline(t); t.items.forEach(it => { const st = itemStats(t, it); if (st.n < 2 || meets(it, st.last.v)) return;
    if (!st.good) { v += 8; d.push(it.name + "が伸びていない"); } else if (st.eta && dl && st.eta > dl) { v += 6; d.push(it.name + "が期日までに届かない見込み"); } });
  const od = days(nextDue(t), TODAY); if (od > 0) { v += Math.min(6, od); d.push("「" + t.name + "」の実施が" + od + "日遅れ"); } });
  return { v: Math.min(18, v), d: d.length ? d.join("・") : "伸びている" }; }

/* 項目のグラフ:記録・目標・予定の線 */
function itemChart(t, it, small){
  const xs = vals(t, it), p = P(t.plan); if (!xs.length) return '<p class="note">まだ記録がない。</p>';
  const W = 340, H = small ? 90 : 140, L = 30, R = 8, Tp = 8, B = 20;
  const dl = deadline(t), d0 = addD(xs[0].date, -7), d1 = dl && dl > TODAY && days(TODAY, dl) <= 100 ? dl : addD(TODAY, Math.max(28, Math.round(days(xs[0].date, TODAY) * .6))), span = Math.max(1, days(d0, d1));
  const all = xs.map(x => x.v).concat([it.target]).concat(it.line ? it.line.map(x => x[1]) : []), lo0 = Math.min(...all), hi0 = Math.max(...all), pad = (hi0 - lo0) * .15 || 1, lo = lo0 - pad, hi = hi0 + pad;
  const X = d => L + days(d0, d) / span * (W - L - R), Y = v => Tp + (it.better === "高い" ? (hi - v) : (v - lo)) / (hi - lo) * (H - Tp - B);
  const rec = xs.map((x, i) => (i ? "L" : "M") + X(x.date).toFixed(1) + "," + Y(x.v).toFixed(1)).join(" ");
  const st = itemStats(t, it), proj = st.eta && st.eta <= d1 ? `<path class="pj" d="M${X(st.last.date)},${Y(st.last.v)} L${X(st.eta)},${Y(it.target)}"/>` : "";
  const ln = it.line ? `<path class="tg" d="${it.line.map((x, i) => (i ? "L" : "M") + X(x[0]).toFixed(1) + "," + Y(x[1]).toFixed(1)).join(" ")}"/>` : "";
  const dlIn = dl && dl <= d1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(it.name)}の記録"><line class="goal" x1="${L}" x2="${W - R}" y1="${Y(it.target)}" y2="${Y(it.target)}"/><text x="2" y="${Y(it.target) + 3}">${Math.round(it.target * 10) / 10}</text>
    <line class="ax" x1="${X(TODAY)}" x2="${X(TODAY)}" y1="${Tp}" y2="${H - B}" style="stroke:var(--shu)"/>${dlIn ? `<line class="ax" x1="${X(dl)}" x2="${X(dl)}" y1="${Tp}" y2="${H - B}" style="stroke-dasharray:3 2"/>` : ""}
    ${ln}${proj}<path class="rc" d="${rec}"/>${xs.map(x => `<circle class="pt" cx="${X(x.date)}" cy="${Y(x.v)}" r="3.2"><title>${esc(md(x.date) + " " + fmtV(it, x.v))}</title></circle>`).join("")}
    <text x="${L}" y="${H - 5}">${md(d0)}</text><text x="${W - R - 30}" y="${H - 5}">${md(d1)}</text></svg>`;
}
function itemLine(t, it){ const st = itemStats(t, it); if (!st.n) return `<span class="note">${esc(it.name)}:まだ</span>`;
  const ok = meets(it, st.last.v), dlt = st.prev ? st.last.v - st.prev.v : 0, imp = st.prev && isBetter(it, st.last.v, st.prev.v);
  return `<div class="ti"><span class="tn">${esc(it.name)}</span><b>${fmtV(it, st.last.v)}</b>${st.prev ? `<small class="${imp ? "up" : dlt ? "dn" : ""}">${imp ? "▲" : dlt ? "▼" : "→"}${signed(dlt)}</small>` : ""}<span class="tb"><i class="${ok ? "ok" : ""}" style="width:${st.att}%"></i></span><small class="note">目標 ${fmtV(it, it.target)}${ok ? "・達成" : ""}</small></div>`; }
function dueTag(t){ const d = days(TODAY, nextDue(t)); return d < 0 ? `<span class="tag" style="color:var(--bad)">実施が${-d}日遅れ</span>` : d === 0 ? `<span class="tag" style="color:var(--shu)">今日実施</span>` : `<span class="tag" style="color:var(--sub)">次はあと${d}日</span>`; }
function testCard(t){ const p = P(t.plan);
  return `<button class="tcard" data-testgo="${t.id}"><div class="th"><b>${esc(t.name)}</b>${dueTag(t)}</div><div class="note">${p ? seal(p.grade) + " " + esc(p.name) : "計画なし"}・${esc(t.cadence)}ごと・${t.sessions.length}回</div>${t.items.map(it => itemLine(t, it)).join("")}</button>`; }

let testSel = null, testPlanF = "";
function viewTests(){

  return `<div class="fbar"><button class="btn sm" data-testnew>+ テストを作る</button><select data-testpf aria-label="計画で絞る"><option value="">すべての計画</option>${orderedPlans().filter(p => testsOf(p).length).map(p => `<option value="${p.id}"${p.id === testPlanF ? " selected" : ""}>${esc(p.name)}</option>`).join("")}</select></div>
    <p class="note" style="margin-top:0">やった量ではなく、実際の実力を測る。自分で作ったテストを決まった間隔で実施し、目標と比べ続ける。</p>
    ${soon.length ? `<section class="sec"><h3>実施が近い・遅れている<small>7日以内</small></h3>${soon.map(testCard).join("")}</section>` : ""}
    <section class="sec"><h3>${soon.length ? "ほかのテスト" : "すべてのテスト"}<small>${xs.length - soon.length}つ</small></h3>${xs.filter(t => !soon.includes(t)).map(testCard).join("") || (soon.length ? '<p class="note">ほかはない。</p>' : '<p class="note">まだない。「テストを作る」から。</p>')}</section>`;
}
function testDetail(t){
  const p = P(t.plan), s = sess(t), conds = condMs(t);
  const items = t.items.map(it => { const st = itemStats(t, it), dl = deadline(t);
    if (!st.n) return `<div class="card"><h4>${esc(it.name)}<small>${it.better}ほど良い・目標 ${fmtV(it, it.target)}</small></h4><p class="note">まだ記録がない。</p></div>`;
    const ok = meets(it, st.last.v), toGo = it.target - st.last.v;

    return `<div class="card"><h4>${esc(it.name)}<small>${it.better}ほど良い</small></h4>
      <div class="big3"><div><span class="note">最新</span><b>${fmtV(it, st.last.v)}</b>${st.isBest ? '<small class="up">自己ベスト</small>' : ""}</div><div><span class="note">前回から</span><b class="${st.prev && isBetter(it, st.last.v, st.prev.v) ? "up" : st.prev && st.last.v !== st.prev.v ? "dn" : ""}">${st.prev ? signed(st.last.v - st.prev.v) + it.unit : "—"}</b></div><div><span class="note">目標まで</span><b>${ok ? "達成" : "あと " + Math.round(Math.abs(toGo) * 10) / 10 + it.unit}</b></div></div>
      ${itemChart(t, it)}<p class="note" style="margin:.2rem 0 0">${fc}。自己ベスト ${fmtV(it, st.best.v)}(${md(st.best.date)})${it.line ? "・点線は予定の線" : ""}${dl && days(TODAY, dl) > 100 ? "・期日 " + md(dl) + " はグラフの外" : "・縦の点線は期日"}・グラフは上ほど良い${it.better === "低い" ? "(低いほど良いので上下を逆にしてある)" : ""}</p></div>`; }).join("");
  const table = s.length ? `<div class="ttable"><table><thead><tr><th>日</th>${t.items.map(it => `<th>${esc(it.name)}<br><small>${esc(it.unit)}</small></th>`).join("")}<th>条件</th></tr></thead><tbody>${s.slice().reverse().map((x, i, arr) => { const pr = arr[i + 1];
      return `<tr><td>${md(x.date)}</td>${t.items.map(it => { const v = x.v[it.id], pv = pr && pr.v[it.id]; const c = v == null || pv == null || v === pv ? "" : isBetter(it, v, pv) ? "up" : "dn"; return `<td class="${c}${v != null && meets(it, v) ? " hit" : ""}">${v == null ? "—" : Math.round(v * 10) / 10}</td>`; }).join("")}<td class="note">${esc(x.cond || "")}${x.note ? "・" + esc(x.note) : ""} <button class="linkx" data-tsdel="${t.id}|${x.date}|${t.sessions.indexOf(x)}">消す</button></td></tr>`; }).join("")}</tbody></table></div>` : "";
  return `<button class="linkx" data-testgo="" style="margin-bottom:.5rem">‹ テストの一覧</button>
    <div class="phead"><div class="k">実力テスト・${esc(t.cadence)}ごと</div><div class="goal">${esc(t.name)}</div><div class="note">${esc(t.note || "")}</div>
      <div class="note" style="margin-top:.2rem">${p ? `計画:<button class="linkx" data-goplan="${p.id}" data-ptab="テスト">${esc(p.name)}</button>・` : ""}${s.length}回実施・${dueTag(t)}</div>
      <div class="fbar" style="margin:.5rem 0 0"><button class="btn sm" data-testrec="${t.id}">実施して記録する</button><button class="btn ghost sm" data-testedit="${t.id}">テストを直す</button></div></div>
    ${conds.length ? `<section class="sec"><h3>このテストで判定する節目</h3>${conds.map(({ p: cp, m }) => { const c = m.cond, it = t.items.find(x => x.id === c.item) || t.items[0], st = itemStats(t, it), ok = st.n && (it.better === "高い" ? st.last.v >= c.value : st.last.v <= c.value);
      return `<div class="basis"><b>${esc(cp.name)}・節目「${esc(unbr(m.name))}」(${md(m.date)})</b><div>${esc(it.name)}が ${c.value}${it.unit}${it.better === "高い" ? "以上" : "以下"}で達成 → 最新 ${st.n ? fmtV(it, st.last.v) : "—"} <b class="st ${ok ? "ok" : "bad"}">${ok ? "達成" : "まだ"}</b></div></div>`; }).join("")}</section>` : ""}
    <section class="sec"><h3>項目ごと</h3>${items}</section>
    ${table ? `<section class="sec"><h3>実施の記録<small>緑=前回より良い・黄=悪い・太字=目標に届いた</small></h3>${table}</section>` : ""}`;
}
/* 計画の中の「テスト」 */

/* 実施して記録する → 結果 */
function openTestRecord(t){

<script>
/* ───────── 計算:今の計画だけ・週の時間・ずれ・見積もりのずれ ───────── */
const live = () => plans.filter(p => !p.status && !drafting(p));   // 進行中の計画だけ(作成中は数えない)
function weekHours(p, w){
  const we = addD(w, 6); if (p.status || p.end < w || p.start > we) return 0;
  const ms = mainMs(p); let h = 0, hit = false;
  ms.forEach(m => { if (!msLive(p, m)) return; const from = prevDate(p, m); if (m.pace && m.pace.min && from <= we && m.date >= w && !isDone(m)) { h += m.pace.amount * m.pace.min / 60; hit = true; } });
  return hit ? h : (+p.hpw || 0);
}
const capOf = w => capacity.base + capacity.ex.filter(x => x.from <= addD(w, 6) && x.to >= w).reduce((a, x) => a + x.delta, 0);
function gapAlerts(){
  const out = [];
  live().forEach(p => { testsOf(p).forEach(t => { const it = t.items[0], st = itemStats(t, it); if (st.n < 2) return;
    const cur = nextMs(p), amount = cur && msProg(cur) ? msProg(cur).pct : prog(p), skill = st.att;
    if (amount - skill >= 30) out.push({ p, t, kind: "量だけ進む", text: "量は進んでいる(" + amount + "%)のに、「" + t.name + "」の" + it.name + "は目標までの " + skill + "% しか来ていない" + (st.good ? "(伸びは遅い)" : "(伸びていない)") + "。やり方を見直す合図" });
    else if (skill - amount >= 25) out.push({ p, t, kind: "力が先に", text: "「" + t.name + "」は伸びている(" + skill + "%)のに、量が遅れている(" + amount + "%)。ペースを下げても届くかもしれない" }); }); });
  return out;
}
function estRatio(){ const xs = lessons.filter(l => l.kind === "完了" && l.planned); return xs.length ? Math.round(xs.reduce((a, l) => a + l.actual / l.planned, 0) / xs.length * 100) / 100 : 1; }
function propose(p, what, council, act){ proposals.push({ id: "pr" + Date.now().toString(36) + Math.random().toString(36).slice(2, 4), plan: p.id, what, council, act, date: TODAY, status: "審議待ち" }); }

/* ───────── 週の締め ───────── */

/* ───────── その他 ───────── */
function viewMore(){
  const items = [ ["sync", "保存と同期", conf ? "GitHubとつながっている" : "まだこの端末の中だけ。GitHubにつなぐ・控えを書き出す"], ["week", "週の見直し", "計画ごとに、この1週間を振り返って決める(毎週必ず)"], ["weekrec", "週の記録", "やった量とテストを入れる"], ["glossary", "定義集", "「覚えた」「一周」など、言葉の判定の基準"], ["kbtypes", "機構の型", "機構を作るときのレール(一手の並び)を作る・直す"], ["load", "負荷", "1週に使う時間と、使える時間を比べる"], ["lessons", "学び", "終わった計画の総括と、見積もりのずれ"],
    ["council", "評議会の案", proposals.filter(x => x.status === "審議待ち").length + "件が審議待ち"], ["notify", "通知", notifyCfg.topic ? "ntfy に送っている" : "テスト・節目・週の締めを知らせる"], ["sound", "音", "効果音のオン・オフと音量"], ["importv", "まとめて入れる・行軍表から移す", "計画・分野・テストをファイルから入れる。行軍表の計画を移す"] ];
  return `<div class="phead"><div class="goal">その他</div></div>${items.map(([k, t, s]) => `<button class="tcard" data-v="${k}" style="border-left-color:var(--ink)"><div class="th"><b>${t}</b><span class="note">›</span></div><div class="note">${esc(s)}</div></button>`).join("")}
    <p class="note" style="margin-top:1.2rem">大計 ${APP_VERSION}</p>`;
}
const backMore = '<button class="linkx" data-v="more" style="margin-bottom:.5rem">‹ その他</button>';

/* 負荷 */
function viewLoad(){
  const w0 = weekStart(TODAY), weeks = Array.from({ length: 12 }, (_, i) => addD(w0, i * 7)), ps = live().filter(p => weeks.some(w => weekHours(p, w) > 0));
  const data = weeks.map(w => ({ w, cap: capOf(w), parts: ps.map(p => [p, weekHours(p, w)]).filter(x => x[1] > 0) })), maxV = Math.max(...data.map(d => Math.max(d.cap, d.parts.reduce((a, x) => a + x[1], 0)))) * 1.1;
  const colors = ["var(--wave)", "var(--ok)", "var(--mid)", "var(--shu)", "var(--ink)", "#7A5C99", "#3C8C8C", "#B08550", "#5F6F86", "#9A5F5F", "#6E8B3D", "#AA7DAA"];
  const col = p => colors[live().indexOf(p) % colors.length];
  const bars = data.map(d => { const tot = d.parts.reduce((a, x) => a + x[1], 0), over = tot > d.cap;
    return `<div class="lw${over ? " over" : ""}"><div class="lb">${d.parts.map(([p, h]) => `<i style="height:${h / maxV * 100}%;background:${col(p)}" title="${esc(p.name + " " + fmtN(h) + "時間")}"></i>`).join("")}<s style="bottom:${d.cap / maxV * 100}%"></s></div><small>${md(d.w)}</small><small class="${over ? "dn" : ""}">${fmtN(tot)}</small></div>`; }).join("");
  const overs = data.filter(d => d.parts.reduce((a, x) => a + x[1], 0) > d.cap);
  return backMore + `<div class="phead"><div class="goal">負荷</div><div class="note">ペースに「1単位あたりの時間」をかけて、1週に使う時間を見込む。線は使える時間。</div></div>

      <div class="cause" style="margin-top:.4rem">${ps.map(p => `<span><i style="display:inline-block;width:9px;height:9px;background:${col(p)};border-radius:2px"></i> ${esc(p.name)}</span>`).join("")}</div></div>
    ${overs.length ? `<div class="card"><h4 style="color:var(--bad)">使える時間を超える週 ${overs.length}つ</h4>${overs.map(d => { const tot = d.parts.reduce((a, x) => a + x[1], 0), top = d.parts.slice().sort((a, b) => b[1] - a[1])[0];
      return `<div class="note">${wk(d.w)}:${fmtN(tot)}時間 / ${d.cap}時間(${fmtN(tot - d.cap)}時間オーバー)。いちばん重いのは「${esc(top[0].name)}」(${fmtN(top[1])}時間)</div>`; }).join("")}<p class="note" style="margin:.4rem 0 0">超える週は、節目をずらす・ペースを分散する・予備をその週に置く、のどれかで先にならしておく。</p></div>` : ""}
    <div class="card"><h4>使える時間</h4><div class="row2"><div class="f"><label>ふだんの1週</label><input id="cap-b" type="number" value="${capacity.base}"></div><button class="btn ghost sm" data-capsave style="align-self:end;margin-bottom:.6rem">変える</button></div>
      ${capacity.ex.map((x, i) => `<div class="wkrow"><div><b>${md(x.from)}〜${md(x.to)}</b><small>${esc(x.note)}</small></div><span class="${x.delta < 0 ? "dn" : "up"}">${x.delta > 0 ? "+" : ""}${x.delta}時間</span><button class="linkx" data-capdel="${i}">消す</button></div>`).join("")}
      <div class="row2" style="margin-top:.4rem"><input id="cx-f" type="date" style="flex:1"><input id="cx-t" type="date" style="flex:1"><input id="cx-d" type="number" placeholder="±時間" style="width:5rem"><input id="cx-n" placeholder="理由(例:模試)" style="flex:2"><button class="btn ghost sm" data-capadd>足す</button></div></div>`;
}

/* 評議会の案 */
function viewCouncil(){
