<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大計</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#26221E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F3EC; --sheet:#FBF9F4; --white:#FFFFFF; --ink:#26221E; --sub:#6E665C; --rule:#DCD5C7; --shu:#B5432F; --shu-soft:#F6E3DE;
  --wave:#2F4F8A; --wave-soft:#E3E8F1; --ok:#3D7A55; --ok-soft:#E1EEE5; --mid:#A2731B; --mid-soft:#F4EAD3; --bad:#B5432F;
  --p1:#E6DCC8; --p2:#D9E2D2; --p3:#D6DEEA; --p4:#EADAD3; --p5:#E2DAE8;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#16130F; --sheet:#1E1A15; --white:#221E18; --ink:#ECE6DB; --sub:#A79E91; --rule:#3A332A; --shu:#E0735F; --shu-soft:#3A221C;
  --wave:#8FA9DA; --wave-soft:#232B3A; --ok:#7DBB95; --ok-soft:#1F3127; --mid:#D9A54B; --mid-soft:#352B17; --bad:#E0735F;
  --p1:#3A3224; --p2:#28352A; --p3:#26303F; --p4:#3D2A25; --p5:#332B3B; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#16130F; --sheet:#1E1A15; --white:#221E18; --ink:#ECE6DB; --sub:#A79E91; --rule:#3A332A; --shu:#E0735F; --shu-soft:#3A221C;
  --wave:#8FA9DA; --wave-soft:#232B3A; --ok:#7DBB95; --ok-soft:#1F3127; --mid:#D9A54B; --mid-soft:#352B17; --bad:#E0735F;
  --p1:#3A3224; --p2:#28352A; --p3:#26303F; --p4:#3D2A25; --p5:#332B3B; color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wave);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:1.1rem 1rem 2rem}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;padding-bottom:.6rem;border-bottom:2px solid var(--ink);margin-bottom:1rem}
.head h1{margin:0;font-size:1.35rem;letter-spacing:.12em}
.head .date{color:var(--sub);font-size:.82rem;text-align:right}
.head .date b{color:var(--ink);font-size:1rem;font-variant-numeric:tabular-nums}
.notice{background:var(--sheet);border-left:3px solid var(--shu);padding:.5rem .75rem;font-size:.84rem;margin:0 0 1rem}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--sheet);border-top:1px solid var(--rule);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;border:none;background:none;padding:.8rem 0;color:var(--sub);font-size:.84rem;border-top:2px solid transparent;margin-top:-1px}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700;border-top-color:var(--ink)}
.note{font-size:.8rem;color:var(--sub)}
.sec{margin-top:1.4rem}
.sec:first-child{margin-top:0}
.sec>h3{font-size:.95rem;margin:0 0 .45rem;letter-spacing:.12em;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.sec>h3 small{font-weight:400;letter-spacing:0;color:var(--sub);font-size:.76rem}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:.25rem .7rem;font-size:.82rem;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.fbar{display:flex;flex-wrap:wrap;gap:.5rem .7rem;align-items:center;margin:0 0 .8rem}
.fbar select{padding:.25rem .4rem;border:1px solid var(--rule);border-radius:3px;background:var(--sheet);font-size:.84rem}
.chk{font-size:.84rem;color:var(--sub);display:inline-flex;gap:.3rem;align-items:center}
.linkx{border:0;background:none;color:var(--wave);font-size:.8rem;text-decoration:underline;padding:0}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:3px;padding:.4rem .9rem}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.shu{background:transparent;color:var(--shu);border-color:var(--shu)}
.btn.sm{padding:.2rem .6rem;font-size:.8rem}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.5rem 1rem;font-size:.86rem;z-index:40;max-width:90vw;border-radius:3px}
[hidden]{display:none!important}
button:disabled{opacity:.4;cursor:default}
.btn{white-space:nowrap}

/* 格・不変・状態 */
.gm{display:inline-block;width:.9rem;height:.9rem;border-radius:50%;flex:none;vertical-align:-.1em}
.gm.g-最重要{background:var(--ink);box-shadow:0 0 0 2px var(--paper),0 0 0 3.5px var(--ink)}
.gm.g-重要{background:var(--ink)}
.gm.g-通常{border:2px solid var(--ink)}
.gm.g-軽易{border:2px dotted var(--sub)}
.fix{display:inline-block;font-size:.68rem;font-weight:700;color:var(--shu);border:1.5px solid var(--shu);padding:0 .3rem;border-radius:2px;line-height:1.5;white-space:nowrap;letter-spacing:.06em}
.st{font-weight:700}.st.ok{color:var(--ok)}.st.mid{color:var(--mid)}.st.bad{color:var(--bad)}
.tag{display:inline-block;font-size:.68rem;font-weight:700;border:1px solid currentColor;border-radius:2px;padding:0 .3rem;line-height:1.5;white-space:nowrap}
.t-確定{color:var(--ink)} .t-予定{color:var(--wave)} .t-仮{color:var(--sub);border-style:dashed}

/* 進捗と危険度のメーター */
.meters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin:.6rem 0 0}
.meter{background:var(--white);border:1px solid var(--rule);border-radius:4px;padding:.4rem .55rem;text-align:left;width:100%}
.meter .ml{font-size:.68rem;color:var(--sub);letter-spacing:.06em}
.meter .mv{font-size:1.2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.meter .mv small{font-size:.7rem;font-weight:700;margin-left:.2rem}
.mbar{height:5px;background:var(--rule);border-radius:3px;position:relative;margin-top:.25rem;overflow:hidden}
.mbar i{position:absolute;inset:0 auto 0 0;border-radius:3px}
.mbar s{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);text-decoration:none}
.lv-安定{color:var(--ok)} .lv-注意{color:var(--mid)} .lv-危険{color:var(--bad)} .lv-崩壊寸前{color:var(--paper);background:var(--bad);padding:0 .25rem;border-radius:2px}
.bg-安定{background:var(--ok)} .bg-注意{background:var(--mid)} .bg-危険,.bg-崩壊寸前{background:var(--bad)}

/* 全体図 */
.plan{display:grid;grid-template-columns:1fr auto;gap:.1rem .8rem;width:100%;text-align:left;border:none;border-left:6px solid var(--ink);background:var(--sheet);border-radius:0 3px 3px 0;padding:.6rem .75rem;margin:.3rem 0}
.plan.t-通常{border-left-color:var(--rule)} .plan.t-軽易{border-left:6px dotted var(--rule)}
.plan.t-最重要{box-shadow:inset 3px 0 0 var(--paper),inset 5px 0 0 var(--ink)}
.plan .nm{font-weight:700;display:flex;gap:.4rem;align-items:center}
.plan .mi{color:var(--sub);font-size:.76rem}
.plan .side{text-align:right;font-size:.74rem;color:var(--sub);white-space:nowrap}
.plan .side b{font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.minibar{grid-column:1/-1;margin:.35rem 0 .1rem}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.25rem .8rem;font-size:.74rem;color:var(--sub);align-items:center}
.msl{display:flex;flex-direction:column;gap:.25rem}
.msi{display:flex;gap:.7rem;align-items:center;width:100%;text-align:left;border:1px solid var(--rule);background:var(--sheet);border-radius:3px;padding:.4rem .6rem}
.msi.soon{border-left:4px solid var(--shu)}
.msd{flex:none;width:3.4rem;display:flex;flex-direction:column;line-height:1.25}
.msd b{font-size:1rem;font-variant-numeric:tabular-nums}
.msd small{font-size:.7rem;color:var(--sub)}
.msi.soon .msd small{color:var(--shu);font-weight:700}
.msn{font-weight:700;display:flex;flex-direction:column;line-height:1.35}
.msn small{font-weight:400;font-size:.74rem;color:var(--sub);display:flex;gap:.3rem;align-items:center}
.fold{display:block;width:100%;border:1px dashed var(--rule);background:transparent;color:var(--sub);border-radius:3px;padding:.35rem;font-size:.82rem;margin:.3rem 0}
.fx{background:var(--sheet);border-left:6px solid var(--shu);border-radius:0 3px 3px 0;padding:.5rem .75rem;margin:.3rem 0;font-size:.86rem}

/* 帯の図(期間・節目) */
.band{position:relative;margin:.2rem 10px}
.band .lrow{position:relative;height:30px;display:flex}
.band .lrow.thin{height:15px}
.band .ltrack{position:relative;flex:1}
.band .lcode{flex:none;width:1.1rem;font-size:.6rem;font-weight:700;line-height:15px;color:var(--sub)}
.band .lcode.r-主{color:var(--ink)}
.band .bover{position:absolute;inset:0;pointer-events:none}.band .bover.m{left:1.1rem}
.band .thin .seg2{top:3px;height:9px;font-size:0;padding:0}
.band .thin .dm{top:2.5px;width:9px;height:9px;transform:translateX(-4.5px) rotate(45deg);border-width:1.5px}
.band .thin .sub{top:5px;width:5px;height:5px;transform:translateX(-2.5px)}
.band .bover.m .bu{top:auto;bottom:-6px}
.band .lmore{font-size:.6rem;color:var(--sub);padding-left:1.1rem}
.band .seg2{position:absolute;top:6px;height:18px;border-radius:2px;font-size:.62rem;line-height:18px;padding:0 .25rem;overflow:hidden;white-space:nowrap;color:var(--ink)}
.band .now{position:absolute;top:0;bottom:0;border-left:2px solid var(--shu);z-index:2}
.band .dm{position:absolute;top:8px;width:13px;height:13px;transform:translateX(-6.5px) rotate(45deg);background:var(--white);border:2px solid var(--ink);z-index:1}
.band .dm.t-予定{border-color:var(--wave)} .band .dm.t-仮{border-style:dashed;border-color:var(--sub)}
.band .dm.done{background:var(--ink)} .band .dm.fixed{border-color:var(--shu);background:var(--shu-soft)}
.band .sub{position:absolute;top:12px;width:6px;height:6px;transform:translateX(-3px);border-radius:50%;background:var(--sub);z-index:1}

.band .bu{position:absolute;top:24px;width:7px;height:5px;transform:translateX(-3.5px);background:var(--mid);border-radius:1px;z-index:1}
.band .chm{position:absolute;top:0;width:2px;height:6px;transform:translateX(-1px);background:var(--sub);z-index:1}
.band .chm.re{background:var(--shu);height:8px;width:3px}
/* どこからでも見える目標 */
.goals{display:flex;gap:.35rem;overflow-x:auto;scrollbar-width:none;margin:-.4rem 0 .9rem;padding-bottom:.1rem}
.goal-c{flex:none;display:flex;flex-direction:column;align-items:flex-start;border:1px solid var(--rule);border-left:3px solid var(--ink);background:var(--sheet);border-radius:0 3px 3px 0;padding:.2rem .55rem;line-height:1.25;text-align:left}
.goal-c{min-width:7.5rem;max-width:11rem}
.goal-c .gn{font-size:.76rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.goal-c small{font-size:.62rem;color:var(--sub);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.goal-c b{font-size:1.05rem;font-variant-numeric:tabular-nums}
.goal-c b small{font-size:.7rem;color:var(--ink)}
.goal-c.near{border-left-color:var(--shu)} .goal-c.near b{color:var(--shu)}
.goal-set{flex:none;border:1px dashed var(--rule);background:transparent;color:var(--sub);border-radius:3px;padding:.2rem .6rem;font-size:.74rem}
/* 総合 */
.sum{background:var(--white);border:1px solid var(--rule);border-radius:6px;padding:.6rem .75rem}
.sum .sg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;margin-top:.5rem}
.sum .sv{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.sum .sl{font-size:.68rem;color:var(--sub)}
.dist{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--rule);margin:.5rem 0 .2rem}
.dist i{display:block;height:100%}
/* 予備 */
.bufbar{display:flex;gap:2px;margin:.3rem 0}
.bufbar i{flex:1;height:14px;border-radius:2px;background:var(--rule)}
.bufbar i.u{background:var(--mid)}
.cause{display:flex;flex-wrap:wrap;gap:.3rem .8rem;font-size:.78rem;color:var(--sub)}
.cause b{color:var(--ink)}
/* 歩み */
.walk{position:relative;padding-left:1.1rem}
.walk::before{content:"";position:absolute;left:.35rem;top:.3rem;bottom:.3rem;border-left:2px solid var(--rule)}
.wk{position:relative;padding:.35rem 0 .45rem}
.wk::before{content:"";position:absolute;left:-.98rem;top:.62rem;width:10px;height:10px;border-radius:50%;background:var(--paper);border:2px solid var(--sub)}
.wk.k-予備::before{border-color:var(--mid);background:var(--mid-soft)} .wk.k-立て直し::before{border-color:var(--shu);background:var(--shu-soft)} .wk.k-変更::before{border-color:var(--ink)} .wk.k-記録::before{border-color:var(--ok);background:var(--ok-soft)} .wk.k-作成::before{border-color:var(--wave);background:var(--wave-soft)}
.wk .wd{font-size:.7rem;color:var(--sub);display:flex;gap:.4rem;align-items:center}
.wk .wt{font-weight:700;font-size:.88rem}
.wk .wx{font-size:.8rem;color:var(--sub)}
.wk .wa{font-size:.84rem;display:flex;gap:.35rem;align-items:center;flex-wrap:wrap}
.wk .wa del{color:var(--sub)}
.kk{display:inline-block;font-size:.66rem;font-weight:700;border-radius:2px;padding:0 .3rem;line-height:1.5}
.kk.k-予備{background:var(--mid-soft);color:var(--mid)} .kk.k-立て直し{background:var(--shu-soft);color:var(--shu)} .kk.k-変更{background:var(--sheet);color:var(--ink);border:1px solid var(--rule)} .kk.k-記録{background:var(--ok-soft);color:var(--ok)} .kk.k-作成{background:var(--wave-soft);color:var(--wave)}
/* 前の版との比べ */
.big .ghost{position:absolute;top:44px;width:13px;height:13px;transform:translateX(-6.5px) rotate(45deg);border:2px dashed var(--sub);background:transparent;z-index:1;opacity:.8}
.big .mv{position:absolute;top:51px;height:0;border-top:1.5px dashed var(--sub);z-index:0}
.big .bu{position:absolute;top:84px;width:9px;height:6px;transform:translateX(-4.5px);background:var(--mid);border-radius:1px}
.big .chm{position:absolute;top:80px;width:3px;height:12px;transform:translateX(-1.5px);background:var(--sub)} .big .chm.re{background:var(--shu)}
.tl-bu{position:absolute;top:30px;width:7px;height:5px;transform:translateX(-3.5px);background:var(--mid);border-radius:1px;z-index:2}
.tl-ch{position:absolute;top:6px;width:3px;height:8px;transform:translateX(-1.5px);background:var(--sub);z-index:2} .tl-ch.re{background:var(--shu)}
.big button.sub,.big button.bu,.big button.chm,.tl-sub{border:0;padding:0;cursor:pointer}
.big button.sub::after,.big button.bu::after,.big button.chm::after,.tl-sub::after{content:"";position:absolute;inset:-8px}
.mslist li.subli{padding-left:1.2rem;font-size:.78rem;color:var(--sub)}
.mslist li.subli b.n{width:2rem;font-weight:400}
.today{border:2px solid var(--ink);background:var(--white);border-radius:6px;overflow:hidden}
.today.done{border-color:var(--rule);background:var(--sheet)}
.today .th2{display:flex;justify-content:space-between;align-items:center;gap:.6rem;width:100%;border:0;background:none;padding:.55rem .75rem;text-align:left}
.today .th2>span:first-child{display:flex;flex-direction:column;line-height:1.3}.today .th2 small{font-size:.72rem;color:var(--sub)}
.dots{display:grid;grid-template-columns:repeat(14,7px);gap:2px;flex:none}
.dcd{display:block;width:7px;height:7px;border-radius:50%;background:var(--rule)}.dcd.some{background:var(--wave-soft);box-shadow:inset 0 0 0 1.5px var(--wave)}.dcd.full{background:var(--wave)}.dcd.now{outline:1.5px solid var(--shu);outline-offset:1px}
.dcbody{padding:0 .75rem .6rem}
.dcrow{border-top:1px solid var(--rule);padding:.45rem 0}
.dcn{display:flex;flex-direction:column;line-height:1.3;margin-bottom:.25rem}.dcn small{font-size:.7rem;color:var(--sub)}
.dcseg{display:flex}.dcseg button{flex:1;padding:.3rem .2rem}
.dcseg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.dcfix{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin-top:.3rem}
.tline{display:flex;gap:.3rem;align-items:center;flex-wrap:wrap;margin:.45rem 0 0}
.tchip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:.1rem .6rem;font-size:.76rem;color:var(--sub)}.tchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kz{border:1.5px dashed var(--mid);background:var(--mid-soft);border-radius:4px;padding:.5rem .7rem;margin:.5rem 0 0;display:flex;flex-direction:column;gap:.1rem;font-size:.86rem}
.kz.on{border-style:solid;border-color:var(--wave);background:var(--wave-soft)}
.blevels{display:grid;grid-template-columns:repeat(4,1fr);gap:.3rem;margin:.1rem 0 .4rem}
.blv{border:1px solid var(--rule);border-radius:4px;padding:.3rem .35rem;display:flex;flex-direction:column;line-height:1.25;background:var(--sheet)}
.blv .bk{font-size:.66rem;color:var(--sub);letter-spacing:.1em}.blv b{font-size:.92rem;font-variant-numeric:tabular-nums}.blv small{font-size:.6rem;color:var(--sub)}
.wr .wb2 i.abs{background:var(--ok);opacity:.55}
.wr .wv small{display:block;font-size:.6rem}.absl{color:var(--ok)}.shl{color:var(--mid)}
.wr{grid-template-columns:5.6rem 1fr 5.4rem}
.kk.k-確認{background:var(--wave-soft);color:var(--wave)} .kk.k-改造{background:var(--ink);color:var(--paper)}
.wk.k-確認::before{border-color:var(--wave)} .wk.k-改造::before{border-color:var(--ink);background:var(--ink)}
details.wx summary{cursor:pointer;color:var(--wave)}
@media (max-width:420px){ .blevels{grid-template-columns:repeat(2,1fr)} }
.duebar{display:flex;flex-direction:column;gap:.3rem;margin:-.4rem 0 .7rem}
.duebar:empty{display:none}
.due{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:2px solid var(--shu);background:var(--shu-soft);border-radius:5px;padding:.35rem .65rem;line-height:1.3}
.due b{font-size:.86rem;color:var(--shu)} .due span{font-size:.76rem;color:var(--ink)}
.due.d2{border-color:var(--wave);background:var(--wave-soft)} .due.d2 b{color:var(--wave)} .due.d2.hot{border-color:var(--shu)}
.due.d3{border-color:var(--ink);background:var(--sheet)} .due.d3 b{color:var(--ink)}
.rs{display:inline-block;font-size:.66rem;font-weight:700;border-radius:2px;padding:0 .3rem;line-height:1.5}
.rs.r-問題なし{background:var(--ok-soft);color:var(--ok)} .rs.r-不安がある{background:var(--mid-soft);color:var(--mid)} .rs.r-直した{background:var(--wave-soft);color:var(--wave)} .rs.r-改造に回す{background:var(--ink);color:var(--paper)}
.dcrow2{display:flex;justify-content:space-between;align-items:center;gap:.5rem;border-top:1px solid var(--rule);padding:.45rem 0}
.cpanel{border:2px solid var(--shu);background:var(--white);border-radius:6px;padding:.65rem .8rem;margin:1.2rem 0 .5rem}
.cpanel.done{border-color:var(--ok)}
.cpanel h4{margin:0 0 .3rem;font-size:.92rem;display:flex;gap:.4rem;align-items:center}
.wrv{border:1px solid var(--rule);border-left:4px solid var(--wave);background:var(--sheet);border-radius:0 4px 4px 0;margin:.35rem 0}
.wrv.done{border-left-color:var(--ok)}
.wrh{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:none;padding:.5rem .65rem;text-align:left}
.wrh>span:first-child{display:flex;flex-direction:column;line-height:1.35}.wrh small{font-size:.74rem;color:var(--sub)}
.wrb{padding:0 .65rem .6rem}

<body>
<div class="wrap">
  <header class="head"><h1>大計</h1><div class="date"><span id="count"></span> <button class="morebtn" data-v="more">その他</button></div></header>
  <div class="duebar" id="duebar" aria-label="やること"></div>
  <div class="goals" id="goals" aria-label="どこからでも見える目標"></div>
  <main id="main"></main>
</div>
<nav class="tabs" aria-label="画面">
  <button data-v="overview">全体図</button>
  <button data-v="timeline">時間軸</button>
  <button data-v="plan">計画</button>
  <button data-v="rel">関係</button>
  <button data-v="field">分野</button>
  <button data-v="tests">テスト</button>
</nav>
<div id="sheet-root"></div>
<script>
/* ───────── 大計:データ ───────── */
const APP_VERSION = "2026-11-01 r7";
const SHO_APP = "https://nisenonamae.github.io/sho/";
const GRADES = ["最重要", "重要", "通常", "軽易"];
const COUNCIL = { 最重要: "最高評議会", 重要: "常任評議会" };
const KINDS = ["前提", "支え", "並走", "一部", "取り合い", "代わり"];
const KIND_WORDS = {
  前提: ["この計画の前提(先にあるとよい)", "この計画が前提になっている計画"],
  支え: ["この計画を支えている計画", "この計画が支えている計画"],
  並走: ["一緒に進める計画", "一緒に進める計画"],
  一部: ["この計画の一部になっている計画", "この計画が一部になっている大きな計画"],
  取り合い: ["時間や力を取り合う計画", "時間や力を取り合う計画"],
  代わり: ["代わりになる計画(どちらかでよい)", "代わりになる計画(どちらかでよい)"],
};
const MS_TYPES = { 確定: "確実にやる。めったに動かさない", 予定: "今の見込み。必要なら動かす", 仮: "変わる見込みが高い。目安" };
const PCOL = ["var(--p1)", "var(--p2)", "var(--p3)", "var(--p4)", "var(--p5)"];

/* 今日(端末の日付)。日をまたいだら、開き直したときに更新する */
const localDay = () => { const t = new Date(); return t.getFullYear() + "-" + String(t.getMonth() + 1).padStart(2, "0") + "-" + String(t.getDate()).padStart(2, "0"); };
let TODAY = localDay();

/* みんなで同期するデータ */
let plans = [], tests = [], fields = [], lessons = [], reviews = [], proposals = [];
let capacity = { base: 40, ex: [] }, headGoals = [], weekClosed = {}, dailyChecks = {}, weeklyReviews = {}, since = "";   // since:大計を使い始めた日(それより前の確認・見直しは「抜け」に数えない)   // weeklyReviews:「週の月曜|計画」→ { r, note }   // dailyChecks:「日付|計画」→ 順調/少し遅れ/大きくずれ
/* この端末だけの設定 */
let recent = [], seCfg = { on: true, vol: 0.6, ui: true, uiVol: 0.45 }, notifyCfg = { topic: "", test: false, ms: false, week: false, risk: false }, sent = {};

const KEY = "taikei-data", LOCAL_KEY = "taikei-local";
const clone = x => JSON.parse(JSON.stringify(x));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function blank(){ return { version: 1, plans: [], tests: [], fields: [], lessons: [], reviews: [], proposals: [], capacity: { base: 40, ex: [] }, headGoals: [], weekClosed: {}, dailyChecks: {}, weeklyReviews: {}, since: "" }; }
function dataOut(){ return { version: 1, plans, tests, fields, lessons, reviews, proposals, capacity, headGoals, weekClosed, dailyChecks, weeklyReviews, since }; }
function dataIn(d){ d = Object.assign(blank(), d || {});
  plans = d.plans; tests = d.tests; fields = d.fields; lessons = d.lessons; reviews = d.reviews; proposals = d.proposals; capacity = d.capacity; headGoals = d.headGoals; weekClosed = d.weekClosed; dailyChecks = d.dailyChecks || {}; weeklyReviews = d.weeklyReviews || {}; since = d.since || "";
  repair(); }
/* 古いデータや欠けたところを直して、どの画面でも落ちないようにする */
function repair(){
  plans.forEach(p => { ["periods", "milestones", "works", "ifs", "basis", "changes", "versions", "fixed", "rels", "fields", "probes"].forEach(k => { if (!Array.isArray(p[k])) p[k] = []; });
    if (!p.req) p.req = { text: p.goal || p.name, kids: [] }; if (p.buffer && !Array.isArray(p.buffer.uses)) p.buffer.uses = [];
    if (!Array.isArray(p.lanes) || !p.lanes.length) { p.lanes = [{ id: "L" + uid(), name: "本筋", rank: "主", periods: p.periods || [] }]; }
    p.lanes.forEach(l => { if (!Array.isArray(l.periods)) l.periods = []; if (!RANKS.includes(l.rank)) l.rank = "主"; if (!l.id) l.id = "L" + uid(); });
    delete p.periods;
    p.milestones.forEach(m => { if (!m.parent && (!m.lane || !p.lanes.some(l => l.id === m.lane))) m.lane = p.lanes[0].id;

/* ───────── 時間軸 ───────── */
let zoom = "2m", tlTop = false, tlMin = "";
const ZOOMS = { "2m": { from: -10, to: 60, px: 9, label: "2か月" }, "6m": { from: -60, to: 160, px: 3.2, label: "半年" }, "1y": { from: -213, to: 160, px: 1.6, label: "1年" } };
function viewTimeline(){
  const z = ZOOMS[zoom], from = addD(TODAY, z.from), to = addD(TODAY, z.to), width = Math.round(days(from, to) * z.px);
  const x = d => Math.max(0, Math.min(width, days(from, d) * z.px));
  // 目盛り:2週は日、2か月は週、それ以外は月
  let ticks = "";
  if (zoom === "2m") { for (let i = 0; i <= days(from, to); i++) { const d = addD(from, i); if (new Date(d + "T00:00:00Z").getUTCDay() === 1) ticks += `<span class="wtick" style="left:${i * z.px}px">${md(d)}</span>`; } }
  else { let d = from.slice(0, 8) + "01"; if (d < from) d = addD(d, 32).slice(0, 8) + "01"; while (d <= to) { ticks += `<span style="left:${x(d)}px">${+d.slice(5, 7) === 1 ? d.slice(0, 4) + "年" : ""}${+d.slice(5, 7)}月</span>`; d = addD(d, 32).slice(0, 8) + "01"; } }

    if (p.head) return `<div class="tl-row tl-grp"><div class="tl-lab">${esc(p.head)}</div><div class="tl-track" style="width:${width}px"></div></div>`;

          ((nx && nx.id === m.id) ? `<span class="tl-msl" style="left:${x(m.date) + 8}px">${esc(msName(m))}</span>` : "")).join("");

    const segsOf = (l, k) => periodsOf(p, l).map((q, i) => `<i style="width:${Math.max(1, x(q.end) - x(q.start))}px;background:${PCOL[(i + k * 2) % 5]}" title="${esc(q.name)}"></i>`).join("");
    const marks = `${(p.buffer ? p.buffer.uses : []).concat((p.mbuf && p.mbuf.uses) || []).filter(u => u.date >= from && u.date <= to).map(u => `<button class="tl-bu" style="left:${x(u.date)}px;border:0;padding:0" data-ms="${esc(md(u.date) + " 予備を" + u.days + "日使った・" + u.cause + (u.note ? "(" + u.note + ")" : ""))}" aria-label="予備"></button>`).join("")}
      ${p.changes.filter(c => c.date >= from && c.date <= to && !["作成", "記録", "確認"].includes(c.kind)).map(c => `<button class="tl-ch${c.kind === "立て直し" ? " re" : ""}" style="left:${x(c.date)}px;border:0;padding:0" data-ms="${esc(md(c.date) + " " + (c.kind || "変更") + ":" + c.what + (c.before || c.after ? " " + c.before + " → " + c.after : ""))}" aria-label="変更"></button>`).join("")}`;

  }).join("");
  return `<div class="fbar"><span class="seg" role="group" aria-label="表示の幅">${Object.entries(ZOOMS).map(([k, v]) => `<button data-zoom="${k}" aria-pressed="${zoom === k}">${v.label}</button>`).join("")}</span>
    <select data-tlmin aria-label="省で絞る"><option value="">すべての省</option>${MINS().map(m => `<option${m === tlMin ? " selected" : ""}>${esc(m)}</option>`).join("")}</select>

    <div class="legend"><span><i class="lg-d"></i>確定</span><span><i class="lg-d" style="border-color:var(--wave)"></i>予定</span><span><i class="lg-d" style="border-style:dashed;border-color:var(--sub)"></i>仮</span><span><i class="lg-d" style="border-color:var(--shu);background:var(--shu-soft)"></i>不変</span><span><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sub)"></i>細かい節目</span><span><i style="display:inline-block;width:8px;height:5px;background:var(--mid)"></i>予備を使った</span><span><i style="display:inline-block;width:3px;height:9px;background:var(--shu)"></i>立て直し</span><span>帯の色の区切り=期間</span></div>

<script>

    <div class="k" style="margin-top:.3rem">なぜ</div><div class="why">${esc(p.why)}</div><div class="k" style="margin-top:.25rem">到達点</div><div class="goal">${esc(p.goal)} ${isFixed(p, "goal") ? fixTag(isFixed(p, "goal")) : ""}</div>

function compCard(p){ const c = completeness(p);

/* 図:計画全体を1枚で */
function tabFigure(p){

    p.changes.filter(c => c.date >= p.start && !["作成", "記録", "確認"].includes(c.kind)).map(c => `<button class="chm${c.kind === "立て直し" ? " re" : ""}" style="left:${pos(c.date)}%" data-ms="${esc(md(c.date) + " " + (c.kind || "変更") + ":" + c.what + (c.before || c.after ? "(" + c.before + " → " + c.after + ")" : ""))}" aria-label="変更"></button>`).join("");

  const lhead = l => { const lp = laneProg(p, l); return `<div class="lhead"><span class="lc r-${l.rank}">${laneCode(p, l)}</span><span class="rk r-${l.rank}">${l.rank}</span><b>${esc(l.name)}</b><small>${lp == null ? "節目なし" : "進捗 " + lp + "%"}</small></div>`; };

        <div class="row2" style="margin:.3rem 0"><label class="note" style="align-self:center">今週(${wk(tw)})やった量</label><input id="wk-in-${m.id}" type="number" step="0.5" inputmode="decimal" style="width:5.5rem;padding:.25rem .4rem;border:1px solid var(--rule);border-radius:3px;background:var(--white)" value="${((m.weeks || []).find(x => x.w === tw) || {}).done ?? ""}"><span class="note" style="align-self:center">${esc(m.unit || "")}</span><button class="btn sm" data-wkrec="${m.id}">記録する</button></div>` : ""}
      ${hist.length > 1 ? `<div class="bl">進捗の推移</div><div class="hist">${hist.map(h => `<span title="${esc(wk(h.w) + " 累計 " + fmtN(h.cum))}"><i style="height:${h.pct || 0}%"></i></span>`).join("")}</div><div class="note">${wk(hist[0].w)} から ${hist.length}週・今 ${hist[hist.length - 1].pct}%</div>` : ""}
      <div class="bl">この節目でやること(週ごとの目安)</div>${(m.tasks || []).length ? `<ul style="list-style:none;padding:0">${m.tasks.map((t, i) => `<li style="display:flex;justify-content:space-between;gap:.4rem"><label><input type="checkbox" data-task="${m.id}:${i}"${(m.taskDone || {})[i] ? " checked" : ""}> ${esc(t)}</label><button class="linkx" data-taskdel="${m.id}:${i}" aria-label="消す">消す</button></li>`).join("")}</ul>` : '<p class="note" style="margin:.1rem 0">まだ書いていない</p>'}
      <div class="row2" style="margin:.2rem 0"><input id="task-in-${m.id}" placeholder="例:週3回、過去問を1教科" style="flex:1;padding:.25rem .4rem;border:1px solid var(--rule);border-radius:3px;background:var(--white)"><button class="btn ghost sm" data-taskadd="${m.id}">足す</button></div>
      ${(m.records || []).length ? `<div class="bl">記録</div>${m.records.map(r => `<div class="rec"><span class="note">${md(r.date)}</span><b>${esc(r.value)}</b><span class="note">${esc(r.note)}</span></div>`).join("")}` : ""}
      ${bs.map(b => `<div class="bl">根拠</div><div>${esc(b.text)} <span class="note">(${esc(b.src)})</span></div>`).join("")}
      ${ifs.map(x => `<div class="ifb"><b>もしも${esc(x.kind)}</b>:${esc(x.trigger)} → ${esc(x.plan)}</div>`).join("")}
      <div class="fbar" style="margin:.4rem 0 0"><button class="btn ${m.done ? "ghost" : ""} sm" data-msdone="${m.id}">${m.done ? "達成を取り消す" : "達成にする"}</button><button class="btn ghost sm" data-rec="${m.id}">結果を記録</button><button class="btn ghost sm" data-shift="${m.id}">ずらす</button>${!sub ? `<button class="btn ghost sm" data-subadd="${m.id}">細かい節目を足す</button>` : ""}<button class="btn ghost sm" data-edit="ms:${m.id}">この節目を直す</button>${COUNCIL[p.grade] && !f && !sub ? `<button class="btn shu sm" data-mkfix="ms:${m.id}">不変にする案</button>` : ""}</div></div>`;
    return `<div class="ms${isDone(m) ? " done" : ""}${sub ? " sub" : ""}" id="ms-${m.id}">${head}${body}</div>`; };
  const laneBlocks = (l, k) => { const per = periodsOf(p, l), lm = laneMs(p, l), used = new Set();
    const inPer = x => lm.filter(m => m.date >= x.start && m.date <= x.end && !used.has(m.id) && used.add(m.id));
    const blocks = (() => {
    return per.map((x, i) => { const ms = inPer(x), now = TODAY >= x.start && TODAY <= x.end, ws = p.works.filter(w => w.start <= x.end && w.end >= x.start && (w.lane && lanesOf(p).some(z => z.id === w.lane) ? w.lane : lanesOf(p)[0].id) === l.id);
    return `<div class="period${now ? " now-p" : ""}" style="border-left-color:${PCOL[(i + k * 2) % 5]}"><div class="ph"><b>${esc(x.name || "期間")}${now ? '<span class="nowmark">いまここ</span>' : ""}</b><small>${md(x.start)}〜${md(x.end)}・${Math.round((days(x.start, x.end) + 1) / 7)}週</small></div>
      ${x.purpose ? `<div class="pp">${esc(x.purpose)}</div>` : ""}${ws.length ? `<div class="pp">${ws.map(w => `<span class="tag" style="color:var(--sub)">${w.kind}</span> ${esc(w.name)}`).join("　")}</div>` : ""}
      ${ms.map(m => msHtml(m) + subsOf(p, m.id).map(s => msHtml(s, true)).join("")).join("") || '<p class="note">この期間に節目はない</p>'}</div>`; }).join("");
    })();
    const rest = lm.filter(m => !used.has(m.id));
    return blocks + (rest.length ? `<div class="period" style="border-left-color:var(--rule)"><div class="ph"><b>期間の外</b></div>${rest.map(m => msHtml(m)).join("")}</div>` : ""); };
  const lp = l => { const v = laneProg(p, l), nx = nextLaneMs(p, l); return `<div class="lhead big2"><span class="lc r-${l.rank}">${laneCode(p, l)}</span><span class="rk r-${l.rank}">${l.rank}</span><b>${esc(l.name)}</b><small>${v == null ? "節目なし" : "進捗 " + v + "%"}${nx ? "・次:" + esc(msName(nx)) + "(" + md(nx.date) + ")" + (nx.pace ? " " + fmtN(nx.pace.amount) + esc(nx.pace.unit) : "") : ""}</small></div>`; };
  const hint = `<p class="note" style="margin-top:0">節目の横の数字は、その節目に届くための週あたりのペース。節目を押すと、週ごとの実績・進捗の推移・やることが開く。計画も節目として並べられ、押すとその計画の中身が開き、「この計画の中へ」で入れる。日ごとのタスクは省と行軍表で扱う。</p>`;
  if (!many) return hint + roadProbes(p) + laneBlocks(L[0], 0);
  const sw = `<div class="fbar"><span class="seg" role="group" aria-label="見せ方">${[["side", "横に並べる"], ["one", "一つずつ"], ["date", "日付順"]].map(([k, t]) => `<button data-roadmode="${k}" aria-pressed="${roadMode === k}">${t}</button>`).join("")}</span></div>`;
  if (roadMode === "date") return sw + hint + roadProbes(p) + `<div class="period" style="border-left-color:var(--rule)">${main.map(m => `<div class="ldate"><span class="lc r-${laneOf(p, m).rank}">${laneCode(p, laneOf(p, m))}</span>${msHtml(m)}</div>` + subsOf(p, m.id).map(s => msHtml(s, true)).join("")).join("") || '<p class="note">節目がない</p>'}</div>`;
  if (roadMode === "one") { const cur = L.find(l => l.id === roadLane[p.id]) || L[0], k = L.indexOf(cur);
    const chips = `<div class="lchips">${L.map(l => `<button class="lchip${l === cur ? " on" : ""}" data-roadlane="${l.id}"><span class="lc r-${l.rank}">${laneCode(p, l)}</span><span>${esc(l.name)}</span></button>`).join("")}</div>`;
    return sw + chips + lp(cur) + roadProbes(p, cur) + laneBlocks(cur, k); }
  /* 横に並べる:道筋ごとの列。節目を押すと、その道筋の「一つずつ」で開く */
  const col = (l, k) => { const lm = laneMs(p, l), used = new Set(), v = laneProg(p, l);
    const crow = m => { const pr = msProg(m), q = m.plan && P(m.plan);
      return `<button class="lcm${isDone(m) ? " done" : ""}" data-lcgo="${l.id}|${m.id}"><span class="d">${md(m.date)}</span><span class="n">${q ? '<span class="tag" style="color:var(--wave)">計画</span> ' : ""}${esc(msName(m))}</span><span class="r">${isDone(m) ? "済" : ago(days(TODAY, m.date))}</span>

    const per = periodsOf(p, l).map((x, i) => { const ms = lm.filter(m => m.date >= x.start && m.date <= x.end && !used.has(m.id) && used.add(m.id)), now = TODAY >= x.start && TODAY <= x.end;
      return `<div class="lcp${now ? " now" : ""}" style="border-left-color:${PCOL[(i + k * 2) % 5]}"><div class="lcph"><b>${esc(x.name || "期間")}</b>${now ? '<span class="nowmark">いまここ</span>' : ""}<small>${md(x.start)}〜${md(x.end)}</small></div>${ms.map(crow).join("") || '<p class="note" style="margin:.1rem 0">節目なし</p>'}</div>`; }).join("");
    const rest = lm.filter(m => !used.has(m.id));
    return `<div class="lcol"><div class="lch"><span class="lc r-${l.rank}">${laneCode(p, l)}</span><span class="rk r-${l.rank}">${l.rank}</span><b>${esc(l.name)}</b></div>
      <div class="lcpr"><span class="mpb"><i style="width:${v || 0}%"></i></span><small>${v == null ? "節目なし" : "進捗 " + v + "%"}</small></div>${roadProbes(p, l)}${per}${rest.length ? `<div class="lcp" style="border-left-color:var(--rule)"><div class="lcph"><b>期間の外</b></div>${rest.map(crow).join("")}</div>` : ""}</div>`; };
  return sw + `<p class="note" style="margin-top:0">道筋を横に並べて見比べる。節目を押すと、その道筋の詳しい道のりが開く。</p><div class="lcols">${L.map(col).join("")}</div>`;
}

/* 歩み:作った・予備を使った・立て直した・変えた・記録した、を1本の流れで */
function walkEntries(p){
  const xs = [];
  if (p.created) xs.push({ date: p.created, k: "作成", t: "計画を作った", x: "到達点:" + p.goal });
  (p.buffer ? p.buffer.uses : []).forEach(u => xs.push({ date: u.date, k: "予備", t: "計画の予備を" + u.days + "日使った", x: u.cause + (u.note ? "・" + u.note : "") }));
  ((p.mbuf && p.mbuf.uses) || []).forEach(u => xs.push({ date: u.date, k: "予備", t: "月の予備を" + u.days + "日使った", x: u.cause + (u.note ? "・" + u.note : "") }));
  p.changes.forEach(c => c.kind === "確認" ? xs.push({ date: c.date, k: "確認", t: "今日の確認:" + c.after }) : xs.push({ date: c.date, k: c.kind || "変更", t: c.what, a: c.before || c.after ? [c.before, c.after] : null, x: (c.reason ? "理由:" + c.reason : "") + (c.cause ? "(原因:" + c.cause + ")" : "") + (c.council ? "・" + c.council : ""), size: c.size, det: c.detail }));
  Object.keys(dailyChecks).forEach(k => { const [d, pid] = k.split("|"); if (pid !== p.id) return; const c = chkRec(d, pid); xs.push({ date: d, k: "確認", t: "今日の確認:" + c.r, x: c.note }); });
  Object.keys(weeklyReviews).forEach(k => { const [w, pid] = k.split("|"); if (pid !== p.id) return; const c = weeklyReviews[k]; xs.push({ date: addD(w, 6) < TODAY ? addD(w, 6) : (c.at || w), k: "週の見直し", t: wk(w) + "の見直し:" + c.r, x: c.note }); });
  testsOf(p).forEach(t => t.sessions.forEach(s => xs.push({ date: s.date, k: "記録", t: "テスト「" + t.name + "」:" + t.items.filter(it => s.v[it.id] != null).map(it => it.name + " " + fmtV(it, s.v[it.id])).join("・"), x: [s.cond, s.note].filter(Boolean).join("・") })));
  p.milestones.forEach(m => (m.records || []).forEach(r => xs.push({ date: r.date, k: "記録", t: "節目「" + m.name + "」:" + r.value, x: r.note })));
  return xs.sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
}
let walkKind = "すべて";
function tabWalk(p){
  const all = walkEntries(p), kinds = ["すべて", "確認", "週の見直し", "探り", "予備", "立て直し", "改造", "変更", "記録"], xs = walkKind === "すべて" ? all : all.filter(e => e.k === walkKind);
  const tl = t => t === "goal" ? "到達点" : t === "end" ? "期日" : t.startsWith("ms:") ? "節目「" + ((p.milestones.find(m => "ms:" + m.id === t) || {}).name || "") + "」" : t;
  const c30 = p.changes.filter(c => days(c.date, TODAY) <= 30).length, b30 = (p.buffer ? p.buffer.uses : []).filter(u => days(u.date, TODAY) <= 30).length;
  return `<div class="card"><h4>この計画の歩み<small>30日で 予備 ${b30}回・変更 ${c30}回</small></h4>
      <div class="fbar" style="margin:.1rem 0 .5rem"><span class="seg" role="group" aria-label="種類で絞る">${kinds.map(k => `<button data-walk="${k}" aria-pressed="${walkKind === k}">${k}</button>`).join("")}</span></div>
      <div class="walk">${xs.map(e => `<div class="wk k-${e.k}"><div class="wd">${md(e.date)}<span class="kk k-${e.k}">${e.k}</span>${e.size ? "大きさ " + e.size : ""}</div><div class="wt">${esc(e.t)}</div>${e.a ? `<div class="wa"><del>${esc(e.a[0])}</del>→<b>${esc(e.a[1])}</b></div>` : ""}${e.x ? `<div class="wx">${esc(e.x)}</div>` : ""}${e.det && e.det.length ? `<details class="wx"><summary>変えたところ ${e.det.length}か所</summary>${e.det.map(x => `<div>・${esc(x)}</div>`).join("")}</details>` : ""}</div>`).join("") || '<p class="note">まだない。</p>'}</div>
      <div class="fbar" style="margin:.5rem 0 0"><button class="btn sm" data-bufuse>予備を使う</button><button class="btn ghost sm" data-replan>立て直す</button><button class="btn ghost sm" data-shift="">節目をずらす</button><button class="btn ghost sm" data-chgoal>到達点・期日を変える</button></div></div>
    <section class="sec"><h3>根拠<small>なぜそう決めたか。振り返るときに見る</small></h3>${p.basis.map((b, bi) => `<div class="basis"><div class="bt" style="display:flex;justify-content:space-between">${esc(tl(b.target))}・${md(b.date)}<button class="linkx" data-bsedit="${bi}">直す</button></div>${esc(b.text)}<div class="note">出どころ:${esc(b.src)}</div></div>`).join("") || '<p class="note">まだない。</p>'}
    <div class="card"><h4>根拠を足す</h4><div class="row2"><div class="f"><label>何の根拠か</label><select id="bs-t"><option value="goal">到達点</option><option value="end">期日</option>${mainMs(p).map(m => `<option value="ms:${m.id}">節目「${esc(m.name)}」</option>`).join("")}</select></div><div class="f"><label>出どころ</label><input id="bs-s" placeholder="例:大学の公表・先輩の話"></div></div>
      <div class="f"><label>根拠</label><textarea id="bs-x" placeholder="例:合格者の平均が78%だった"></textarea></div><button class="btn sm" data-bsadd>足す</button></div></section>`;
}
/* 計画から見る分野の全体像 */
function tabPlanField(p){
  const links = p.fields || [];
  if (!links.length) return `<p class="note">この計画は、まだ分野とつながっていない。</p>${linkFieldForm(p)}`;
  return `<p class="note" style="margin-top:0">この計画が受け持つ分野の全体像。塗り替えは分野のタブと同じものに反映される。</p>` + links.map((l, i) => { const f = fields.find(x => x.id === l.f), n = nodeAt(f.root, l.path);
    return `<div class="card"><h4>${esc(f.name)}${l.path.length ? " › " + esc(n.text) : ""}<small><button class="linkx" data-openfield="${f.id}:${l.path.join(",")}">分野で開く</button> <button class="linkx" data-fdunlink="${i}">外す</button></small></h4>${fieldMiniGrid(f, l.path)}</div>`; }).join("") + linkFieldForm(p);
}
function linkFieldForm(p){
  const opts = fields.flatMap(f => [[f.id, [], f.name]].concat((f.root.kids || []).map((k, i) => [f.id, [i], f.name + " › " + k.text])));
  return `<div class="card"><h4>分野とつなぐ</h4><div class="row2"><div class="f"><select id="fd-l">${opts.map(o => `<option value="${o[0]}|${o[1].join(",")}">${esc(o[2])}</option>`).join("")}</select></div><button class="btn sm" data-fdlink style="align-self:center">つなぐ</button></div></div>`;
}

<script>
/* ───────── 実力テスト:自分で作ったテストで、実際の実力を継続的に測る ───────── */
const CAD = { 週: 7, "2週": 14, 月: 30 };
const T = id => tests.find(t => t.id === id);
const testsOf = p => tests.filter(t => t.plan === p.id);
const mainTest = p => tests.find(t => t.plan === p.id && t.main);
const sess = t => t.sessions.slice().sort((a, b) => a.date < b.date ? -1 : 1);
const vals = (t, it) => sess(t).filter(s => s.v[it.id] != null).map(s => ({ date: s.date, v: s.v[it.id] }));
const isBetter = (it, a, b) => it.better === "高い" ? a > b : a < b;
const meets = (it, v) => it.better === "高い" ? v >= it.target : v <= it.target;
const fmtV = (it, v) => (Math.round(v * 10) / 10) + it.unit;
const signed = n => (n > 0 ? "+" : "") + (Math.round(n * 10) / 10);
function lineAt(it, d){ const pl = it.line; if (!pl) return null; if (d <= pl[0][0]) return pl[0][1]; for (let i = 1; i < pl.length; i++) if (d <= pl[i][0]) { const [d0, v0] = pl[i - 1], [d1, v1] = pl[i]; return v0 + (v1 - v0) * days(d0, d) / days(d0, d1); } return pl[pl.length - 1][1]; }
function itemStats(t, it){
  const xs = vals(t, it); if (!xs.length) return { n: 0 };
  const last = xs[xs.length - 1], prev = xs[xs.length - 2], first = xs[0];
  const best = xs.reduce((b, x) => isBetter(it, x.v, b.v) ? x : b, xs[0]);
  // 伸び方(1日あたり):最小二乗の傾き
  let slope = 0; if (xs.length >= 2) { const X = xs.map(x => days(first.date, x.date)), Y = xs.map(x => x.v), mx = X.reduce((a, b) => a + b) / X.length, my = Y.reduce((a, b) => a + b) / Y.length;
    const sxx = X.reduce((a, x) => a + (x - mx) ** 2, 0); slope = sxx ? X.reduce((a, x, i) => a + (x - mx) * (Y[i] - my), 0) / sxx : 0; }
  const good = it.better === "高い" ? slope > 0 : slope < 0;
  let eta = null; if (!meets(it, last.v) && good && Math.abs(slope) > 1e-9) eta = addD(last.date, Math.ceil((it.target - last.v) / slope));
  const span = it.target - first.v, att = meets(it, last.v) ? 100 : span ? Math.max(0, Math.min(99, Math.round((last.v - first.v) / span * 100))) : 0;
  return { n: xs.length, xs, last, prev, first, best, slope, good, eta, att, isBest: best === last && xs.length > 1, perWeek: slope * 7 };
}

/* 項目のグラフ:記録・目標・予定の線 */

<script>

      ${chosen === "直した" && todays.length ? `<div class="note">今日この計画で変えたこと:${todays.map(x => esc(x.what + (x.after ? "(" + x.after + ")" : ""))).join("、")}</div>` : ""}
      <button class="btn sm" data-dcsave="${p.id}">確認を残す</button>` : "";
  return `<div class="cpanel${c ? " done" : ""}" id="cpanel"><h4>今日の確認${c ? ` <span class="rs r-${c.r}">${c.r}</span>` : ""}</h4>
    ${c && !d ? `${c.note ? `<p style="margin:.1rem 0 .3rem">${esc(c.note)}</p>` : ""}<button class="linkx" data-dcedit="${p.id}">書き直す</button>`
      : `<p class="note" style="margin:0 0 .4rem">この計画を見て、今日の時点で問題がないかを確かめる。問題があったら、その場で直してから「直した」を選ぶ。</p>
      <div class="seg dcseg" role="group" aria-label="今日の確認">${RES.map(x => `<button data-dcpick="${p.id}|${x}" aria-pressed="${chosen === x}">${x}</button>`).join("")}</div>${form}`}
    <p class="note" style="margin:.5rem 0 0">今週の見直し:${wr ? `<span class="rs r-${wr.r}">${wr.r}</span>` : `まだ(日曜まで)<button class="linkx" data-v="week" style="margin-left:.3rem">週の見直しへ</button>`}</p></div>`;
}

/* ───────── 週の記録(数字を入れるだけ) ───────── */
function viewWeekRec(){
  const w = thisWeek(), we = addD(w, 6);
  const rows = live().flatMap(p => lanesOf(p).flatMap(l => { const m = nextLaneMs(p, l); if (!m || !m.pace || !m.total) return []; return [{ p, l, m, cur: (m.weeks || []).find(x => x.w === w) }]; }));
  const dueT = tests.filter(t => !P(t.plan) || !P(t.plan).status).filter(t => nextDue(t) <= we);
  return `<div class="phead"><div class="k">週の記録</div><div class="goal">${wk(w)}(${md(w)}〜${md(we)})</div><div class="note">やった量とテストを入れるだけ。見直しは「週の見直し」で、別にやる。</div></div>
    <section class="sec"><h3>今週やった量</h3>${rows.map(({ p, l, m, cur }) => `<div class="wkrow"><div><b>${esc(p.name)}</b><small>${multiLane(p) ? laneCode(p, l) + " " + esc(l.name) + "・" : ""}節目「${esc(msName(m))}」・ペース ${fmtN(m.pace.amount)}${esc(m.pace.unit)}</small></div><input type="number" step="0.5" inputmode="decimal" data-wkv="${p.id}:${m.id}" value="${cur ? cur.done : ""}"><span class="note">${esc(m.unit || "")}</span></div>`).join("") || '<p class="note">ペースのある節目はない。</p>'}
      ${rows.length ? '<button class="btn sm" data-wkall>まとめて記録する</button>' : ""}</section>
    <section class="sec"><h3>今週の実力テスト<small>${dueT.length}つ</small></h3>${dueT.map(t => `<div class="wkrow"><div><b>${esc(t.name)}</b><small>${P(t.plan) ? esc(P(t.plan).name) : ""}・${days(TODAY, nextDue(t)) < 0 ? -days(TODAY, nextDue(t)) + "日遅れ" : md(nextDue(t)) + "まで"}</small></div><button class="btn ghost sm" data-testrec="${t.id}">実施して記録</button></div>`).join("") || '<p class="note">今週のテストはない。</p>'}</section>`;
}

/* ───────── 週の見直し(計画ごとに必ず) ───────── */
let wrOpen = {}, wrDraft = {};
function weekSummary(p, w){
  const we = addD(w, 6), out = [];
  lanesOf(p).forEach(l => { const m = nextLaneMs(p, l); if (!(m && m.pace && m.total)) return; const x = (m.weeks || []).find(y => y.w === w), j = x ? weekJudge(p, x.done, m.pace.amount) : null;
    out.push((multiLane(p) ? laneCode(p, l) + "(" + l.rank + ")" + l.name + ":" : "量:") + (x ? fmtN(x.done) + "/" + fmtN(m.pace.amount) + (m.unit || "") + "(" + (j === "吸収" ? "週の予備で吸収" : j) + ")" : "まだ記録していない(週の記録で入れる)")); });
  const bu = (p.buffer ? p.buffer.uses : []).concat((p.mbuf && p.mbuf.uses) || []).filter(u => u.date >= w && u.date <= we); if (bu.length) out.push("予備:" + bu.reduce((a, u) => a + u.days, 0) + "日使った");
  const pd = probesOf(p).filter(x => x.status === "済" && x.result && x.result.date >= w && x.result.date <= we).length, pl = probesOf(p).filter(pLate).length;
  if (pd || pl) out.push("探り:" + (pd ? "今週 " + pd + "件の結果が出た" : "") + (pd && pl ? "・" : "") + (pl ? "期限切れ " + pl + "件" : ""));
  const r = risk(p); out.push("危険度:" + r.score + "(" + r.level + ")・いちばん効いている:" + r.parts[0].k);
  const notes = Array.from({ length: 7 }, (_, i) => addD(w, i)).map(d => [d, chkRec(d, p.id)]).filter(([, c]) => c && c.r !== "問題なし");
  const missed = Array.from({ length: 7 }, (_, i) => addD(w, i)).filter(d => d < TODAY && d >= fromDay(p) && !chkRec(d, p.id)).length;
  return { lines: out, notes, missed };
}
function viewWeek(){
  const w = thisWeek(), we = addD(w, 6), ps = activeOrdered(), pw = pendingWeek(), wl = weekLeftDays();
  const card = p => { const rv = wrevRec(w, p.id), s = weekSummary(p, w), open = wrOpen[p.id] != null ? wrOpen[p.id] : !rv, d = wrDraft[p.id];
    const chosen = d ? d.r : null;
    return `<div class="wrv${rv ? " done" : ""}"><button class="wrh" data-wropen="${p.id}"><span><b>${esc(p.name)}</b><small>${rv ? `<span class="rs r-${rv.r}">${rv.r}</span>${rv.note ? " " + esc(rv.note) : ""}` : "まだ"}</small></span><span class="note">${open ? "▴" : "▾"}</span></button>
      ${open ? `<div class="wrb"><ul class="wsum">${s.lines.map(x => `<li>${esc(x)}</li>`).join("")}${s.missed ? `<li style="color:var(--bad)">今週、毎日の確認が ${s.missed}日 抜けている</li>` : ""}</ul>
        <div class="bl">今週の毎日の確認で書いたこと</div>${s.notes.map(([dd, c]) => `<div class="wkn"><span class="note">${md(dd)}</span> <span class="rs r-${c.r}">${c.r}</span> ${esc(c.note)}</div>`).join("") || '<p class="note" style="margin:.1rem 0">なし(毎日「問題なし」)</p>'}
        <div class="fbar" style="margin:.5rem 0 .2rem"><button class="btn ghost sm" data-goplan="${p.id}" data-ptab="図">計画を開いて見る</button></div>
        <div class="seg dcseg" role="group" aria-label="週の見直し">${["問題なし", "不安がある", "直した", "改造に回す"].map(x => `<button data-wrpick="${p.id}|${x}" aria-pressed="${chosen === x || (!d && rv && rv.r === x)}">${x}</button>`).join("")}</div>
        ${chosen && chosen !== "問題なし" ? `<div class="f"><label>${chosen === "直した" ? "何を直したか(必ず書く)" : chosen === "改造に回す" ? "何を組み直すか(必ず書く)" : "何が不安か(必ず書く)"}</label><textarea id="wr-note-${p.id}">${esc(d.note || "")}</textarea></div>` : ""}
        ${chosen ? `<button class="btn sm" data-wrsave="${p.id}">見直しを残す</button>` : ""}</div>` : ""}</div>`; };
  return `<div class="phead"><div class="k">週の見直し</div><div class="goal">${wk(w)}(${md(w)}〜${md(we)})</div><div class="note">計画ごとに、この1週間を振り返って決める。数字を入れるのは「週の記録」で、別にやる。${pw.length ? "のこり " + pw.length + "本・" + (wl === 0 ? "今日まで" : "日曜まであと" + wl + "日") : "今週の見直しは全部済んだ"}</div>
      <div class="fbar" style="margin:.4rem 0 0"><button class="btn ghost sm" data-v="weekrec">週の記録へ</button></div></div>
    ${missedLastWeek().length ? `<div class="gap"><b>先週の見直しが抜けている計画:</b>${missedLastWeek().map(p => esc(p.name)).join("、")}。今週の見直しで、2週分まとめて振り返る。</div>` : ""}
    <section class="sec">${ps.map(card).join("") || '<p class="note">計画がない。</p>'}</section>
    <section class="sec"><h3>来週の見通し<small>${wk(addD(w, 7))}</small></h3>${(() => { const nw = addD(w, 7), ld = live().reduce((a, p) => a + weekHours(p, nw), 0), cp = capOf(nw);
      return `<div class="wkrow"><div><b>使う時間の見込み ${fmtN(ld)}時間 / 使える時間 ${cp}時間</b><small>${ld > cp ? "使える時間を超えている" : "おさまっている"}</small></div><button class="btn ghost sm" data-v="load">負荷を見る</button></div>`; })()}</section>`;
}

/* ───────── 操作(確認・見直し) ───────── */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.due === "today") { const pt = pendingToday(); if (!pt.length) return; const cur = current() === "plan" && P(planId);
    if (cur && pt.includes(cur)) { const el = $("cpanel"); if (el) el.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
    goPlan(pt[0].id, "図"); return; }
  if (b.hasAttribute("data-peek")) { peekOverview = true; render(); return; }
  if (d.dcpick) { const [pid, r] = d.dcpick.split("|"); dcDraft[pid] = { r, note: (dcDraft[pid] || {}).note || "" };
    if (r === "問題なし") { saveCheck(pid, r, ""); return; } render(); setTimeout(() => { const t = $("dc-note"); if (t) t.focus(); }, 30); return; }
  if (d.dcsave) { const pid = d.dcsave, note = ($("dc-note") || {}).value || ""; if (!note.trim()) { toast("内容を書いてください(あとで振り返るため)"); return; } saveCheck(pid, dcDraft[pid].r, note.trim()); return; }
  if (d.dcedit) { const c = chkRec(TODAY, d.dcedit); dcDraft[d.dcedit] = { r: c.r, note: c.note }; render(); return; }
  if (d.wropen) { const rv = wrevRec(thisWeek(), d.wropen); wrOpen[d.wropen] = !(wrOpen[d.wropen] != null ? wrOpen[d.wropen] : !rv); render(); return; }
  if (d.wrpick) { const [pid, r] = d.wrpick.split("|"); const el = $("wr-note-" + pid); wrDraft[pid] = { r, note: el ? el.value : (wrDraft[pid] || {}).note || "" }; render(); return; }
  if (d.wrsave) { const pid = d.wrsave, dr = wrDraft[pid], el = $("wr-note-" + pid), note = el ? el.value.trim() : "";
    if (dr.r !== "問題なし" && !note) { toast("内容を書いてください(あとで振り返るため)"); return; }
    const w = thisWeek(); weeklyReviews[w + "|" + pid] = { r: dr.r, note, at: TODAY }; const p = P(pid);
    if (dr.r === "改造に回す" && !p.draft) p.needsKaizo = TODAY;
    delete wrDraft[pid]; wrOpen[pid] = false; const all = !pendingWeek().length; render(); se(all ? "week" : "rec"); if (all) toast("今週の見直しは全部済んだ。お疲れさま"); return; }
});
function saveCheck(pid, r, note){
  dailyChecks[TODAY + "|" + pid] = { r, note, at: new Date().toTimeString().slice(0, 5) }; delete dcDraft[pid];
  const all = !pendingToday().length; render(); se(all ? "best" : "rec");
  if (all) { toast("今日の確認は全部済んだ"); } else { const nx = pendingToday()[0]; toast("確認を残した。次は「" + nx.name + "」"); }
}

/* ───────── 改造:下書きで組み直し、前と比べてから反映する ───────── */
const DRAFT_KEYS = ["name", "ministry", "grade", "why", "goal", "start", "end", "lanes", "milestones", "buffer", "hpw", "manualProgress", "oneShot", "workDays", "wbuf", "mbuf"];
function startDraft(p){ const data = {}; DRAFT_KEYS.forEach(k => { if (p[k] !== undefined) data[k] = clone(p[k]); }); p.draft = { started: TODAY, data, log: [] }; }
function draftObj(p){ return Object.assign(clone(p.draft.data), { id: p.id, fixed: p.fixed, rels: p.rels, changes: p.draft.log, ifs: p.ifs, basis: p.basis, works: p.works, versions: [], fields: p.fields, req: p.req }); }
function saveDraftObj(p, o){ const data = {}; DRAFT_KEYS.forEach(k => { if (o[k] !== undefined) data[k] = o[k]; }); p.draft.data = data; p.draft.log = o.changes; }
function applyDraft(p, why){
  const snap = { date: TODAY, label: md(TODAY) + "の改造の前", ms: {}, end: p.end }; p.milestones.forEach(m => snap.ms[m.id] = m.date); p.versions.push(snap);
  const n = p.draft.log.length, detail = p.draft.log.map(c => c.what + ":" + c.before + " → " + c.after);
  DRAFT_KEYS.forEach(k => { if (p.draft.data[k] !== undefined) p[k] = p.draft.data[k]; else delete p[k]; });
  p.changes.push({ date: TODAY, kind: "改造", what: "計画を改造した", before: md(p.draft.started) + "からの下書き", after: n + "か所を変えた", reason: why || "(理由なし)", size: "大", detail });
  delete p.draft; delete p.needsKaizo; cmpVer = p.versions.length - 1;
}
function draftBanner(p){
  if (!p.draft) return p.needsKaizo ? `<div class="kz"><b>改造の印</b><span class="note">${md(p.needsKaizo)}の確認で「大きくずれ」。時間をとれるときに組み直す。</span><div class="fbar" style="margin:.3rem 0 0"><button class="btn sm" data-kzstart>改造の下書きを始める</button><button class="linkx" data-kzunmark>印を外す</button></div></div>` : "";
  return `<div class="kz on"><b>改造の下書き</b><span class="note">${md(p.draft.started)}から・${p.draft.log.length}か所を変えた。何日かに分けて進めてよい。反映するまで今の計画はそのまま。</span>
    <div class="fbar" style="margin:.3rem 0 0"><button class="btn sm" data-kzedit>下書きを直す</button><button class="btn ghost sm" data-kzcmp>前と比べる</button><button class="btn ghost sm" data-kzapply>反映する</button><button class="linkx" data-kzdrop>下書きをやめる</button></div></div>`;
}
function openDraftCompare(p){
  const o = draftObj(p);
  sheet(`<h3>改造:前と比べる</h3><div class="pkh">今の計画</div>${band(p)}<div class="pkh">下書き</div>${band(o)}
    <div class="pkh">変えたところ(${p.draft.log.length})</div>${p.draft.log.map(c => `<div class="wkrow"><div><b>${esc(c.what)}</b><small><del>${esc(c.before)}</del> → ${esc(c.after)}</small></div></div>`).join("") || '<p class="note">まだ変えていない。</p>'}`);
}

/* ───────── 操作(改造) ───────── */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  const p = P(planId); if (!p) return;
  if (b.hasAttribute("data-kzstart")) { startDraft(p); closeSheet(); ptab = "図"; render(); toast("改造の下書きを始めた。反映するまで今の計画はそのまま"); return; }
  if (b.hasAttribute("data-kzunmark")) { delete p.needsKaizo; render(); return; }
  if (b.hasAttribute("data-kzedit")) { openEdit(draftObj(p), "", "draft"); return; }
  if (b.hasAttribute("data-kzcmp")) { openDraftCompare(p); return; }
  if (b.hasAttribute("data-kzdrop")) { if (!confirm("改造の下書きをやめる?(今の計画はそのまま)")) return; delete p.draft; render(); return; }
  if (b.hasAttribute("data-kzapply")) { sheet(`<h3>改造を反映する</h3><p class="note">${p.draft.log.length}か所の変更を、今の計画に反映する。前の形は版として残り、図で比べられる。</p><div class="f"><label>改造の理由(歩みに残る)</label><textarea id="kz-why" placeholder="例:冬の模試の日程が出たので、節目を組み直した"></textarea></div><button class="btn" data-kzgo>反映する</button>`); return; }
  if (b.hasAttribute("data-kzgo")) { takeUndo(); applyDraft(p, $("kz-why").value.trim()); closeSheet(); ptab = "図"; render(); se("replan"); toast("改造を反映した。図で前の版と比べられる"); return; }
});
</script>
<script>
/* ───────── 探り:計画を作るための材料を取りに行く(調査・実験・演習) ─────────
   知りたいこと・決めること・期限を決めて行い、分かったことを残す。
   「もし結果がこうなら」は参考の文章として何本でも書いておける(結果のときに選んだりはしない) */
const PKINDS = { 調査: { mark: "調", word: "調べて知る" }, 実験: { mark: "実", word: "やってみて効くか確かめる" }, 演習: { mark: "演", word: "試しにやって量・時間・難しさを測る" } };
const probesOf = p => (p.probes || []);
const pbadge = k => `<span class="pb k-${k}" title="${k}:${PKINDS[k].word}">${PKINDS[k].mark}</span>`;
const pOpen = x => x.status !== "済";
const pLate = x => pOpen(x) && x.limit && x.limit < TODAY;
const waitingFor = (p, m) => probesOf(p).filter(x => pOpen(x) && (x.ms || []).includes(m.id));
let probeOpen = {};
/* 見出し(左・薄い)と、自分で書いた中身(右・濃い)を分けて並べる */
const kv = (k, v) => v ? `<div class="pkv"><span class="k">${k}</span><span class="v">${v}</span></div>` : "";
/* 計画の中の「探り」タブ */
function tabProbe(p){
  const xs = probesOf(p), grp = [["実施中", xs.filter(x => x.status === "実施中")], ["これから", xs.filter(x => x.status === "予定" || !x.status)], ["済んだ", xs.filter(x => x.status === "済").sort((a, b) => (b.result || {}).date < (a.result || {}).date ? -1 : 1)]];
  const card = x => { const l = lanesOf(p).find(z => z.id === x.lane), ms = (x.ms || []).map(id => p.milestones.find(m => m.id === id)).filter(Boolean), open = probeOpen[x.id] != null ? probeOpen[x.id] : x.status !== "済", r = x.result;
    return `<div class="pcard k-${x.kind}${pLate(x) ? " late" : ""}" id="probe-${x.id}"><button class="pch" data-probeopen="${x.id}">${pbadge(x.kind)}<span class="pct"><b>${esc(x.title)}</b><small>${x.status === "済" ? "済・" + md(r.date) : x.limit ? (pLate(x) ? '<span style="color:var(--bad)">期限を' + -days(TODAY, x.limit) + "日過ぎ</span>" : "期限 " + md(x.limit) + "・" + ago(days(TODAY, x.limit))) : "期限なし"}${x.hours ? "・上限 " + x.hours + "時間" : ""}${multiLane(p) && l ? "・" + laneCode(p, l) + " " + esc(l.name) : ""}</small></span><span class="note">${open ? "▴" : "▾"}</span></button>
      ${open ? `<div class="pcb">
        <div class="pkvs">
        ${kv("知りたいこと", esc(x.question))}
        ${kv("決めること", esc(x.decides))}
        ${kv("予想", x.predict ? esc(x.predict) + (x.unit ? `<span class="u">${esc(x.unit)}</span>` : "") : "")}
        ${kv("待っている節目", ms.map(m => esc(msName(m)) + `<span class="u">${md(m.date)}</span>`).join("、"))}
        ${kv("もし結果がこうなら", (x.notes || []).length ? `<ul class="pnotes">${x.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : "")}
        </div>
        ${r ? `<div class="pres"><div class="prh">結果<span>${md(r.date)}</span></div>
          ${kv("分かったこと", esc(r.found))}
          ${kv("実際の値", r.actual ? `<b>${esc(r.actual)}</b><span class="u">${esc(x.unit || "")}</span>${x.predict ? `<span class="u">予想 ${esc(x.predict)}</span>` : ""}` : "")}
          ${kv("予想との違い", esc(r.diff))}
          ${kv("かかった時間", r.spent ? esc(r.spent) + "時間" + (x.hours ? `<span class="u">上限 ${x.hours}時間</span>` : "") : "")}</div>` : ""}
        <div class="fbar" style="margin:.4rem 0 0">${x.status === "予定" || !x.status ? `<button class="btn ghost sm" data-probestart="${x.id}">始める</button>` : ""}${x.status !== "済" ? `<button class="btn sm" data-proberes="${x.id}">結果を書く</button>` : `<button class="btn ghost sm" data-proberes="${x.id}">結果を直す</button>`}<button class="btn ghost sm" data-probeedit="${x.id}">探りを直す</button><button class="linkx" data-probedel="${x.id}" style="color:var(--bad)">消す</button></div></div>` : ""}</div>`; };
  return `<p class="note" style="margin-top:0">計画を作るのに足りない材料を取りに行く。何を知りたいか・それで何を決めるか・いつまでにやるかを決めてから始め、分かったことを残す。</p>
    <div class="fbar"><span class="note">探りを足す:</span>${Object.keys(PKINDS).map(k => `<button class="btn ghost sm pkadd" data-probenew="${k}">${pbadge(k)} ${k}</button>`).join("")}</div>
    <div class="pklegend">${Object.entries(PKINDS).map(([k, v]) => `<span>${pbadge(k)} ${k}:${v.word}</span>`).join("")}</div>
    ${grp.map(([t, ys]) => ys.length ? `<section class="sec"><h3>${t}<small>${ys.length}件</small></h3>${ys.map(card).join("")}</section>` : "").join("") || '<p class="note">まだ探りはない。仮の節目や、見積もりがつかないところがあれば、探りで確かめてから決める。</p>'}`;
}

<script>
/* ───────── 関係 ───────── */
let relMode = "focus", relId = "", relKinds = new Set(["前提", "支え", "一部"]);

}
function relFocus(){

  const block = (k, xs, dir) => xs.length ? `<div class="rb"><div class="rbh"><span class="kind k-${k}">${k}</span>${KIND_WORDS[k][dir]}</div>${xs.map(q => card(q, k)).join("")}</div>` : "";
  const sym = k => [...new Set(ins(k).concat(outs(k)))];
  const up = block("前提", ins("前提"), 0) + block("支え", ins("支え"), 0) + block("一部", ins("一部"), 0);
  const side = block("並走", sym("並走"), 0) + block("取り合い", sym("取り合い"), 0) + block("代わり", sym("代わり"), 0);
  const down = block("前提", outs("前提"), 1) + block("支え", outs("支え"), 1) + block("一部", outs("一部"), 1);
  return pickBtn(p, "rel") + up + `<div class="rcenter">${seal(p.grade)}<div><b>${esc(p.name)}</b><small>${esc(p.ministry)}・進捗 ${prog(p)}%・危険度 ${r.score}(${r.level})</small></div><button class="btn ghost sm" data-goplan="${p.id}">開く</button></div>` + side + down +
    (up + side + down ? "" : '<p class="note">まだ関係がない。下の「つなぐ」から足せる。</p>') +
    `<div class="card"><h4>この計画をつなぐ</h4><div class="row2"><div class="f"><label>相手</label><select id="rl-to">${plans.filter(x => x.id !== p.id).map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("")}</select></div>

      <p class="note" style="margin:0 0 .4rem">前提=先にあるとよい / 支え=あると楽になる / 並走=一緒に進める / 一部=大きな計画の一部 / 取り合い=時間や力を取り合う / 代わり=どちらかでよい</p><button class="btn sm" data-rladd>つなぐ</button></div>`;

function relMap(){

    <div class="phead"><div class="k">分野の全体像・${esc(f.ministry)}</div><div class="goal">${esc(f.name)}</div>${covHtml(f.root)}
      <div class="note">最後に全体像を見直したのは <b style="color:${ago > 14 ? "var(--bad)" : "var(--ink)"}">${ago}日前</b>${linked.length ? "・受け持つ計画:" + linked.map(q => `<button class="linkx" data-goplan="${q.id}" data-ptab="分野">${esc(q.name)}</button>`).join("、") : ""}</div>
      <div class="fbar" style="margin:.4rem 0 0"><button class="btn sm" data-fieldupd>全体像を見直した</button><button class="linkx" data-fielddel style="margin-left:auto;color:var(--bad)">この分野を消す</button></div></div>

    const moved = [m].concat(p.milestones.filter(x => x !== m && !x.parent && laneId(p, x) === laneId(p, m) && x.date > m.date && x.type !== "確定" && !isFixed(p, "ms:" + x.id) && !isDone(x)));

    p.changes.push({ date: TODAY, kind: "変更", what: "計画を終えた", before: "進行中", after: k, reason: res || "", size: "大" });
    headGoals = headGoals.filter(g => g.p !== p.id); closeSheet(); location.hash = "lessons"; se("close"); toast("計画を終えた。学びに残した"); return; }

  if (b.hasAttribute("data-addplan")) { openAddPlan(); return; }

    plans.push({ phase: "作成中", id, ministry: $("ap-m").value.trim() || "未分類", grade: $("ap-g").value, name: n, why: $("ap-w").value.trim(), goal: $("ap-gl").value.trim() || n, start: s0, end: e0, progress: 0, expected: 0, oneShot: $("ap-o").checked,
      buffer: { total: Math.max(2, Math.round(days(s0, e0) / 12)), uses: [] }, periods: [], milestones: [], works: [], ifs: [], basis: [], changes: [], versions: [], fixed: [], rels: [], fields: [], created: TODAY, req: { text: $("ap-gl").value.trim() || n, kids: [] } });
    closeSheet(); goPlan(id, "図"); showComp = true; render(); toast("作成中として足した。形ができたら、いちばん下で始める"); return; }
  if (b.hasAttribute("data-goalset")) { openGoals(); return; }
});

});
